name: Apply v71 length total validation

on:
  push:
    branches:
      - v71-work

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v71-work
          fetch-depth: 0
      - name: Apply v71 patch
        run: python .github/scripts/apply_v71_length_total.py
      - name: Compile changed source
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
      - name: Run length-total regression
        run: python working_source/tests/regression_length_totals.py
      - name: Run core non-fixture regressions
        run: |
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
      - name: Commit staged v71 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_length_totals.py
          git commit -m "Add fail-closed PDF length total validation [skip ci]"
          git push origin HEAD:v71-work

name: Validate v102 review controls

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v102_validate'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract
      - name: Apply patch and test
        run: |
          python .github/scripts/patch_v102_review.py
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          python .github/scripts/run_active_v102_tests.py
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: v102-review-validated-source
          path: |
            working_source/app/reno_scan_updater.py
            working_source/tests/regression_v102_discard_work_orders.py

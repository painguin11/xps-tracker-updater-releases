name: Update post-v95 real fixture docs

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_post_v95_real_fixture_docs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0
      - name: Update documentation
        run: python working_source/tools/update_post_v95_real_fixture_docs.py
      - name: Commit documentation
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git commit -m 'Document post-v95 real fixture validation'
          git push origin HEAD:v95-work

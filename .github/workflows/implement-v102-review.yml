name: Implement v102 review controls

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v102_review_2'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply review changes
        run: |
          set -euo pipefail
          python .github/scripts/patch_v102_review.py
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          python working_source/tests/regression_v102_discard_work_orders.py
          git diff --check

      - name: Run active regression suite
        run: |
          set -euo pipefail
          count=0
          for test in $(find working_source/tests -maxdepth 1 -type f -name 'regression_*.py' | sort); do
            echo "===== $test ====="
            python "$test"
            count=$((count+1))
          done
          echo "PASS: $count regression scripts"

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v102_discard_work_orders.py
          git commit -m 'Add work-order discard review controls'
          git push origin HEAD:v95-work
          git rev-parse HEAD

name: Publish XPS Tracker Updater v81

on:
  push:
    branches:
      - v81-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V81' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated v81 source
        uses: actions/checkout@v4
        with:
          ref: v81-work
          fetch-depth: 0

      - name: Finalize v81 versions and README
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          updater=Path('working_source/app/xps_update.py')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          a=app.read_text(encoding='utf-8')
          u=updater.read_text(encoding='utf-8')
          a,n=re.subn(r"APP_VERSION = ['\"]\d+['\"]", "APP_VERSION = '81'", a, count=1)
          if n!=1: raise SystemExit('APP_VERSION replacement failed')
          u,n=re.subn(r"CURRENT_VERSION = ['\"]\d+['\"]", 'CURRENT_VERSION = "81"', u, count=1)
          if n!=1: raise SystemExit('CURRENT_VERSION replacement failed')
          app.write_text(a,encoding='utf-8')
          updater.write_text(u,encoding='utf-8')
          r=readme.read_text(encoding='utf-8')
          title='Version 81 structural header-row filtering and work-order outline'
          if title not in r:
              r += "\n\nVersion 81 structural header-row filtering and work-order outline\n-----------------------------------------------------------------\n- Carries the actual detected table-header band into pair-row parsing and excludes it before asset OCR/matching, preventing a header from becoming a false row even if OCR accidentally resolves it to a real master pair.\n- Keeps printed total-row exclusion unchanged.\n- Draws failed-total validation borders in Treeview-local coordinates so the top row is included correctly.\n- Extends the visual total-validation border across the entire work-order group while leaving the arithmetic validation activity-specific.\n"
              readme.write_text(r,encoding='utf-8')
          PY

      - name: Compile and run release regressions
        run: |
          python -m pip install --disable-pip-version-check -q numpy opencv-python-headless
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_v81_header_outline.py
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py
          python working_source/tests/regression_v78_rollback.py
          python working_source/tests/regression_v75_811_ocr.py
          python working_source/tests/regression_v74_row_filtering.py
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '81'" in app
          assert 'CURRENT_VERSION = "81"' in updater
          assert "OCR_CACHE_VERSION = 'v6'" in app
          assert "append_note(ps.Cells(rr,notes_col),'MSA')" in app
          assert "header_band_index=prepared.get('header_band_index')" in app
          assert "if header_band_index is not None and band_index==header_band_index:" in app
          assert 'def _total_outline_records(self,check):' in app
          assert 'frame=tk.Frame(self.tree,background=color' in app
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          print('v81 release validation passed.')
          PY

      - name: Commit finalized v81 source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize v81 versions and README [skip ci]'
            git push origin HEAD:v81-work
          fi

      - name: Package app and source bundle
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -name '*.pyc' -delete
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip" XPS_Tracker_Updater)
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          rm -rf "$RUNNER_TEMP/source_v81"
          mkdir -p "$RUNNER_TEMP/source_v81/XPS_Tracker_Updater_Source_v81"
          cp -a working_source/. "$RUNNER_TEMP/source_v81/XPS_Tracker_Updater_Source_v81/"
          find "$RUNNER_TEMP/source_v81" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/source_v81" -name '*.pyc' -delete
          (cd "$RUNNER_TEMP/source_v81" && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v81.zip" XPS_Tracker_Updater_Source_v81)
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip" | tee "$RUNNER_TEMP/v81.sha256"

      - name: Create draft release and upload ZIP
        run: |
          existing="$(gh api -H 'Accept: application/vnd.github+json' repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="v81") | .id' | head -1)"
          if [ -n "$existing" ]; then
            release_id="$existing"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=true -f name='XPS Tracker Updater v81' >/dev/null
          else
            release_id="$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name='v81' -f target_commitish='v81-work' -f name='XPS Tracker Updater v81' -f body='v81 prevents the detected structural table header from being parsed as a false asset row and fixes failed-total outlines so they align with the full work-order group while arithmetic validation remains activity-specific.' -F draft=true --jq .id)"
          fi
          existing_asset="$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq '.assets[]? | select(.name=="XPS_Tracker_Updater_v81.zip") | .id' | head -1)"
          if [ -n "$existing_asset" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$existing_asset" >/dev/null; fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/XPS_Tracker_Updater_v81.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=XPS_Tracker_Updater_v81.zip" >/dev/null
          echo "$release_id" > "$RUNNER_TEMP/release_id"

      - name: Verify checksum and publish release
        run: |
          release_id="$(cat "$RUNNER_TEMP/release_id")"
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v81.sha256")"
          ok=0
          for i in 1 2 3 4 5 6; do
            release_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
            asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v81.zip") | .size')"
            asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v81.zip") | .digest')"
            if [ "${asset_size:-0}" -gt 0 ] && [ "$asset_digest" = "sha256:$local_sha" ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=false >/dev/null
          final_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
          final_url="$(printf '%s' "$final_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v81.zip") | .browser_download_url')"
          test "$final_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v81/XPS_Tracker_Updater_v81.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$final_url" > "$RUNNER_TEMP/verified_url"

      - name: Check out main for manifest/source update
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Commit source bundle, context, and verified manifest
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v81.zip" ./XPS_Tracker_Updater_Source_v81.zip
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'81',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Exclude the exact detected structural table-header band before pair-row asset OCR and matching',
              'Keep printed total-row exclusion unchanged while preventing headers from becoming false asset rows',
              'Align failed-total borders correctly with the top row by drawing them in Treeview-local coordinates',
              'Extend the visual failed-total outline across the complete work-order group while keeping total arithmetic activity-specific'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          context=Path('PROJECT_CONTEXT.md')
          if context.exists():
              text=context.read_text(encoding='utf-8')
              text=re.sub(r'Current production version: \*\*v\d+\*\*\.', 'Current production version: **v81**.', text, count=1)
              if '## Current v81 fixes' not in text:
                  marker='## Current v80 fixes'
                  section="## Current v81 fixes\n\n- The exact detected table-header band is carried into B&C pair-row parsing and excluded before endpoint OCR/matching.\n- Failed-total borders now use Treeview-local coordinates so the first row is outlined correctly.\n- The visual total-validation outline spans the full work-order group while arithmetic validation remains activity-specific.\n\n"
                  if marker in text: text=text.replace(marker,section+marker,1)
                  else: text += '\n\n'+section
              context.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v81.zip update_manifest.json PROJECT_CONTEXT.md
          git commit -m 'Publish v81 source bundle and update manifest'
          git push origin HEAD:main
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="81"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          test -s XPS_Tracker_Updater_Source_v81.zip
          echo 'v81 release, source bundle, context, and manifest verified.'

name: Publish v96 from work branch

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v96_publish_run'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Refuse existing v96 release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v96 >/dev/null 2>&1; then
            echo 'v96 release already exists; refusing overwrite.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v96 >/dev/null 2>&1; then
            echo 'v96 tag already exists; refusing overwrite.'
            exit 1
          fi

      - name: Prepare v96 release source
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(encoding='utf-8')
          s=s.replace("APP_VERSION = '95'", "APP_VERSION = '96'", 1)
          if "APP_VERSION = '96'" not in s:
              raise SystemExit('APP_VERSION bump failed')
          app.write_text(s,encoding='utf-8')

          upd=Path('working_source/app/xps_update.py')
          u=upd.read_text(encoding='utf-8')
          u=u.replace('CURRENT_VERSION = "95"','CURRENT_VERSION = "96"',1)
          if 'CURRENT_VERSION = "96"' not in u:
              raise SystemExit('CURRENT_VERSION bump failed')
          upd.write_text(u,encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          r=readme.read_text(encoding='utf-8')
          entry='''\nXPS Tracker Updater v96\n- Harden Phase 2 Pipe/Cleaning OCR reconciliation so alternate reads can correct real PDF values without manufacturing measurements or worsening already-correct lengths.\n- Preserve digit-bearing R2 IDs and printed upstream/downstream direction; opposite-direction master pairs remain unresolved instead of being force-matched.\n- Route compact tables with usable geometry but incomplete automatic role mapping into the existing Layout Review instead of skipping or crashing.\n- Preserve faint/interrupted compact-row recovery plus the post-v95 MSA review, NEW PIPE suffix-priority, and padded complete endpoint-ID safeguards.\n- Verified against the 8-20, 8-21, 8-25, and 8-27 Phase 2 packet matrix and the full active regression suite.\n'''
          if 'XPS Tracker Updater v96' not in r:
              readme.write_text(r.rstrip()+entry+'\n',encoding='utf-8')
          PY

      - name: Compile and run exact active regression suite
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { echo "===== $1 ====="; python "$1"; }
          run_test working_source/tests/regression_post_v95_new_packet_ocr.py
          run_test working_source/tests/regression_post_v95_padded_endpoint_ids.py
          run_test working_source/tests/regression_post_v95_msa_suffix_review.py
          run_test working_source/tests/regression_v95_faint_compact_rows.py
          run_test working_source/tests/regression_v95_exact_endpoint_priority.py
          run_test working_source/tests/regression_v94_stacked_endpoint_digits.py
          run_test working_source/tests/regression_v93_workorder_low_confidence_blank.py
          run_test working_source/tests/regression_v93_new_asset_notes.py
          run_test working_source/tests/regression_v92_workorder_4_or_5_digits.py
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release source and change scope
        run: |
          set -e
          grep -q "APP_VERSION = '96'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "96"' working_source/app/xps_update.py
          grep -q 'XPS Tracker Updater v96' working_source/app/README_XPS_Tracker_Updater.txt
          find working_source -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -vE '^(working_source/app/reno_scan_updater.py|working_source/app/xps_update.py|working_source/app/README_XPS_Tracker_Updater.txt)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changed files before release commit:'
            echo "$unexpected"
            exit 1
          fi

      - name: Build and validate release ZIP
        run: |
          set -e
          rm -rf dist_v96 verify_v96 XPS_Tracker_Updater_v96.zip
          mkdir -p dist_v96/XPS_Tracker_Updater
          cp -a working_source/app/. dist_v96/XPS_Tracker_Updater/
          find dist_v96 -type d -name __pycache__ -prune -exec rm -rf {} +
          if find dist_v96 -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then
            echo 'Private/customer document found in package.'
            exit 1
          fi
          test -f dist_v96/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist_v96/XPS_Tracker_Updater/xps_update.py
          test -f dist_v96/XPS_Tracker_Updater/run_xps_tracker.bat
          python - <<'PY'
          from pathlib import Path
          assert "APP_VERSION = '96'" in Path('dist_v96/XPS_Tracker_Updater/reno_scan_updater.py').read_text(encoding='utf-8')
          assert 'CURRENT_VERSION = "96"' in Path('dist_v96/XPS_Tracker_Updater/xps_update.py').read_text(encoding='utf-8')
          PY
          cd dist_v96
          zip -qr ../XPS_Tracker_Updater_v96.zip XPS_Tracker_Updater
          cd ..
          unzip -t XPS_Tracker_Updater_v96.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('XPS_Tracker_Updater_v96.zip') as z:
              names=[n for n in z.namelist() if n]
              assert names and all(n.startswith('XPS_Tracker_Updater/') for n in names), names[:10]
              required={
                  'XPS_Tracker_Updater/reno_scan_updater.py',
                  'XPS_Tracker_Updater/xps_update.py',
                  'XPS_Tracker_Updater/run_xps_tracker.bat',
              }
              assert required.issubset(set(names)), required-set(names)
              forbidden=[n for n in names if n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm'))]
              assert not forbidden, forbidden
          print('Validated v96 ZIP structure and private-file exclusion')
          PY
          sha256sum XPS_Tracker_Updater_v96.zip | tee v96.sha256
          stat -c '%s' XPS_Tracker_Updater_v96.zip | tee v96.size

      - name: Commit v96 release source
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          git commit -m 'Release v96 [skip ci]'
          git push origin HEAD:v95-work
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish and re-download v96 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git tag v96 "$RELEASE_COMMIT"
          git push origin v96
          gh release create v96 XPS_Tracker_Updater_v96.zip \
            --target "$RELEASE_COMMIT" \
            --title 'XPS Tracker Updater v96' \
            --notes 'v96 hardens Phase 2 Pipe/Cleaning OCR reconciliation, protects correct values from worse rereads, preserves digit-bearing R2 direction, sends partial compact headers into Layout Review, and includes the post-v95 MSA/suffix/padded-endpoint safeguards. The 8-20, 8-21, 8-25, and 8-27 matrix and full active regression suite were verified before release.'
          expected_sha=$(cut -d' ' -f1 v96.sha256)
          expected_size=$(cat v96.size)
          mkdir -p verify_v96
          gh release download v96 -p XPS_Tracker_Updater_v96.zip -D verify_v96
          actual_sha=$(sha256sum verify_v96/XPS_Tracker_Updater_v96.zip | cut -d' ' -f1)
          actual_size=$(stat -c%s verify_v96/XPS_Tracker_Updater_v96.zip)
          test "$expected_sha" = "$actual_sha"
          test "$expected_size" = "$actual_size"
          release_json=$(gh release view v96 --json tagName,name,isDraft,isPrerelease,url)
          echo "$release_json"
          echo "$release_json" | python -c "import json,sys; d=json.load(sys.stdin); assert d['tagName']=='v96'; assert d['name']=='XPS Tracker Updater v96'; assert d['isDraft'] is False; assert d['isPrerelease'] is False"
          echo "V96_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "V96_SIZE=$actual_size" >> "$GITHUB_ENV"
          echo "Verified public v96 asset SHA=$actual_sha size=$actual_size"

      - name: Advance public updater manifest to v96 only after asset verification
        run: |
          set -e
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('update_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          if str(data.get('version'))!='95':
              raise SystemExit(f"Expected public manifest v95 before advance, got {data.get('version')}")
          data={
            'version':'96',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v96/XPS_Tracker_Updater_v96.zip',
            'sha256':os.environ['V96_SHA'],
            'release_notes':[
              'Harden Phase 2 Pipe/Cleaning OCR reconciliation while keeping corrections grounded in independently observed PDF values',
              'Prevent whole-table Pipe rereads from replacing already-correct measurements with worse OCR alternatives',
              'Preserve digit-bearing R2 IDs and printed upstream/downstream direction so reversed master pairs stay unresolved',
              'Send compact tables with usable geometry but incomplete header-role mapping into Layout Review instead of skipping or crashing',
              'Include the post-v95 MSA review, NEW PIPE suffix-priority, padded endpoint-ID, and faint-row safeguards'
            ]
          }
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git commit -m 'Advance updater manifest to v96'
          git push origin main
          git pull --ff-only origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('update_manifest.json').read_text(encoding='utf-8'))
          assert data['version']=='96'
          assert data['sha256']==os.environ['V96_SHA']
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v96/XPS_Tracker_Updater_v96.zip'
          print('Verified public updater manifest v96')
          PY

      - name: Update canonical docs and remove temporary publish machinery
        run: |
          set -e
          git checkout v95-work
          git pull --ff-only origin v95-work
          python - <<'PY'
          import os, re
          from pathlib import Path

          sha=os.environ['V96_SHA']
          size=os.environ['V96_SIZE']
          commit=os.environ['RELEASE_COMMIT']

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(
              r'## Current production release: v95\n\n- Tag: `v95`\n- Release: `XPS Tracker Updater v95`\n- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v95\.zip`\n- Size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`\n\nThe public updater manifest points to this verified v95 asset\.',
              f'## Current production release: v96\n\n- Tag: `v96`\n- Release: `XPS Tracker Updater v96`\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v96.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n\nThe public updater manifest points to this verified v96 asset.',
              r,
              count=1,
          )
          if '## v96\n' not in r:
              anchor='\n## Development baseline\n'
              section='''\n## v96\n\n- Hardens Phase 2 Pipe/Cleaning OCR reconciliation while keeping corrections grounded in PDF-observed values.\n- Prevents a whole-table Pipe reread from replacing an already-correct measurement with a worse OCR alternative.\n- Preserves digit-bearing R2 IDs and printed direction, leaving opposite-direction master pairs unresolved.\n- Sends compact tables with usable geometry but incomplete automatic role mapping into Layout Review instead of skipping or crashing.\n- Includes the post-v95 MSA review/reversal, NEW PIPE suffix-priority, padded complete endpoint-ID, and faint-row safeguards.\n- Verified against the 8-20, 8-21, 8-25, and 8-27 private Phase 2 matrix plus the full active regression suite.\n'''
              if anchor not in r: raise SystemExit('README development anchor missing')
              r=r.replace(anchor, section+anchor, 1)
          readme.write_text(r,encoding='utf-8')

          ctx=Path('PROJECT_CONTEXT.md')
          c=ctx.read_text(encoding='utf-8')
          c=c.replace('Current production version: **v95**.','Current production version: **v96**.',1)
          c=re.sub(
              r'Public v95 release:\n\n- Tag: `v95`\n- Release title: `XPS Tracker Updater v95`\n- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v95\.zip`\n- Asset size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`\n- `working_source/app/reno_scan_updater\.py`: `APP_VERSION = \'95\'`\n- `working_source/app/xps_update\.py`: `CURRENT_VERSION = "95"`\n- Public `update_manifest\.json` points to that exact v95 asset/checksum\.',
              f'Public v96 release:\n\n- Tag: `v96`\n- Release title: `XPS Tracker Updater v96`\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v96.zip`\n- Asset size: `{size}` bytes\n- SHA-256: `{sha}`\n- `working_source/app/reno_scan_updater.py`: `APP_VERSION = \'96\'`\n- `working_source/app/xps_update.py`: `CURRENT_VERSION = "96"`\n- Public `update_manifest.json` points to that exact v96 asset/checksum.',
              c,
              count=1,
          )
          c=c.replace('### Current unreleased `v95-work` changes','### Current v96 release changes',1)
          c=c.replace('The following development changes are present **after** the public v95 release and\nmust be preserved until they are intentionally released:', 'The following changes are included in public v96 and remain part of the required\nbaseline:',1)
          c=c.replace('they do not change the published v95 release commit above.','they do not change the published v96 release commit above.',1)
          ctx.write_text(c,encoding='utf-8')

          checklist=Path('RELEASE_CHECKLIST.md')
          q=checklist.read_text(encoding='utf-8')
          q=q.replace('current **v95 production baseline**','current **v96 production baseline**',1)
          q=re.sub(
              r'## Current verified production reference\n\nv95 is the current production release:\n\n- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v95\.zip`\n- Size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`\n\nThe public updater manifest points to that verified v95 asset\. The current\n`v95-work` MSA/suffix/padded-endpoint changes are unreleased until the user\nexplicitly says `PUBLISH`\.',
              f'## Current verified production reference\n\nv96 is the current production release:\n\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v96.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n\nThe public updater manifest points to that verified v96 asset. The v96 MSA/suffix/padded-endpoint, OCR reconciliation, R2 direction, and compact-layout safeguards are now part of the published baseline.',
              q,
              count=1,
          )
          checklist.write_text(q,encoding='utf-8')

          for p in (readme,ctx,checklist):
              text=p.read_text(encoding='utf-8')
              if 'v96' not in text: raise SystemExit(f'v96 doc update missing in {p}')
          print('Updated canonical v96 documentation')
          PY
          git rm -f .github/workflows/publish-v96.yml .trigger_v96_publish_run
          git add README.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git commit -m 'Document v96 release and remove publish machinery [skip ci]'
          git push origin HEAD:v95-work

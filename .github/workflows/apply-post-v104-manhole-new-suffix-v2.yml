name: Apply post-v104 NEW MANHOLE suffix fix v2

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_post_v104_manhole_new_suffix_v2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Prove regression fails for the intended DN-1788A bug before patch
        run: |
          set -euo pipefail
          python working_source/tools/apply_post_v104_manhole_new_suffix.py --test-only
          python working_source/tools/fix_post_v104_manhole_new_suffix_harness.py
          set +e
          python working_source/tests/regression_post_v103_manhole_reordered_columns.py > /tmp/red.log 2>&1
          RC=$?
          set -e
          cat /tmp/red.log
          if [ "$RC" -eq 0 ]; then
            echo 'Expected DN-1788A NEW MANHOLE regression to fail against v104 source.' >&2
            exit 1
          fi
          grep -q 'expected 37 physical rows including NEW DN-1788A' /tmp/red.log
          echo 'Confirmed red state: v104 collapses mixed DN-1788 / DN-1788A evidence instead of retaining the confirmed new suffix.'
          git checkout -- working_source/tests/regression_post_v103_manhole_reordered_columns.py working_source/tests/regression_post_v102_manhole_expected_count_retry.py

      - name: Apply source, regression, compatibility, and documentation fix
        run: |
          set -euo pipefail
          python working_source/tools/apply_post_v104_manhole_new_suffix.py
          python working_source/tools/fix_post_v104_manhole_new_suffix_harness.py
          python -m py_compile working_source/app/reno_scan_updater.py
          git diff --check

      - name: Run targeted Manhole regressions
        run: |
          set -euo pipefail
          python working_source/tests/regression_post_v103_manhole_reordered_columns.py
          python working_source/tests/regression_post_v102_manhole_expected_count_retry.py

      - name: Run full active regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          tests=[
            'regression_post_v103_manhole_reordered_columns.py',
            'regression_post_v102_manhole_expected_count_retry.py',
            'regression_post_v102_manhole_partial_tokens.py',
            'regression_post_v100_826_trouble_geometry.py',
            'regression_post_v100_trouble_cells.py',
            'regression_trouble_workbook.py',
            'regression_post_v99_faint_vertical_grid.py',
            'regression_post_v98_short_wide_compact_table.py',
            'regression_post_v97_cleaning_clipped_digits.py',
            'regression_post_v96_msa_editable_fields.py',
            'regression_post_v95_new_packet_ocr.py',
            'regression_post_v95_padded_endpoint_ids.py',
            'regression_post_v95_msa_suffix_review.py',
            'regression_v95_faint_compact_rows.py',
            'regression_v95_exact_endpoint_priority.py',
            'regression_v94_stacked_endpoint_digits.py',
            'regression_v93_workorder_low_confidence_blank.py',
            'regression_v93_new_asset_notes.py',
            'regression_v92_workorder_4_or_5_digits.py',
            'regression_v91_workorder_color_ocr.py',
            'regression_v91_new_asset_preview_and_endpoint_recovery.py',
            'regression_v90_review_ui.py',
            'regression_v89_review_workflow.py',
            'regression_v89_printed_pair_identity.py',
            'regression_v89_manhole_count_and_final_total.py',
            'regression_v88_continuations.py',
            'regression_v87_total_summary_separator.py',
            'regression_v86_assets_and_edit.py',
            'regression_v85_edit_row_previews.py',
            'regression_v85_mandatory_rows_and_length_votes.py',
            'regression_v84_real_packet_length_logic.py',
            'regression_v83_length_recovery.py',
            'regression_v83_exact_pdf_numbers.py',
            'regression_v83_total_preview_group_errors.py',
            'regression_v82_pair_video_lengths.py',
            'regression_v82_master_asset_format.py',
            'regression_v82_suffix_guard.py',
            'regression_v82_cleaning_header_noise.py',
            'regression_v82_layout_threshold.py',
            'regression_v81_header_outline.py',
            'regression_v80_ocr_total_ui.py',
            'regression_v79_layout_speed.py',
            'regression_v78_rollback.py',
            'regression_v75_811_ocr.py',
            'regression_v74_row_filtering.py',
            'regression_v73_total_dates.py',
            'regression_compact_table_fallback.py',
            'regression_length_totals.py',
            'regression_split_pipes.py',
            'regression_new_assets.py',
            'regression_master_insert.py',
            'regression_r2_endpoint_ocr.py',
            'regression_v102_review_wrapper.py',
          ]
          root=Path('working_source/tests')
          for name in tests:
              path=root/name
              if not path.exists(): raise SystemExit(f'Missing active regression: {path}')
              print(f'===== {path} =====',flush=True)
              subprocess.run([sys.executable,str(path)],check=True)
          print(f'FULL ACTIVE REGRESSION SUITE: {len(tests)}/{len(tests)} passed')
          PY
          git diff --check

      - name: Commit tested fix and clean all temporary machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-post-v104-manhole-new-suffix.yml
          git rm -f .github/workflows/apply-post-v104-manhole-new-suffix-v2.yml
          git rm -f .trigger_post_v104_manhole_new_suffix
          git rm -f .trigger_post_v104_manhole_new_suffix_v2
          git rm -f working_source/tools/apply_post_v104_manhole_new_suffix.py
          git rm -f working_source/tools/fix_post_v104_manhole_new_suffix_harness.py
          git add working_source/app/reno_scan_updater.py
          git add working_source/tests/regression_post_v103_manhole_reordered_columns.py
          git add working_source/tests/regression_post_v102_manhole_expected_count_retry.py
          git add PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git add working_source/docs/PROJECT_CONTEXT.md working_source/docs/RELEASE_CHECKLIST.md
          git diff --cached --check
          git commit -m 'Preserve confirmed new Manhole suffixes'
          git push origin HEAD:v95-work

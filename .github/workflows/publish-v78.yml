name: Publish XPS Tracker Updater v78

on:
  push:
    branches:
      - v78-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V78' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated v78 source
        uses: actions/checkout@v4
        with:
          ref: v78-work
          fetch-depth: 0

      - name: Compile and run release regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_v78_rollback.py
          python working_source/tests/regression_v75_811_ocr.py
          python working_source/tests/regression_v74_row_filtering.py
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '78'" in app
          assert 'CURRENT_VERSION = "78"' in updater
          assert "OCR_CACHE_VERSION = 'v5'" in app
          assert 'def _batch_cleaning_length_candidates' in app
          assert 'def retry_total_length_ocr' not in app
          assert 'def _simple_cleaning_length_candidates' not in app
          print('v78 release source guard passed.')
          PY

      - name: Package app and source bundle
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -name '*.pyc' -delete
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip" XPS_Tracker_Updater)
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          rm -rf "$RUNNER_TEMP/source_v78"
          mkdir -p "$RUNNER_TEMP/source_v78/XPS_Tracker_Updater_Source_v78"
          cp -a working_source/. "$RUNNER_TEMP/source_v78/XPS_Tracker_Updater_Source_v78/"
          find "$RUNNER_TEMP/source_v78" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/source_v78" -name '*.pyc' -delete
          (cd "$RUNNER_TEMP/source_v78" && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v78.zip" XPS_Tracker_Updater_Source_v78)
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip" | tee "$RUNNER_TEMP/v78.sha256"

      - name: Create draft release and upload ZIP
        run: |
          existing="$(gh api -H 'Accept: application/vnd.github+json' repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="v78") | .id' | head -1)"
          if [ -n "$existing" ]; then
            release_id="$existing"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=true -f name='XPS Tracker Updater v78' >/dev/null
          else
            release_id="$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name='v78' -f target_commitish='v78-work' -f name='XPS Tracker Updater v78' -f body='v78 replaces the v76/v77 cleaning-length OCR regressions with aligned Wheel Walk column OCR. The printed PDF total remains validation-only and cannot silently rewrite row lengths.' -F draft=true --jq .id)"
          fi
          existing_asset="$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq '.assets[]? | select(.name=="XPS_Tracker_Updater_v78.zip") | .id' | head -1)"
          if [ -n "$existing_asset" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$existing_asset" >/dev/null
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/XPS_Tracker_Updater_v78.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=XPS_Tracker_Updater_v78.zip" >/dev/null
          echo "$release_id" > "$RUNNER_TEMP/release_id"

      - name: Verify checksum and publish release
        run: |
          release_id="$(cat "$RUNNER_TEMP/release_id")"
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v78.sha256")"
          ok=0
          for i in 1 2 3 4 5 6; do
            release_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
            asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v78.zip") | .size')"
            asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v78.zip") | .digest')"
            if [ "${asset_size:-0}" -gt 0 ] && [ "$asset_digest" = "sha256:$local_sha" ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=false >/dev/null
          final_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
          final_url="$(printf '%s' "$final_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v78.zip") | .browser_download_url')"
          test "$final_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v78/XPS_Tracker_Updater_v78.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$final_url" > "$RUNNER_TEMP/verified_url"

      - name: Check out main for manifest and source bundle
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Update manifest and source bundle
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v78.zip" ./XPS_Tracker_Updater_Source_v78.zip
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'78',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Read cleaning Wheel Walk lengths as one aligned table column instead of isolated ruled cells',
              'Trim table-border pixels without cropping right-aligned final digits',
              'Map each OCR-observed value back to its detected row with v75 per-cell OCR only as a fallback',
              'Remove v76/v77 automatic total-driven row reselection and simple-first OCR regressions',
              'Keep PDF total validation fail-closed without allowing it to rewrite row lengths',
              'Use a fresh v5 OCR cache namespace'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          context=Path('PROJECT_CONTEXT.md')
          if context.exists():
              text=context.read_text(encoding='utf-8')
              marker='## Current Production Release\n'
              block=(marker+'- **v78**\n- Cleaning Wheel Walk values use aligned column OCR; v75 cell OCR is fallback-only.\n'
                     '- The PDF total is validation-only and never rewrites row lengths.\n'
                     '- OCR cache namespace is v5.\n\n')
              if marker in text:
                  start=text.index(marker)
                  next_section=text.find('\n## ',start+len(marker))
                  text=block+(text[next_section+1:] if next_section!=-1 else '')
              else:
                  text=block+text
              context.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v78.zip update_manifest.json PROJECT_CONTEXT.md
          git commit -m 'Publish v78 source bundle and update manifest'
          git push origin HEAD:main
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="78"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          test -s XPS_Tracker_Updater_Source_v78.zip
          echo 'v78 release, source bundle, and manifest verified.'

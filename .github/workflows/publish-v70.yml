name: Publish XPS Tracker Updater v70

on:
  push:
    branches:
      - v70-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out v70 working source
        uses: actions/checkout@v4
        with:
          ref: v70-work
          fetch-depth: 0

      - name: Set v70 versions and bundled release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('working_source/app/reno_scan_updater.py')
          text=app.read_text(encoding='utf-8')
          if "APP_VERSION = '69'" in text:
              text=text.replace("APP_VERSION = '69'","APP_VERSION = '70'",1)
          elif "APP_VERSION = '70'" not in text:
              raise SystemExit('Unexpected APP_VERSION')
          app.write_text(text,encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          text=updater.read_text(encoding='utf-8')
          if 'CURRENT_VERSION = "69"' in text:
              text=text.replace('CURRENT_VERSION = "69"','CURRENT_VERSION = "70"',1)
          elif 'CURRENT_VERSION = "70"' not in text:
              raise SystemExit('Unexpected CURRENT_VERSION')
          updater.write_text(text,encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          text=readme.read_text(encoding='utf-8')
          if 'Version 70 layout confidence, DPI, and cleaning headers' not in text:
              text += '''\n\nVersion 70 layout confidence, DPI, and cleaning headers\n------------------------------------------------------\n- Skips the PDF table-layout confirmation popup when native detection is 100%\n  confident and all four required column roles are present.\n- Makes the main UI DPI-aware so buttons, summary rows, and summary columns keep\n  readable proportions on computers using different Windows display scaling.\n- Allows Asset / Nodes and Status to use extra window width while retaining the\n  horizontal scrollbar on smaller displays.\n- Preserves confidently recognized partial table-header roles instead of\n  discarding them when one role is missing.\n- For B&C cleaning tables, recognizes the final Date column plus an immediately\n  preceding Length-labelled column as Cleaning Date and Wheel Walk when OCR\n  splits the narrow printed headers.\n'''
          readme.write_text(text,encoding='utf-8')
          PY

      - name: Compile app and updater
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py

      - name: Verify v70 versions and scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '70'" in app
          assert 'CURRENT_VERSION = "70"' in updater
          assert "layout.get('confidence',0)>=100" in app
          assert "all(k in detected_roles for k in ('up','down','value','date'))" in app
          assert 'def ui_scale_for(window):' in app
          assert "stretch=c in ('asset','status')" in app
          assert "date_ci==len(cells)-1" in app
          assert "'length' in (prev[1] or '')" in app
          assert "return (best or None),best_cells" in app
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          print('Version and scoped-fix checks passed.')
          PY

      - name: Run non-fixture regressions
        run: |
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          echo 'Fixture-only regressions are not stored in this public repository and are intentionally not run here.'

      - name: Package release and source bundle
        run: |
          find working_source -type d -name __pycache__ -prune -exec rm -rf {} +
          find working_source -name '*.pyc' -delete
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip" XPS_Tracker_Updater)
          (cd working_source && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v70.zip" app tests -x '*/__pycache__/*' '*.pyc')
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip"
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v70.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip" | tee "$RUNNER_TEMP/v70.sha256"

      - name: Save final v70 working source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          if ! git diff --cached --quiet; then
            git commit -m "Finalize v70 app source [skip ci]"
            git push origin HEAD:v70-work
          fi

      - name: Check out main for production source bundle
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Commit v70 source bundle and project context to main
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v70.zip" ./XPS_Tracker_Updater_Source_v70.zip
          python - <<'PY'
          from pathlib import Path
          path=Path('PROJECT_CONTEXT.md')
          text=path.read_text(encoding='utf-8')
          text=text.replace('Current production version: **v69**. The repository\'s v69 source bundle contains',
                            'Current production version: **v70**. The repository\'s v70 source bundle contains',1)
          marker='## Current v69 fixes\n'
          section='''## Current v70 fixes\n\n- A table-layout confirmation popup is skipped only when native detection is\n  100% confident and all four required roles are already mapped.\n- Main-window fixed pixel dimensions are scaled using the current Windows DPI;\n  summary rows/columns and the Analyze button remain readable across display\n  scaling settings, and Asset / Nodes plus Status can expand with the window.\n- Pair-table header detection preserves recognized partial roles instead of\n  discarding them when one role is missing.\n- B&C cleaning tables can recover a narrow final Wheel Walk / Cleaning Date pair\n  when OCR recognizes the last column as Date and the immediately preceding\n  column as Length.\n\n'''
          if '## Current v70 fixes' not in text:
              text=text.replace(marker,section+marker,1)
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v70.zip PROJECT_CONTEXT.md
          git commit -m "Add XPS Tracker Updater v70 source bundle"
          git push origin HEAD:main

      - name: Create public v70 release
        working-directory: mainrepo
        run: |
          if gh release view v70 >/dev/null 2>&1; then
            echo 'v70 release already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v70 "$RUNNER_TEMP/XPS_Tracker_Updater_v70.zip" \
            --target main \
            --title 'XPS Tracker Updater v70' \
            --notes $'v70 fixes three UI/table-layout issues:\n\n- Skips table-layout confirmation when native detection is already 100% complete.\n- Makes the main UI and live-summary sizing DPI-aware across Windows display-scaling settings.\n- Fixes B&C cleaning header detection when Wheel Walk Length is OCRed as a generic Length header next to the final Date column.\n\nThe Trouble Ticket reading and MSA-to-master-note changes are not part of this release yet.'

      - name: Verify public release asset checksum
        working-directory: mainrepo
        run: |
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v70.sha256")"
          release_json="$(gh api repos/${{ github.repository }}/releases/tags/v70)"
          asset_name="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v70.zip") | .name')"
          asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v70.zip") | .size')"
          asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v70.zip") | .digest')"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v70.zip") | .browser_download_url')"
          test "$asset_name" = 'XPS_Tracker_Updater_v70.zip'
          test "$asset_size" -gt 0
          test "$asset_digest" = "sha256:$local_sha"
          test "$asset_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v70/XPS_Tracker_Updater_v70.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$asset_url" > "$RUNNER_TEMP/verified_url"
          echo "Verified $asset_name ($asset_size bytes) $asset_digest"

      - name: Update auto-update manifest only after asset verification
        working-directory: mainrepo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'70',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Skip table-layout confirmation when native detection is already 100% complete',
              'Scale the main UI and live summary correctly across Windows DPI settings',
              'Recover B&C cleaning Wheel Walk and Cleaning Date roles from narrow Length/Date headers',
              'Preserve partial recognized header roles instead of blanking them when another role is missing'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git commit -m 'Point auto-updater manifest to v70'
          git push origin HEAD:main

      - name: Verify committed manifest
        working-directory: mainrepo
        run: |
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="70"'
          printf '%s\n' "$remote_manifest" | jq -e '.download_url=="https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v70/XPS_Tracker_Updater_v70.zip"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          echo 'v70 manifest verified.'

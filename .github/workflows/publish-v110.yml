name: Publish XPS Tracker Updater v110

on:
  push:
    branches: [v95-work]
    paths: ['.trigger_publish_v110']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current development branch
        uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Preflight version release and privacy safeguards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v95-work"
          if gh release view v110 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'v110 already published; refusing overwrite' >&2; exit 1; fi
          test -z "$(git ls-remote --tags origin refs/tags/v110)" || { echo 'v110 tag exists' >&2; exit 1; }
          if git ls-files | grep -Ei '\.(pdf|xlsx|xls|xlsm)$'; then echo 'Private/customer document is tracked' >&2; exit 1; fi
          git fetch origin main
          python - <<'PY'
          import re,subprocess,json
          from pathlib import Path
          root=Path('working_source/app')
          a=(root/'reno_scan_updater.py').read_text(encoding='utf-8')
          b=(root/'xps_update.py').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]109['\"]",a,re.M)
          assert re.search(r"^CURRENT_VERSION\s*=\s*['\"]109['\"]",b,re.M)
          assert all(s in a for s in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket','def _border_isolated_length_evidence','def _year15_compact_skew_retry','def _read_sheet_date_evidence'))
          old=json.loads(subprocess.check_output(['git','show','origin/main:update_manifest.json'],text=True))
          assert str(old['version'])=='109', 'unexpected production manifest; do not overwrite'
          print('v110 preflight: source, scope, release uniqueness, privacy and production baseline passed')
          PY

      - name: Update application and bundled README to v110
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(encoding='utf-8')
          s,n=re.subn(r"^APP_VERSION\s*=\s*['\"]109['\"]", "APP_VERSION = '110'",s,count=1,flags=re.M)
          assert n==1
          app.write_text(s,encoding='utf-8')
          updater=Path('working_source/app/xps_update.py')
          s=updater.read_text(encoding='utf-8')
          s,n=re.subn(r"^CURRENT_VERSION\s*=\s*['\"]109['\"]",'CURRENT_VERSION = "110"',s,count=1,flags=re.M)
          assert n==1
          updater.write_text(s,encoding='utf-8')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          s=readme.read_text(encoding='utf-8')
          old='XPS Tracker Updater v109\n========================'
          assert s.startswith(old)
          s=s.replace(old,'XPS Tracker Updater v110\n========================',1)
          s=s.replace('Current status (October 12, 2026)','Current status (October 13, 2026)',1)
          old_status=('Production release: v109. Development: v95-work / working_source.\n'
                      'Version sections below are release history; later changes supersede earlier ones.\n'
                      'v109 recovers missing Pipe rows on slightly skewed compact B&C tables,\n'
                      'without modifying normally aligned tables or weakening v108 OCR,\n'
                      'matching, physical-row, or workbook update safeguards.')
          old_status=''.join(old_status)
          assert old_status in s
          s=s.replace(old_status,('Production release: v110. Development: v95-work / working_source.\n'
            'Version sections below are release history; later changes supersede earlier ones.\n'
            'v110 improves conservative Pipe/Cleaning length OCR, disputed dates and\n'
            'compact row geometry, and keeps Live Summary plain until analysis ends.\n'
            'Unresolved scan ambiguity still requires manual PDF review.\n'
            'Windows Excel COM and live GUI behavior were not tested in Linux CI.'),1)
          readme.write_text(s,encoding='utf-8')
          print('v110 version and bundled README updated')
          PY

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Compile source
        run: |
          python -m py_compile             working_source/app/reno_scan_updater.py             working_source/app/xps_update.py             working_source/app/xps_review_controls.py

      - name: Run full active regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          tests=[
            'regression_post_v108_compact_skew.py',
            'regression_post_v107_compact_contextual_ocr.py',
            'regression_post_v106_rotated_pipe_header_ocr.py',
            'regression_post_v105_single_row_removal.py',
            'regression_post_v105_physical_rows_never_discarded.py',
            'regression_post_v105_rotated_pipe_and_manhole_row.py',
            'regression_post_v103_manhole_reordered_columns.py',
            'regression_post_v102_manhole_expected_count_retry.py',
            'regression_post_v102_manhole_partial_tokens.py',
            'regression_post_v100_826_trouble_geometry.py',
            'regression_post_v100_trouble_cells.py',
            'regression_trouble_workbook.py',
            'regression_post_v99_faint_vertical_grid.py',
            'regression_post_v98_short_wide_compact_table.py',
            'regression_post_v97_cleaning_clipped_digits.py',
            'regression_post_v96_msa_editable_fields.py',
            'regression_post_v95_new_packet_ocr.py',
            'regression_post_v95_padded_endpoint_ids.py',
            'regression_post_v95_msa_suffix_review.py',
            'regression_v95_faint_compact_rows.py',
            'regression_v95_exact_endpoint_priority.py',
            'regression_v94_stacked_endpoint_digits.py',
            'regression_v93_workorder_low_confidence_blank.py',
            'regression_v93_new_asset_notes.py',
            'regression_v92_workorder_4_or_5_digits.py',
            'regression_v91_workorder_color_ocr.py',
            'regression_v91_new_asset_preview_and_endpoint_recovery.py',
            'regression_v90_review_ui.py',
            'regression_v89_review_workflow.py',
            'regression_v89_printed_pair_identity.py',
            'regression_v89_manhole_count_and_final_total.py',
            'regression_v88_continuations.py',
            'regression_v87_total_summary_separator.py',
            'regression_v86_assets_and_edit.py',
            'regression_v85_edit_row_previews.py',
            'regression_v85_mandatory_rows_and_length_votes.py',
            'regression_v84_real_packet_length_logic.py',
            'regression_v83_length_recovery.py',
            'regression_v83_exact_pdf_numbers.py',
            'regression_v83_total_preview_group_errors.py',
            'regression_v82_pair_video_lengths.py',
            'regression_v82_master_asset_format.py',
            'regression_v82_suffix_guard.py',
            'regression_v82_cleaning_header_noise.py',
            'regression_v82_layout_threshold.py',
            'regression_v81_header_outline.py',
            'regression_v80_ocr_total_ui.py',
            'regression_v79_layout_speed.py',
            'regression_v78_rollback.py',
            'regression_v75_811_ocr.py',
            'regression_v74_row_filtering.py',
            'regression_v73_total_dates.py',
            'regression_compact_table_fallback.py',
            'regression_length_totals.py',
            'regression_split_pipes.py',
            'regression_new_assets.py',
            'regression_master_insert.py',
            'regression_r2_endpoint_ocr.py',
            'regression_v102_review_wrapper.py',
          ]
          root=Path('working_source/tests')
          for name in tests:
              path=root/name
              if not path.exists():
                  raise SystemExit(f'Missing active regression: {path}')
              print(f'===== {path} =====',flush=True)
              subprocess.run([sys.executable,str(path)],check=True)
          print(f'FULL ACTIVE REGRESSION SUITE: {len(tests)}/{len(tests)} passed')
          PY
          python working_source/tests/regression_table_accuracy_guards.py
          python working_source/tests/regression_border_isolated_lengths.py
          python working_source/tests/regression_live_summary_plain_during_analysis.py
          python -m py_compile working_source/tools/private_table_benchmark.py
          python working_source/tools/private_table_benchmark.py --help >/dev/null
          git diff --check


      - name: Validate version and preserve app safeguards
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('working_source/app')
          app=(root/'reno_scan_updater.py').read_text(encoding='utf-8')
          upd=(root/'xps_update.py').read_text(encoding='utf-8')
          readme=(root/'README_XPS_Tracker_Updater.txt').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]110['\"]",app,re.M)
          assert re.search(r"^CURRENT_VERSION\s*=\s*['\"]110['\"]",upd,re.M)
          assert readme.startswith('XPS Tracker Updater v110')
          for x in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list',
                    'def parse_year15_manholes','def parse_trouble_ticket',
                    'def _border_isolated_length_evidence','def _year15_compact_skew_retry',
                    'def _read_sheet_date_evidence','def show_summary_record'):
              assert x in app, x
          print('v110 app/updater versions, bundled README and established parser functions verified')
          PY

      - name: Build and inspect complete v110 ZIP
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cd dist
          zip -qr XPS_Tracker_Updater_v110.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v110.zip >/dev/null
          python - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          p=Path('XPS_Tracker_Updater_v110.zip')
          with zipfile.ZipFile(p) as z:
              files=z.namelist()
              assert files and all(n.startswith('XPS_Tracker_Updater/') for n in files)
              required=['reno_scan_updater.py','xps_update.py','xps_review_controls.py','README_XPS_Tracker_Updater.txt','run_xps_tracker.bat','setup_and_run.bat','build_exe.bat','update_config.json','xps_tracker_shortcut.ico','xps_tracker_updater.ico']
              for name in required: assert 'XPS_Tracker_Updater/'+name in files,name
              assert not any(n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm','.pyc','.pyo')) or '/__pycache__/' in n for n in files)
              assert z.testzip() is None
          data=p.read_bytes(); digest=hashlib.sha256(data).hexdigest()
          Path('release_sha.txt').write_text(digest)
          Path('release_size.txt').write_text(str(len(data)))
          print(f'ZIP CHECK PASS: name={p.name} size={len(data)} sha256={digest}')
          PY
          echo "RELEASE_SHA=$(cat release_sha.txt)" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(cat release_size.txt)" >> "$GITHUB_ENV"

      - name: Commit vetted v110 source on development branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          git diff --cached --check
          git commit -m 'Release XPS Tracker Updater v110 source [skip ci]'
          git push origin HEAD:v95-work
          echo "RELEASE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish immutable release and re-download public asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v110 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release exists; refusing to overwrite' >&2; exit 1; fi
          cat > /tmp/v110-notes.md <<'NOTES'
          XPS Tracker Updater v110 improves difficult scanned-table OCR while preserving existing parser and review safeguards.

          - Recover clipped Pipe and Cleaning lengths only when independently corroborated by printed PDF OCR; unresolved disagreement requires review.
          - Flag uncertain compact row boundaries without creating or discarding physical rows; preserve interior column geometry after deskew.
          - Review conflicting full dates unless independently corroborated by the confirmed work-order date and other physical PDF cells.
          - Keep the Live Summary uncolored and Comments blank while analysis is still populating; show final warnings and colors only after analysis.
          - Private read-only evaluation on three scanned table pages: 47/47 physical rows, 94/94 endpoint IDs, 47/47 lengths and 47/47 dates; this limited sample does not guarantee all packets.
          - All 59 historical Linux regressions and new selective OCR, geometry, date and Live Summary tests passed.

          Known limitations: Windows Excel COM updates and interactive Tkinter GUI were not exercised by Linux CI; four originally requested private Library PDFs were not available for raw-byte benchmark testing. No private scans or master spreadsheets are included in the release.
          NOTES
          gh release create v110 dist/XPS_Tracker_Updater_v110.zip --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT_SHA" --title 'XPS Tracker Updater v110' --notes-file /tmp/v110-notes.md
          export PUBLIC_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v110/XPS_Tracker_Updater_v110.zip"
          python - <<'PY'
          import json,os,subprocess
          d=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/v110'],text=True))
          assert d['tag_name']=='v110' and not d.get('draft'),d.get('tag_name')
          a=next((a for a in d.get('assets',[]) if a.get('name')=='XPS_Tracker_Updater_v110.zip'),None)
          assert a, 'No matching public release asset'
          assert int(a['size'])==int(os.environ['RELEASE_SIZE'])
          digest=a.get('digest')
          if digest: assert digest=='sha256:'+os.environ['RELEASE_SHA'],(digest,os.environ['RELEASE_SHA'])
          print('Github release metadata verified (tag, public asset name, size and digest if available)')
          PY
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$PUBLIC_URL" -o /tmp/xps_v110_downloaded.zip
          test "$(stat -c%s /tmp/xps_v110_downloaded.zip)" = "$RELEASE_SIZE"
          test "$(sha256sum /tmp/xps_v110_downloaded.zip | cut -d' ' -f1)" = "$RELEASE_SHA"
          unzip -t /tmp/xps_v110_downloaded.zip >/dev/null
          echo "VERIFIED PUBLIC ASSET: $PUBLIC_URL $RELEASE_SIZE $RELEASE_SHA"

      - name: Sync v110 release documentation on development branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          from pathlib import Path
          sha=os.environ['RELEASE_SHA'];size=os.environ['RELEASE_SIZE'];commit=os.environ['RELEASE_COMMIT_SHA']
          def edit(path,old,new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              assert old in s,(path,old)
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          edit('AGENTS.md','- Production version: **v109**.','- Production version: **v110**.')
          edit('PROJECT_CONTEXT.md','## Development pending — table accuracy guards (October 13, 2026)','## Released in v110 — table accuracy guards (October 13, 2026)')
          edit('PROJECT_CONTEXT.md',
               'Production remains **v109** and `main/update_manifest.json` is unchanged.\nThese changes are source-only on `v95-work`. **Do not publish** until the\nuser explicitly says `PUBLISH`.',
               'Production v110 is verified and `main/update_manifest.json` advances only after the release asset is re-downloaded and checked.\nThese improvements were developed on `v95-work`; Windows COM and GUI verification remains a separately documented limitation.')
          edit('PROJECT_CONTEXT.md','Current production version: **v109**.','Current production version: **v110**.')
          marker='## Released in v109 — small-skew compact Pipe grid recovery (October 12, 2026)'
          intro=('## v110 release verification (October 13, 2026)\n\n'
                 f'- Versioned source commit: `{commit}`.\n'
                 '- Public release: https://github.com/painguin11/xps-tracker-updater-releases/releases/tag/v110\n'
                 f'- Published ZIP `XPS_Tracker_Updater_v110.zip`: {size} bytes; SHA-256 `{sha}`.\n'
                 '- Release CI ran 59 historical regression scripts plus synthetic/rendered selective OCR, date, compact geometry, and Live Summary tests.\n'
                 '- Public release asset was downloaded again and its size, SHA-256 and ZIP integrity verified before production manifest update.\n'
                 '- Private three-page benchmark previously established 47/47 correct lengths and dates, 47/47 rows and 94/94 endpoint IDs; not a full-document or Windows benchmark.\n'
                 '- Live Windows Excel COM updates, GUI/Tkinter and unavailable private Library fixture checks remain untested; these limitations were disclosed.\n\n')
          edit('PROJECT_CONTEXT.md',marker,''.join(intro)+marker)
          edit('RELEASE_CHECKLIST.md','**v109 production baseline**','**v110 production baseline**')
          edit('RELEASE_CHECKLIST.md','v109 is the current production release:',
               f'v110 is the current production release:\n\n- Release source commit: `{commit}`\n- ZIP: `XPS_Tracker_Updater_v110.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n- Public asset verified by re-download before manifest advance.\n- Windows Excel COM and live Tkinter behavior remain separately unverified.\n\nv109 was the previous production release:')
          for doc in ('AGENTS.md','PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md'):
              Path('working_source/docs',doc).write_bytes(Path(doc).read_bytes())
          root=Path('README.md');s=root.read_text(encoding='utf-8')
          start=s.index('## Current production release: v109')
          end=s.index('## v109',start)
          heading=('## Current production release: v110\n\n'
                   '- Release: [XPS Tracker Updater v110](https://github.com/painguin11/xps-tracker-updater-releases/releases/tag/v110)\n'
                   f'- Release commit: `{commit}`\n'
                   '- Asset: `XPS_Tracker_Updater_v110.zip`\n'
                   f'- Size: `{size}` bytes\n'
                   f'- SHA-256: `{sha}`\n\n'
                   'The production updater reads the verified v110 asset through `update_manifest.json` on `main`.\n'
                   'Development remains on `v95-work` under `working_source/`.\n\n'
                   '## v110\n\n'
                   '- Improved Pipe/Cleaning OCR for border-clipped numeric cells with corroborated PDF evidence; uncertainty remains review-only.\n'
                   '- Conservative compact table row/column geometry and full-date disagreement checks.\n'
                   '- Live Summary shows plain rows with empty Comments during extraction; final warnings and colors appear after completion.\n'
                   '- 59/59 historical regressions and additional OCR/geometry/GUI-model tests passed on Linux.\n'
                   '- Three selected private scanned pages achieved 47/47 physical rows, 94/94 IDs, 47/47 lengths, and 47/47 dates.\n'
                   '- Windows Excel COM, interactive Tkinter and inaccessible private fixture validation remain unverified.\n\n')
          root.write_text(s[:start]+''.join(heading)+s[end:],encoding='utf-8')
          PY
          git add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md working_source/docs/
          git diff --cached --check
          git commit -m 'Document verified v110 release and validation limits [skip ci]'
          git push origin HEAD:v95-work

      - name: Advance and verify production manifest only after public ZIP verification
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/xps_v110_main origin/main
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          main=Path('/tmp/xps_v110_main')
          file=main/'update_manifest.json'
          old=json.loads(file.read_text(encoding='utf-8'))
          assert str(old['version'])=='109', 'main manifest unexpectedly moved'
          sha=os.environ['RELEASE_SHA']
          url=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v110/XPS_Tracker_Updater_v110.zip'
          data={'version':'110','download_url':url,'sha256':sha,'release_notes':[
            'Improve scanned-table Pipe/Cleaning length accuracy using selective corroborated border-free OCR',
            'Guard skewed compact column alignment and flag uncertain physical row boundaries for review',
            'Require independent PDF corroboration for conflicting complete dates and lengths',
            'Keep Live Summary plain and Comments blank while analysis is still running',
            'Preserve prior parsing, manual review and master-workbook safeguards']}
          file.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          for doc in ('AGENTS.md','PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md','README.md'):
              shutil.copy2(doc,main/doc)
          print('Prepared v110 manifest and synchronized production docs')
          PY
          cd /tmp/xps_v110_main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_manifest.json README.md AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git diff --cached --check
          git commit -m 'Publish verified XPS Tracker Updater v110 manifest and docs [skip ci]'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/v110_live_manifest.json
          python - <<'PY'
          from pathlib import Path
          import json,os
          x=json.loads(Path('/tmp/v110_live_manifest.json').read_text(encoding='utf-8'))
          expected=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v110/XPS_Tracker_Updater_v110.zip'
          assert x['version']=='110' and x['download_url']==expected and x['sha256']==os.environ['RELEASE_SHA']
          print('LIVE MANIFEST VERIFIED',x['version'],x['download_url'],x['sha256'])
          PY

      - name: Remove temporary release workflow and trigger from development branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/publish-v110.yml .trigger_publish_v110
          git commit -m 'Remove temporary v110 publishing workflow and trigger [skip ci]'
          git push origin HEAD:v95-work
          echo "PUBLISHED AND VERIFIED v110 size=${RELEASE_SIZE} sha256=${RELEASE_SHA}"


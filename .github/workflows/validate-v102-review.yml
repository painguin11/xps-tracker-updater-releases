name: Validate v102 review controls

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v102_wrapper_validate'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract
      - name: Validate review wrapper and active behavior
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_review_controls.py working_source/app/xps_update.py
          python .github/scripts/run_active_v102_tests.py
          git diff --check

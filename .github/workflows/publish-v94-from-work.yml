name: Publish v94 from work branch

on:
  push:
    branches:
      - v94-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V94' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply v94 release version and documentation updates
        run: python working_source/tools/apply_v94_release.py

      - name: Compile and run active regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { if [ -f "$1" ]; then echo "===== $1 ====="; python "$1"; fi; }
          run_test working_source/tests/regression_v94_stacked_endpoint_digits.py
          run_test working_source/tests/regression_v93_workorder_low_confidence_blank.py
          run_test working_source/tests/regression_v93_new_asset_notes.py
          run_test working_source/tests/regression_v92_workorder_4_or_5_digits.py
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release source and scope
        run: |
          # py_compile and imported regressions create bytecode. Remove only these
          # generated files before enforcing the exact release-source diff.
          find working_source -type d -name '__pycache__' -prune -exec rm -rf {} +
          find working_source -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]94['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']94[\"\']',updater,re.M)
          assert 'Version 94 padded endpoint-cell recovery' in readme
          for required in (
              'def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list',
              'def parse_year15_manholes','def parse_trouble_ticket','class NewAssetApprovalDialog',
              'def _endpoint_digit_tokens','def _batch_pair_endpoint_digit_candidates',
              'def _resolve_pipe_pair_from_endpoint_digits'):
              assert required in app, required
          assert 'batch_up_digit_endpoints=None' in app
          assert 'batch_dn_digit_endpoints=None' in app
          assert 'up_extra=batch_up_digit_endpoints.get(band_index,[])' in app
          assert 'dn_extra=batch_dn_digit_endpoints.get(band_index,[])' in app
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
              'working_source/app/reno_scan_updater.py',
              'working_source/app/xps_update.py',
              'working_source/app/README_XPS_Tracker_Updater.txt',
              'working_source/tests/regression_v91_workorder_color_ocr.py',
              'working_source/tests/regression_v92_workorder_4_or_5_digits.py',
              'working_source/tests/regression_v93_workorder_low_confidence_blank.py',
              'working_source/tests/regression_v93_new_asset_notes.py',
          }
          assert changed==expected,(changed,expected)
          print('v94 version, endpoint recovery, parser-preservation, and release-scope checks passed.')
          PY

      - name: Build release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cd dist
          zip -qr XPS_Tracker_Updater_v94.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v94.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v94.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names and all(n.startswith('XPS_Tracker_Updater/') for n in names)
              for required in (
                  'XPS_Tracker_Updater/reno_scan_updater.py',
                  'XPS_Tracker_Updater/xps_update.py',
                  'XPS_Tracker_Updater/run_xps_tracker.bat',
                  'XPS_Tracker_Updater/README_XPS_Tracker_Updater.txt'):
                  assert required in names, required
              assert not any(n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm')) for n in names)
              assert not any('__pycache__' in n or n.lower().endswith(('.pyc','.pyo')) for n in names)
          print('v94 ZIP structure/privacy check passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v94.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v94.zip)" >> "$GITHUB_ENV"

      - name: Commit v94 release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt working_source/tests/regression_v91_workorder_color_ocr.py working_source/tests/regression_v92_workorder_4_or_5_digits.py working_source/tests/regression_v93_workorder_low_confidence_blank.py working_source/tests/regression_v93_new_asset_notes.py
          git rm working_source/tools/apply_v94_release.py .github/workflows/publish-v94-from-work.yml .trigger_publish_v94
          git commit -m 'Release v94 [skip ci]'
          git push origin HEAD:v94-work

      - name: Publish and verify v94
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v94 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v94 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v94 dist/XPS_Tracker_Updater_v94.zip --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title 'XPS Tracker Updater v94' --notes 'v94 improves endpoint recovery for Brown & Caldwell pair tables when whole-column OCR skips an otherwise clean endpoint row. It builds a padded stack from the individual PDF endpoint cells and runs digit-only OCR only after normal matching fails. Recovery still requires both endpoint numbers to be observed from the PDF and to identify exactly one existing directional master pipe, so valid non-master pairs remain unresolved for Add/Ignore review. All v93 and earlier matching, Work Order, new-asset, continuation, total-validation, R2, split-pipe, and review safeguards are preserved.'
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']; expected=f"sha256:{os.environ['RELEASE_SHA']}"; asset=None
          for _ in range(10):
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v94'],text=True))
              assert not data.get('draft') and not data.get('prerelease')
              asset=next((a for a in data.get('assets',[]) if a.get('name')=='XPS_Tracker_Updater_v94.zip'),None)
              assert asset, 'v94 release ZIP missing'
              if str(asset.get('digest') or '')==expected: break
              time.sleep(2)
          assert str(asset.get('digest') or '')==expected,(asset.get('digest'),expected)
          assert int(asset.get('size') or 0)==int(os.environ['RELEASE_SIZE'])
          print('public v94 release asset verified')
          PY
          curl -fL --retry 5 --retry-delay 2 -o /tmp/public-v94.zip "https://github.com/$GITHUB_REPOSITORY/releases/download/v94/XPS_Tracker_Updater_v94.zip"
          test "$(sha256sum /tmp/public-v94.zip | awk '{print $1}')" = "$RELEASE_SHA"
          test "$(stat -c%s /tmp/public-v94.zip)" = "$RELEASE_SIZE"
          echo 'public v94 download verified byte-for-byte'

      - name: Advance public updater manifest to v94
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          old=json.loads(path.read_text(encoding='utf-8'))
          assert str(old.get('version'))=='93', f"Expected live v93 manifest, found {old.get('version')}"
          data={
            'version':'94',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v94/XPS_Tracker_Updater_v94.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Recover endpoint rows that whole-column OCR skips by re-reading padded individual endpoint cells as a clean stacked column',
              'Run the stacked endpoint OCR only after normal pair matching fails, so already-readable rows keep the existing fast path',
              'Require both endpoint numbers to be observed from the PDF and to identify exactly one existing directional master pipe before recovery',
              'Keep valid non-master pairs unresolved for Add/Ignore review and preserve all v93 and earlier safeguards'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v94 update manifest'
          git push origin HEAD:main
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/update_manifest.json" -o /tmp/public_manifest.json; then
              if python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='94'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v94/XPS_Tracker_Updater_v94.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          PY
              then break; fi
            fi
            sleep 2
          done
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='94'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v94/XPS_Tracker_Updater_v94.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('public v94 updater manifest verified')
          PY

name: Patch v82 asset format profiles

on:
  push:
    branches:
      - v82-work

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'PATCH_V82_ASSET_FORMAT_PROFILES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v82 work branch
        uses: actions/checkout@v4
        with:
          ref: v82-work
          fetch-depth: 0

      - name: Apply centralized asset format rules
        run: python .github/scripts/apply_v82_asset_format_profiles.py

      - name: Compile and run current regressions
        run: |
          python -m pip install --disable-pip-version-check -q numpy opencv-python-headless
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          python working_source/tests/regression_v82_asset_format_profiles.py
          python working_source/tests/regression_v82_cleaning_header_noise.py
          python working_source/tests/regression_v82_suffix_guard.py
          python working_source/tests/regression_v82_pair_video_lengths.py
          python working_source/tests/regression_v82_layout_threshold.py
          python working_source/tests/regression_v81_header_outline.py
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py

      - name: Commit validated asset format rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v82_asset_format_profiles.py
          git commit -m 'Centralize project asset format rules'
          git push origin HEAD:v82-work

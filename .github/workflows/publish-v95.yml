name: Publish v95 from work branch

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v95_publish*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Prepare v95 release source
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(encoding='utf-8')
          s=s.replace("APP_VERSION = '94'", "APP_VERSION = '95'", 1)
          if "APP_VERSION = '95'" not in s:
              raise SystemExit('APP_VERSION bump failed')
          app.write_text(s,encoding='utf-8')

          upd=Path('working_source/app/xps_update.py')
          u=upd.read_text(encoding='utf-8')
          u=u.replace('CURRENT_VERSION = "94"','CURRENT_VERSION = "95"',1)
          if 'CURRENT_VERSION = "95"' not in u:
              raise SystemExit('CURRENT_VERSION bump failed')
          upd.write_text(u,encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          r=readme.read_text(encoding='utf-8')
          entry='''\nXPS Tracker Updater v95\n- Recover faint/dashed compact-table row rules so the 8-28 page-2 style B&C table can be processed instead of skipped.\n- Prefer exact endpoint numeric-body matches over tolerated leading-junk matches, fixing DN-1911 -> DN-1912 while preserving ambiguity safeguards.\n- Preserve v94 stacked endpoint recovery, v93 Work Order confidence behavior and NEW PIPE/NEW MANHOLE notes, plus all existing continuation, matching, total, review, and safety behavior.\n'''
          if 'XPS Tracker Updater v95' not in r:
              readme.write_text(r.rstrip()+entry+'\n',encoding='utf-8')
          PY

      - name: Compile and run active regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { if [ -f "$1" ]; then echo "===== $1 ====="; python "$1"; fi; }
          run_test working_source/tests/regression_v95_faint_compact_rows.py
          run_test working_source/tests/regression_v95_exact_endpoint_priority.py
          run_test working_source/tests/regression_v94_stacked_endpoint_digits.py
          run_test working_source/tests/regression_v93_workorder_low_confidence_blank.py
          run_test working_source/tests/regression_v93_new_asset_notes.py
          run_test working_source/tests/regression_v92_workorder_4_or_5_digits.py
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release source and scope
        run: |
          set -e
          grep -q "APP_VERSION = '95'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "95"' working_source/app/xps_update.py
          grep -q 'if len(rule_ys)<=4:' working_source/app/reno_scan_updater.py
          grep -q 'def _digit_token_asset_body_quality' working_source/app/reno_scan_updater.py
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -vE '^(working_source/app/reno_scan_updater.py|working_source/app/xps_update.py|working_source/app/README_XPS_Tracker_Updater.txt|working_source/app/__pycache__/.*\.pyc)$' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected changed files:"; echo "$unexpected"; exit 1; fi

      - name: Build release ZIP
        run: |
          set -e
          rm -rf dist_v95
          mkdir -p dist_v95/XPS_Tracker_Updater_v95
          cp -a working_source/app/. dist_v95/XPS_Tracker_Updater_v95/
          find dist_v95 -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist_v95 -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q . && { echo 'Private/customer document found in package'; exit 1; } || true
          test -f dist_v95/XPS_Tracker_Updater_v95/reno_scan_updater.py
          test -f dist_v95/XPS_Tracker_Updater_v95/xps_update.py
          test -f dist_v95/XPS_Tracker_Updater_v95/run_xps_tracker.bat
          cd dist_v95
          zip -qr ../XPS_Tracker_Updater_v95.zip XPS_Tracker_Updater_v95
          cd ..
          unzip -t XPS_Tracker_Updater_v95.zip
          sha256sum XPS_Tracker_Updater_v95.zip | tee v95.sha256

      - name: Commit v95 release source
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          git commit -m 'Release v95 [skip ci]'
          git push origin HEAD:v95-work
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish and verify v95
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v95 >/dev/null 2>&1; then
            echo 'v95 release already exists; refusing overwrite.'
            exit 1
          fi
          git tag v95 "$RELEASE_COMMIT"
          git push origin v95
          gh release create v95 XPS_Tracker_Updater_v95.zip --target "$RELEASE_COMMIT" --title 'XPS Tracker Updater v95' --notes 'v95 fixes faint compact B&C table row detection (including the 8-28 page-2 failure) and gives exact endpoint numeric-body matches priority over tolerated OCR-junk matches so DN-1911 -> DN-1912 resolves correctly without weakening ambiguity safeguards.'
          expected_sha=$(cut -d' ' -f1 v95.sha256)
          expected_size=$(stat -c%s XPS_Tracker_Updater_v95.zip)
          gh release download v95 -p XPS_Tracker_Updater_v95.zip -D verify_v95
          actual_sha=$(sha256sum verify_v95/XPS_Tracker_Updater_v95.zip | cut -d' ' -f1)
          actual_size=$(stat -c%s verify_v95/XPS_Tracker_Updater_v95.zip)
          test "$expected_sha" = "$actual_sha"
          test "$expected_size" = "$actual_size"
          echo "V95_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "V95_SIZE=$actual_size" >> "$GITHUB_ENV"
          echo "Verified release asset SHA=$actual_sha size=$actual_size"

      - name: Advance public updater manifest to v95
        run: |
          set -e
          git fetch origin main
          git checkout main
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('update_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          if str(data.get('version'))!='94':
              raise SystemExit(f"Expected public manifest v94 before advance, got {data.get('version')}")
          data={
            'version':'95',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v95/XPS_Tracker_Updater_v95.zip',
            'sha256':os.environ['V95_SHA'],
            'release_notes':[
              'Recover faint/dashed compact B&C table row rules so affected pages are processed instead of skipped',
              'Prefer exact endpoint numeric-body matches over tolerated leading-junk OCR matches, fixing DN-1911 to DN-1912',
              'Preserve unresolved and genuinely ambiguous pipe pairs instead of guessing',
              'Preserve all v94/v93 continuation, Work Order confidence, new-asset note, total-validation, review, and matching safeguards'
            ]
          }
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git commit -m 'Advance updater manifest to v95'
          git push origin main
          git pull --ff-only origin main
          cat update_manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('update_manifest.json').read_text())
          assert data['version']=='95'
          assert data['sha256']==os.environ['V95_SHA']
          assert data['download_url'].endswith('/v95/XPS_Tracker_Updater_v95.zip')
          print('Verified public updater manifest v95')
          PY

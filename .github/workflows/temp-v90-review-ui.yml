name: Temporary v90 review UI update
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v90-work
          fetch-depth: 0
      - name: Apply staged patch
        run: python working_source/tools/apply_v90_review_ui.py
      - name: Preserve v89 dialog structure
        run: >-
          python -c "from pathlib import Path; p=Path('working_source/app/reno_scan_updater.py'); s=p.read_text(encoding='utf-8'); old=\"        scanned=(record.get('asset') or record.get('display_asset') or '') if is_manhole else f\\\"{record.get('up','')} → {record.get('down','')}\\\"\"; new=\"        if is_manhole:\\n            scanned=record.get('asset') or record.get('display_asset') or ''\\n        else:\\n            scanned=f\\\"{record.get('up','')} → {record.get('down','')}\\\"\"; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Verify
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python working_source/tests/regression_v90_review_ui.py
          python working_source/tests/regression_v89_review_workflow.py
          python working_source/tests/regression_v89_printed_pair_identity.py
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f working_source/tools/apply_v90_review_ui.py .github/workflows/apply-v90-review-ui.yml
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v90_review_ui.py
          git commit -m "Improve unmatched review previews and preserve summary position [skip ci]"
          git push origin HEAD:v90-work

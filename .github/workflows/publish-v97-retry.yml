name: Publish v97 corrected retry

on:
  push:
    branches: [v97-publish-exec4]
    paths:
      - '.trigger_v97_publish_retry'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v97-publish-exec4
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk patch >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v97 >/dev/null 2>&1; then echo 'v97 release already exists'; exit 1; fi
          if git ls-remote --exit-code --tags origin refs/tags/v97 >/dev/null 2>&1; then echo 'v97 tag already exists'; exit 1; fi

      - name: Apply tested patch and align legacy regression wording
        run: |
          set -e
          python working_source/tools/v97_patch_payload.py
          python - <<'PY'
          from pathlib import Path
          p=Path('working_source/tests/regression_post_v95_msa_suffix_review.py')
          s=p.read_text(encoding='utf-8')
          old='assert "self.status.set(\'MSA decision changed: the two Pipe rows are now combined.\')" in s'
          new='assert "self.status.set(\'MSA decision changed: corrected fields saved and the two Pipe rows are now combined.\')" in s'
          if old not in s and new not in s:
              raise SystemExit('MSA regression wording anchor missing')
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Prepare v97 source
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(encoding='utf-8')
          if "APP_VERSION = '96'" not in s: raise SystemExit('Expected APP_VERSION 96')
          app.write_text(s.replace("APP_VERSION = '96'","APP_VERSION = '97'",1),encoding='utf-8')
          upd=Path('working_source/app/xps_update.py')
          u=upd.read_text(encoding='utf-8')
          if 'CURRENT_VERSION = "96"' not in u: raise SystemExit('Expected CURRENT_VERSION 96')
          upd.write_text(u.replace('CURRENT_VERSION = "96"','CURRENT_VERSION = "97"',1),encoding='utf-8')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          r=readme.read_text(encoding='utf-8')
          entry='''\nXPS Tracker Updater v97\n- Make Upstream ID, Downstream ID, and Length editable for both physical rows in MSA review.\n- Save corrected rows without combining them when edited IDs no longer identify the same directed pipe.\n- Protect manual MSA length corrections from later OCR retries.\n- Fix the 8-26 Pipe split where printed 82.87 could degrade to 2.87.\n- Refresh the persistent OCR cache generation so stale v96 OCR observations are not reused.\n- Preserve all v96 OCR reconciliation, R2 direction, compact-layout, suffix, padded-endpoint, faint-row, and review safeguards.\n'''
          if 'XPS Tracker Updater v97' not in r:
              readme.write_text(r.rstrip()+entry+'\n',encoding='utf-8')
          PY

      - name: Compile and run full active regression suite
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          tests=(
            regression_post_v96_msa_editable_fields.py
            regression_post_v95_new_packet_ocr.py regression_post_v95_padded_endpoint_ids.py regression_post_v95_msa_suffix_review.py
            regression_v95_faint_compact_rows.py regression_v95_exact_endpoint_priority.py regression_v94_stacked_endpoint_digits.py
            regression_v93_workorder_low_confidence_blank.py regression_v93_new_asset_notes.py regression_v92_workorder_4_or_5_digits.py
            regression_v91_workorder_color_ocr.py regression_v91_new_asset_preview_and_endpoint_recovery.py regression_v90_review_ui.py
            regression_v89_review_workflow.py regression_v89_printed_pair_identity.py regression_v89_manhole_count_and_final_total.py
            regression_v88_continuations.py regression_v87_total_summary_separator.py regression_v86_assets_and_edit.py
            regression_v85_edit_row_previews.py regression_v85_mandatory_rows_and_length_votes.py regression_v84_real_packet_length_logic.py
            regression_v83_length_recovery.py regression_v83_exact_pdf_numbers.py regression_v83_total_preview_group_errors.py
            regression_v82_pair_video_lengths.py regression_v82_master_asset_format.py regression_v82_suffix_guard.py regression_v82_cleaning_header_noise.py regression_v82_layout_threshold.py
            regression_v81_header_outline.py regression_v80_ocr_total_ui.py regression_v79_layout_speed.py regression_v78_rollback.py
            regression_v75_811_ocr.py regression_v74_row_filtering.py regression_v73_total_dates.py
            regression_compact_table_fallback.py regression_length_totals.py regression_split_pipes.py regression_new_assets.py regression_master_insert.py regression_r2_endpoint_ocr.py
          )
          for t in "${tests[@]}"; do echo "===== $t ====="; python "working_source/tests/$t"; done

      - name: Validate scope
        run: |
          set -e
          grep -q "APP_VERSION = '97'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "97"' working_source/app/xps_update.py
          grep -q "OCR_CACHE_VERSION = 'v7'" working_source/app/reno_scan_updater.py
          grep -q 'Save Changes & Cancel MSA' working_source/app/reno_scan_updater.py
          git checkout -- working_source/app/__pycache__ 2>/dev/null || true
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -vE '^(working_source/app/reno_scan_updater.py|working_source/app/xps_update.py|working_source/app/README_XPS_Tracker_Updater.txt|working_source/tests/regression_v80_ocr_total_ui.py|working_source/tests/regression_post_v96_msa_editable_fields.py|working_source/tests/regression_post_v95_msa_suffix_review.py)$' || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi

      - name: Build and validate ZIP
        run: |
          set -e
          rm -rf dist_v97 verify_v97 XPS_Tracker_Updater_v97.zip
          mkdir -p dist_v97/XPS_Tracker_Updater
          cp -a working_source/app/. dist_v97/XPS_Tracker_Updater/
          find dist_v97 -type d -name __pycache__ -prune -exec rm -rf {} +
          if find dist_v97 -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then exit 1; fi
          test -f dist_v97/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist_v97/XPS_Tracker_Updater/xps_update.py
          test -f dist_v97/XPS_Tracker_Updater/run_xps_tracker.bat
          cd dist_v97 && zip -qr ../XPS_Tracker_Updater_v97.zip XPS_Tracker_Updater && cd ..
          unzip -t XPS_Tracker_Updater_v97.zip
          sha256sum XPS_Tracker_Updater_v97.zip | tee v97.sha256
          stat -c '%s' XPS_Tracker_Updater_v97.zip | tee v97.size

      - name: Commit clean v97 release source
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/publish-v97.yml .github/workflows/publish-v97-retry.yml .trigger_v97_publish .trigger_v97_publish_retry working_source/tools/v97_patch_payload.py
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt \
                  working_source/tests/regression_v80_ocr_total_ui.py working_source/tests/regression_post_v96_msa_editable_fields.py working_source/tests/regression_post_v95_msa_suffix_review.py
          git commit -m 'Release v97 editable MSA and 8-26 OCR fix [skip ci]'
          git push origin HEAD:v97-publish-exec4
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish and verify v97
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git tag v97 "$RELEASE_COMMIT"
          git push origin v97
          gh release create v97 XPS_Tracker_Updater_v97.zip --target "$RELEASE_COMMIT" --title 'XPS Tracker Updater v97' \
            --notes 'v97 makes all MSA review IDs and lengths editable, saves corrected non-matching rows without creating an MSA, fixes the 8-26 82.87-to-2.87 Pipe OCR failure, and refreshes the OCR cache generation so stale v96 reads are not reused. The real 8-26 page-2 and page-4 fixtures and full active regression suite were verified before release.'
          expected_sha=$(cut -d' ' -f1 v97.sha256); expected_size=$(cat v97.size)
          mkdir -p verify_v97
          gh release download v97 -p XPS_Tracker_Updater_v97.zip -D verify_v97
          actual_sha=$(sha256sum verify_v97/XPS_Tracker_Updater_v97.zip | cut -d' ' -f1); actual_size=$(stat -c%s verify_v97/XPS_Tracker_Updater_v97.zip)
          test "$expected_sha" = "$actual_sha"; test "$expected_size" = "$actual_size"
          echo "V97_SHA=$actual_sha" >> "$GITHUB_ENV"; echo "V97_SIZE=$actual_size" >> "$GITHUB_ENV"

      - name: Advance public updater manifest
        run: |
          set -e
          git fetch origin main && git checkout main && git pull --ff-only origin main
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('update_manifest.json'); d=json.loads(p.read_text())
          if str(d.get('version'))!='96': raise SystemExit(f"Expected manifest v96, got {d.get('version')}")
          d={'version':'97','download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v97/XPS_Tracker_Updater_v97.zip','sha256':os.environ['V97_SHA'],'release_notes':[
            'Make Upstream ID, Downstream ID, and Length editable for both MSA rows',
            'Save corrected rows and cancel MSA creation when edited IDs no longer match',
            'Fix the 8-26 split-pipe OCR case where printed 82.87 could be reduced to 2.87',
            'Refresh the OCR cache generation so stale v96 observations are not reused',
            'Preserve all v96 parsing, matching, OCR, review, and safety safeguards']}
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add update_manifest.json && git commit -m 'Advance updater manifest to v97' && git push origin main
          git pull --ff-only origin main
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('update_manifest.json').read_text()); assert d['version']=='97'; assert d['sha256']==os.environ['V97_SHA']
          PY

      - name: Document v97 and advance development branch
        run: |
          set -e
          git checkout v97-publish-exec4 && git pull --ff-only origin v97-publish-exec4
          python - <<'PY'
          import os,re
          from pathlib import Path
          sha=os.environ['V97_SHA']; size=os.environ['V97_SIZE']; commit=os.environ['RELEASE_COMMIT']
          p=Path('README.md'); s=p.read_text()
          s=s.replace('## Current production release: v96','## Current production release: v97',1)
          s=s.replace('- Tag: `v96`','- Tag: `v97`',1).replace('- Release: `XPS Tracker Updater v96`','- Release: `XPS Tracker Updater v97`',1)
          s=re.sub(r'- Release commit: `[^`]+`',f'- Release commit: `{commit}`',s,count=1)
          s=s.replace('- Asset: `XPS_Tracker_Updater_v96.zip`','- Asset: `XPS_Tracker_Updater_v97.zip`',1)
          s=re.sub(r'- Size: `\d+` bytes',f'- Size: `{size}` bytes',s,count=1); s=re.sub(r'- SHA-256: `[0-9a-f]{64}`',f'- SHA-256: `{sha}`',s,count=1)
          s=s.replace('The public updater manifest points to this verified v96 asset.','The public updater manifest points to this verified v97 asset.',1)
          if '## v97\n' not in s:
              sec='''\n## v97\n\n- Makes all six MSA row fields editable beside the PDF crops.\n- Saves corrected non-matching rows without merging them into an MSA.\n- Fixes the 8-26 82.87-to-2.87 split-pipe OCR failure and refreshes the OCR cache generation.\n- Preserves the full v96 safeguard baseline.\n'''
              s=s.replace('\n## Development baseline\n',sec+'\n## Development baseline\n',1)
          p.write_text(s)

          p=Path('PROJECT_CONTEXT.md'); s=p.read_text()
          s=s.replace('Current production version: **v96**.','Current production version: **v97**.',1)
          if 'Public v97 release:' not in s:
              block=f'''Public v97 release:\n\n- Tag: `v97`\n- Release title: `XPS Tracker Updater v97`\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v97.zip`\n- Asset size: `{size}` bytes\n- SHA-256: `{sha}`\n- `working_source/app/reno_scan_updater.py`: `APP_VERSION = '97'`\n- `working_source/app/xps_update.py`: `CURRENT_VERSION = "97"`\n- Public `update_manifest.json` points to that exact v97 asset/checksum.\n\n### Current v97 release changes\n\n- MSA review exposes editable Upstream ID, Downstream ID, and Length for both physical rows.\n- Corrected IDs that diverge can be saved with `Save Changes & Cancel MSA`, preserving separate rows and normal re-matching.\n- Manual MSA length corrections are protected from later OCR retries.\n- The 8-26 page-2 fixture preserves 84.48 + 82.87 and totals 6720.58; page 4 remains 15 rows / 4198.37.\n- OCR cache generation is v7 so stale v96 observations are not reused.\n- Permanent regression: `working_source/tests/regression_post_v96_msa_editable_fields.py`.\n\n'''
              anchor=s.find('Public v96 release:')
              if anchor<0: raise SystemExit('PROJECT_CONTEXT release anchor missing')
              s=s[:anchor]+block+s[anchor:]
          p.write_text(s)

          p=Path('RELEASE_CHECKLIST.md'); s=p.read_text()
          s=s.replace('current **v96 production baseline**','current **v97 production baseline**',1)
          if 'post-v96 editable MSA field / 8-26 OCR regression' not in s:
              s=s.replace('The active baseline includes, at minimum:\n\n','The active baseline includes, at minimum:\n\n- post-v96 editable MSA field / 8-26 OCR regression;\n',1)
          if '`working_source/tests/regression_post_v96_msa_editable_fields.py`' not in s:
              s=s.replace('The current unreleased regressions are:\n\n','The current unreleased regressions are:\n\n- `working_source/tests/regression_post_v96_msa_editable_fields.py`\n',1)
          if 'Every Upstream ID, Downstream ID, and Length shown in MSA review must be editable.' not in s:
              s=s.replace('### Split Pipes / MSA\n\n','### Split Pipes / MSA\n\n- Every Upstream ID, Downstream ID, and Length shown in MSA review must be editable.\n- If corrected IDs no longer identify the same directed pipe, save the corrections and cancel MSA creation without merging.\n- Manual MSA length corrections must not be overwritten by later OCR retries.\n- 8-26 page 2 must preserve 84.48 + 82.87 and total 6720.58; 82.87 must not degrade to 2.87.\n',1)
          s=re.sub(r'v96 is the current production release:', 'v97 is the current production release:', s, count=1)
          s=re.sub(r'- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v96\.zip`\n- Size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`',f'- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v97.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`',s,count=1)
          s=s.replace('The public updater manifest points to that verified v96 asset.','The public updater manifest points to that verified v97 asset.',1)
          p.write_text(s)
          PY
          git add README.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document v97 release [skip ci]'
          git push origin HEAD:v97-publish-exec4
          git push origin HEAD:v95-work

      - name: Remove temporary branches
        if: success()
        run: |
          git push origin --delete v97-publish-exec4 v97-publish-safety v97-publish-work v97-publish-run v97-release v97-release-run v97-final-publish v97-publish-final v97-actual-publish v97-go v97-publish-only v97-final-run v97-LAST v97-publish-exec v97-publish-exec2 v97-publish-exec3 v97-publish-exec5 2>/dev/null || true

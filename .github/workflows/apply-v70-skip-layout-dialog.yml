name: Apply v70 skip-layout-dialog fix

on:
  push:
    branches:
      - v70-work

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v70-work
      - name: Skip layout confirmation at native 100 percent confidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('working_source/app/reno_scan_updater.py')
          text = path.read_text(encoding='utf-8')
          old = """                    if fingerprint in confirmed_layouts:\n                        apply_confirmed_layout(layout,confirmed_layouts[fingerprint])\n                    else:\n                        saved=saved_layouts.get(fingerprint,{}).get('role_indices')\n                        if saved and all(k in saved for k in ('up','down','value','date')) and all(0<=int(v)<len(layout['column_boxes']) for v in saved.values()):\n                            apply_confirmed_layout(layout,saved); layout['source']=layout.get('source','')+' / saved layout'\n                        dlg=LayoutConfirmDialog(self,layout,pi+1); self.wait_window(dlg)\n                        if dlg.result is None:\n                            self.status.set('Analysis cancelled.'); return\n                        confirmed_layouts[fingerprint]=dlg.result\n                        apply_confirmed_layout(layout,dlg.result)\n                        save_layout_profile(fingerprint,layout,dlg.result)\n"""
          new = """                    if fingerprint in confirmed_layouts:\n                        apply_confirmed_layout(layout,confirmed_layouts[fingerprint])\n                    else:\n                        detected_roles=layout.get('role_indices',{})\n                        if layout.get('confidence',0)>=100 and all(k in detected_roles for k in ('up','down','value','date')):\n                            # A complete 100% native detection is already unambiguous;\n                            # do not interrupt analysis with a confirmation dialog.\n                            confirmed_layouts[fingerprint]=dict(detected_roles)\n                        else:\n                            saved=saved_layouts.get(fingerprint,{}).get('role_indices')\n                            if saved and all(k in saved for k in ('up','down','value','date')) and all(0<=int(v)<len(layout['column_boxes']) for v in saved.values()):\n                                apply_confirmed_layout(layout,saved); layout['source']=layout.get('source','')+' / saved layout'\n                            dlg=LayoutConfirmDialog(self,layout,pi+1); self.wait_window(dlg)\n                            if dlg.result is None:\n                                self.status.set('Analysis cancelled.'); return\n                            confirmed_layouts[fingerprint]=dlg.result\n                            apply_confirmed_layout(layout,dlg.result)\n                            save_layout_profile(fingerprint,layout,dlg.result)\n"""
          if old not in text:
              raise SystemExit('Expected layout-confirmation block not found')
          path.write_text(text.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py
          git commit -m "Skip 100 percent layout confirmation [skip ci]"
          git push origin HEAD:v70-work

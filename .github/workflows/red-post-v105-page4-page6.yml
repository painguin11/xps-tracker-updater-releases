name: Red post-v105 page 4 and page 6 regression

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_red_post_v105_page4_page6'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
      - name: Install regression dependencies
        run: python -m pip install --quiet numpy opencv-python-headless pillow
      - name: Confirm current source fails new regression
        run: python working_source/tests/regression_post_v105_rotated_pipe_and_manhole_row.py

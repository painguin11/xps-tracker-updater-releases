name: Export v88 source

on:
  push:
    branches:
      - v88-work

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event.head_commit.message == 'EXPORT_V88_SOURCE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v88-work
      - name: Archive source
        run: zip -r v88-source.zip working_source >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: v88-source
          path: v88-source.zip
          if-no-files-found: error
          retention-days: 1

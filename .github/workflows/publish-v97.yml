name: Publish v97 from tested MSA/OCR patch

on:
  push:
    branches: [v97-publish-exec4]
    paths:
      - '.trigger_v97_publish'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v97-publish-exec4
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk patch >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v97 >/dev/null 2>&1; then
            echo 'v97 release already exists; refusing overwrite.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v97 >/dev/null 2>&1; then
            echo 'v97 tag already exists; refusing overwrite.'
            exit 1
          fi

      - name: Apply exact locally tested v97 patch
        run: python working_source/tools/v97_patch_payload.py

      - name: Prepare v97 release source
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(encoding='utf-8')
          if "APP_VERSION = '96'" not in s:
              raise SystemExit('Expected v96 app source before v97 bump')
          s=s.replace("APP_VERSION = '96'", "APP_VERSION = '97'", 1)
          app.write_text(s,encoding='utf-8')

          upd=Path('working_source/app/xps_update.py')
          u=upd.read_text(encoding='utf-8')
          if 'CURRENT_VERSION = "96"' not in u:
              raise SystemExit('Expected v96 updater source before v97 bump')
          u=u.replace('CURRENT_VERSION = "96"','CURRENT_VERSION = "97"',1)
          upd.write_text(u,encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          r=readme.read_text(encoding='utf-8')
          entry='''\nXPS Tracker Updater v97\n- Make every MSA review field editable for both physical rows: Upstream ID, Downstream ID, and Length.\n- If corrected IDs no longer identify the same directed pipe, save the corrections and cancel MSA creation instead of merging the rows.\n- Protect manually corrected MSA lengths from later OCR retries.\n- Fix the 8-26 Pipe split where printed 82.87 could degrade to 2.87 when individual MSA parts are much shorter than the combined master length.\n- Refresh the persistent OCR cache generation so v97 does not reuse stale v96 OCR observations for affected PDFs.\n- Preserve all v96 OCR reconciliation, R2 direction, compact-layout, suffix, padded-endpoint, faint-row, and review safeguards.\n'''
          if 'XPS Tracker Updater v97' not in r:
              readme.write_text(r.rstrip()+entry+'\n',encoding='utf-8')
          PY

      - name: Compile and run full active regression suite
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { echo "===== $1 ====="; python "$1"; }
          run_test working_source/tests/regression_post_v96_msa_editable_fields.py
          run_test working_source/tests/regression_post_v95_new_packet_ocr.py
          run_test working_source/tests/regression_post_v95_padded_endpoint_ids.py
          run_test working_source/tests/regression_post_v95_msa_suffix_review.py
          run_test working_source/tests/regression_v95_faint_compact_rows.py
          run_test working_source/tests/regression_v95_exact_endpoint_priority.py
          run_test working_source/tests/regression_v94_stacked_endpoint_digits.py
          run_test working_source/tests/regression_v93_workorder_low_confidence_blank.py
          run_test working_source/tests/regression_v93_new_asset_notes.py
          run_test working_source/tests/regression_v92_workorder_4_or_5_digits.py
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release source and scope
        run: |
          set -e
          grep -q "APP_VERSION = '97'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "97"' working_source/app/xps_update.py
          grep -q "OCR_CACHE_VERSION = 'v7'" working_source/app/reno_scan_updater.py
          grep -q "Save Changes & Cancel MSA" working_source/app/reno_scan_updater.py
          grep -q 'XPS Tracker Updater v97' working_source/app/README_XPS_Tracker_Updater.txt
          git checkout -- working_source/app/__pycache__ 2>/dev/null || true
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -vE '^(working_source/app/reno_scan_updater.py|working_source/app/xps_update.py|working_source/app/README_XPS_Tracker_Updater.txt|working_source/tests/regression_v80_ocr_total_ui.py|working_source/tests/regression_post_v96_msa_editable_fields.py)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changed files before release commit:'
            echo "$unexpected"
            exit 1
          fi

      - name: Build and validate v97 ZIP
        run: |
          set -e
          rm -rf dist_v97 verify_v97 XPS_Tracker_Updater_v97.zip
          mkdir -p dist_v97/XPS_Tracker_Updater
          cp -a working_source/app/. dist_v97/XPS_Tracker_Updater/
          find dist_v97 -type d -name __pycache__ -prune -exec rm -rf {} +
          if find dist_v97 -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then
            echo 'Private/customer document found in package.'
            exit 1
          fi
          test -f dist_v97/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist_v97/XPS_Tracker_Updater/xps_update.py
          test -f dist_v97/XPS_Tracker_Updater/run_xps_tracker.bat
          python - <<'PY'
          from pathlib import Path
          assert "APP_VERSION = '97'" in Path('dist_v97/XPS_Tracker_Updater/reno_scan_updater.py').read_text(encoding='utf-8')
          assert 'CURRENT_VERSION = "97"' in Path('dist_v97/XPS_Tracker_Updater/xps_update.py').read_text(encoding='utf-8')
          assert "OCR_CACHE_VERSION = 'v7'" in Path('dist_v97/XPS_Tracker_Updater/reno_scan_updater.py').read_text(encoding='utf-8')
          PY
          cd dist_v97
          zip -qr ../XPS_Tracker_Updater_v97.zip XPS_Tracker_Updater
          cd ..
          unzip -t XPS_Tracker_Updater_v97.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('XPS_Tracker_Updater_v97.zip') as z:
              names=[n for n in z.namelist() if n]
              assert names and all(n.startswith('XPS_Tracker_Updater/') for n in names)
              forbidden=[n for n in names if n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm'))]
              assert not forbidden, forbidden
          print('Validated v97 ZIP structure and private-file exclusion')
          PY
          sha256sum XPS_Tracker_Updater_v97.zip | tee v97.sha256
          stat -c '%s' XPS_Tracker_Updater_v97.zip | tee v97.size

      - name: Commit tested v97 source
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py \
                  working_source/app/xps_update.py \
                  working_source/app/README_XPS_Tracker_Updater.txt \
                  working_source/tests/regression_v80_ocr_total_ui.py \
                  working_source/tests/regression_post_v96_msa_editable_fields.py
          git commit -m 'Release v97 editable MSA and 8-26 OCR fix [skip ci]'
          git push origin HEAD:v97-publish-exec4
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish and verify public v97 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git tag v97 "$RELEASE_COMMIT"
          git push origin v97
          gh release create v97 XPS_Tracker_Updater_v97.zip \
            --target "$RELEASE_COMMIT" \
            --title 'XPS Tracker Updater v97' \
            --notes 'v97 makes all MSA review IDs and lengths editable, saves corrected non-matching rows without creating an MSA, fixes the 8-26 82.87-to-2.87 Pipe OCR failure, and refreshes the OCR cache generation so stale v96 reads are not reused. The real 8-26 page-2 and page-4 fixtures and the full active regression suite were verified before release.'
          expected_sha=$(cut -d' ' -f1 v97.sha256)
          expected_size=$(cat v97.size)
          mkdir -p verify_v97
          gh release download v97 -p XPS_Tracker_Updater_v97.zip -D verify_v97
          actual_sha=$(sha256sum verify_v97/XPS_Tracker_Updater_v97.zip | cut -d' ' -f1)
          actual_size=$(stat -c%s verify_v97/XPS_Tracker_Updater_v97.zip)
          test "$expected_sha" = "$actual_sha"
          test "$expected_size" = "$actual_size"
          echo "V97_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "V97_SIZE=$actual_size" >> "$GITHUB_ENV"
          echo "Verified public v97 asset SHA=$actual_sha size=$actual_size"

      - name: Advance public manifest only after asset verification
        run: |
          set -e
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('update_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          if str(data.get('version'))!='96':
              raise SystemExit(f"Expected public manifest v96 before advance, got {data.get('version')}")
          data={
            'version':'97',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v97/XPS_Tracker_Updater_v97.zip',
            'sha256':os.environ['V97_SHA'],
            'release_notes':[
              'Make Upstream ID, Downstream ID, and Length editable for both rows in MSA review',
              'If corrected IDs no longer match, save both corrected rows and cancel MSA creation instead of merging them',
              'Fix the 8-26 split-pipe OCR case where printed 82.87 could be reduced to 2.87',
              'Refresh the OCR cache generation so stale v96 observations are not reused',
              'Preserve all v96 OCR reconciliation, R2 direction, compact-layout, suffix, padded-endpoint, faint-row, and review safeguards'
            ]
          }
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git commit -m 'Advance updater manifest to v97'
          git push origin main
          git pull --ff-only origin main
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('update_manifest.json').read_text())
          assert d['version']=='97'
          assert d['sha256']==os.environ['V97_SHA']
          assert d['download_url'].endswith('/v97/XPS_Tracker_Updater_v97.zip')
          print('Verified public updater manifest v97')
          PY

      - name: Document v97, clean temporary machinery, and advance v95-work
        run: |
          set -e
          git checkout v97-publish-exec4
          git pull --ff-only origin v97-publish-exec4
          python - <<'PY'
          import os,re
          from pathlib import Path
          sha=os.environ['V97_SHA']; size=os.environ['V97_SIZE']; commit=os.environ['RELEASE_COMMIT']

          p=Path('README.md'); r=p.read_text(encoding='utf-8')
          r=re.sub(r'## Current production release: v96\n\n- Tag: `v96`\n- Release: `XPS Tracker Updater v96`\n- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v96\.zip`\n- Size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`\n\nThe public updater manifest points to this verified v96 asset\.',
                   f'## Current production release: v97\n\n- Tag: `v97`\n- Release: `XPS Tracker Updater v97`\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v97.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n\nThe public updater manifest points to this verified v97 asset.',r,count=1)
          if '## v97\n' not in r:
              section='''\n## v97\n\n- Makes Upstream ID, Downstream ID, and Length editable for both physical rows in the MSA review popup.\n- Corrected IDs that no longer identify the same directed pipe can be saved without combining the rows.\n- Fixes the 8-26 split-pipe OCR failure where 82.87 could degrade to 2.87.\n- Bumps the persistent OCR cache generation to prevent stale v96 observations from being reused.\n- Preserves the complete v96 parser/review safeguard baseline.\n'''
              r=r.replace('\n## Development baseline\n',section+'\n## Development baseline\n',1)
          p.write_text(r,encoding='utf-8')

          p=Path('PROJECT_CONTEXT.md'); c=p.read_text(encoding='utf-8')
          c=c.replace('Current production version: **v96**.','Current production version: **v97**.',1)
          release_block=f'''Public v97 release:\n\n- Tag: `v97`\n- Release title: `XPS Tracker Updater v97`\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v97.zip`\n- Asset size: `{size}` bytes\n- SHA-256: `{sha}`\n- `working_source/app/reno_scan_updater.py`: `APP_VERSION = '97'`\n- `working_source/app/xps_update.py`: `CURRENT_VERSION = "97"`\n- Public `update_manifest.json` points to that exact v97 asset/checksum.\n\n### Current v97 release changes\n\n- Both physical MSA rows expose editable Upstream ID, Downstream ID, and Length fields beside their PDF crops.\n- If corrected IDs no longer identify the same directed pipe, `Save Changes & Cancel MSA` preserves the corrections and keeps the rows separate.\n- Manual MSA length corrections are authoritative against later OCR retries.\n- The 8-26 page-2 Pipe fixture now preserves `R2-349 -> R2-335 = 82.87` instead of degrading it to `2.87`; page 2 remains 27 rows / 6720.58 and page 4 remains 15 rows / 4198.37.\n- OCR cache generation is `v7` so stale v96 observations are not reused.\n- Permanent regression: `working_source/tests/regression_post_v96_msa_editable_fields.py`.\n\n'''
          if 'Public v97 release:' not in c:
              pos=c.find('Public v96 release:')
              if pos<0: raise SystemExit('PROJECT_CONTEXT public release anchor missing')
              c=c[:pos]+release_block+c[pos:]
          p.write_text(c,encoding='utf-8')

          p=Path('RELEASE_CHECKLIST.md'); q=p.read_text(encoding='utf-8')
          q=q.replace('current **v96 production baseline**','current **v97 production baseline**',1)
          if 'post-v96 editable MSA field / 8-26 OCR regression' not in q:
              q=q.replace('The active baseline includes, at minimum:\n\n','The active baseline includes, at minimum:\n\n- post-v96 editable MSA field / 8-26 OCR regression;\n',1)
          if '`working_source/tests/regression_post_v96_msa_editable_fields.py`' not in q:
              q=q.replace('The current unreleased regressions are:\n\n','The current unreleased regressions are:\n\n- `working_source/tests/regression_post_v96_msa_editable_fields.py`\n',1)
          msa='''- Every Upstream ID, Downstream ID, and Length shown in MSA review must be editable.\n- If corrected IDs no longer identify the same directed pipe, the user can save those corrections and cancel MSA creation without merging the rows.\n- Manual MSA length corrections must not be overwritten by later OCR total-recovery retries.\n- The 8-26 page-2 two-part pipe must preserve 84.48 + 82.87 and the physical page total 6720.58; 82.87 must not degrade to 2.87.\n'''
          if 'Every Upstream ID, Downstream ID, and Length shown in MSA review must be editable.' not in q:
              q=q.replace('### Split Pipes / MSA\n\n','### Split Pipes / MSA\n\n'+msa,1)
          q=re.sub(r'v96 is the current production release:\n\n- Release commit: `[^`]+`\n- Asset: `XPS_Tracker_Updater_v96\.zip`\n- Size: `\d+` bytes\n- SHA-256: `[0-9a-f]{64}`\n\nThe public updater manifest points to that verified v96 asset\.',
                   f'v97 is the current production release:\n\n- Release commit: `{commit}`\n- Asset: `XPS_Tracker_Updater_v97.zip`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n\nThe public updater manifest points to that verified v97 asset.',q,count=1)
          p.write_text(q,encoding='utf-8')
          PY
          git rm -f .github/workflows/publish-v97.yml .trigger_v97_publish working_source/tools/v97_patch_payload.py
          git add README.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document v97 and remove publish machinery [skip ci]'
          git push origin HEAD:v97-publish-exec4
          git push origin HEAD:v95-work

      - name: Remove temporary release branches
        if: success()
        run: |
          git push origin --delete v97-publish-exec4 v97-publish-safety v97-publish-work v97-publish-run v97-release v97-release-run v97-final-publish v97-publish-final v97-actual-publish v97-go v97-publish-only v97-final-run v97-LAST v97-publish-exec v97-publish-exec2 v97-publish-exec3 v97-publish-exec5 v97-publish-exec4 2>/dev/null || true

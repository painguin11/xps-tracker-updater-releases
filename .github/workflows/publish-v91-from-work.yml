name: Publish v91 from work branch

on:
  push:
    branches:
      - v91-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V91' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v91 work branch
        uses: actions/checkout@v4
        with:
          ref: v91-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply targeted v91 Work Order OCR improvement
        run: python working_source/tools/apply_v91_workorder_color_ocr.py

      - name: Compile and run active regression suite
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { if [ -f "$1" ]; then echo "===== $1 ====="; python "$1"; fi; }
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release versions and parser preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]91['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']91[\"\']',updater,re.M)
          assert 'Version 91 review, endpoint, and work-order OCR improvements' in readme
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          for required in ('def _workorder_magenta_variants','def _workorder_magenta_candidates',
                           'class NewAssetApprovalDialog','def _endpoint_digit_tokens',
                           'def _resolve_pipe_pair_from_endpoint_digits'):
              assert required in app, required
          print('v91 version, parser-preservation, preview, endpoint, and W/O OCR checks passed.')
          PY

      - name: Build and validate release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          test -f dist/XPS_Tracker_Updater/README_XPS_Tracker_Updater.txt
          cd dist
          zip -qr XPS_Tracker_Updater_v91.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v91.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v91.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names, 'empty ZIP'
              assert all(n.startswith('XPS_Tracker_Updater/') for n in names), 'unexpected top-level ZIP entry'
              for required in ('XPS_Tracker_Updater/reno_scan_updater.py',
                               'XPS_Tracker_Updater/xps_update.py',
                               'XPS_Tracker_Updater/run_xps_tracker.bat',
                               'XPS_Tracker_Updater/README_XPS_Tracker_Updater.txt'):
                  assert required in names, required
              forbidden=[n for n in names if n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm'))]
              assert not forbidden, f'customer/document files unexpectedly packaged: {forbidden}'
          print('v91 ZIP structure and customer-file exclusion passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v91.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v91.zip)" >> "$GITHUB_ENV"

      - name: Commit v91 release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt working_source/tests/regression_v91_workorder_color_ocr.py
          git rm working_source/tools/apply_v91_workorder_color_ocr.py .github/workflows/publish-v91-from-work.yml
          git commit -m 'Release v91 [skip ci]'
          git push origin HEAD:v91-work

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v91 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v91 release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v91 dist/XPS_Tracker_Updater_v91.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title 'XPS Tracker Updater v91' \
            --notes 'v91 adds PDF ID crops to the existing suffixed NEW PIPE / NEW MANHOLE Yes-No approval flow, conservatively recovers damaged Pipe/Cleaning endpoints only when both OCR-observed numeric bodies uniquely identify one directional master pipe, and redesigns Work Order OCR around the actual form: the five-digit W/O is machine-typed pink/magenta, so v91 isolates that colored text before OCR instead of discarding the color signal in grayscale. The editable confirmation popup and prior v90/v89 safeguards remain in place.'
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          expected=f"sha256:{os.environ['RELEASE_SHA']}"
          last=None
          for _ in range(8):
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v91'],text=True))
              assets=data.get('assets',[])
              asset=next((a for a in assets if a.get('name')=='XPS_Tracker_Updater_v91.zip'),None)
              assert asset, 'release ZIP missing'
              last=asset
              if str(asset.get('digest') or '')==expected:
                  break
              time.sleep(2)
          assert str(last.get('digest') or '')==expected, (last.get('digest'),expected)
          assert int(last.get('size') or 0)==int(os.environ['RELEASE_SIZE']), (last.get('size'),os.environ['RELEASE_SIZE'])
          print('public v91 release asset name, size, and SHA-256 verified')
          PY

      - name: Advance and re-verify public update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          old=json.loads(path.read_text(encoding='utf-8'))
          assert str(old.get('version'))=='90', f"Expected live v90 manifest, found {old.get('version')}"
          data={
            'version':'91',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v91/XPS_Tracker_Updater_v91.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Show PDF ID crops in the existing Yes / No approval popup for suffixed NEW PIPE and NEW MANHOLE assets',
              'Recover damaged Pipe/Cleaning endpoints only when OCR-observed numeric bodies from both cells uniquely identify one directional master pipe',
              'Keep legitimate fully printed non-master pairs unresolved for Add to Master / Ignore review',
              'Read the five-digit Work Order number by isolating its machine-typed pink/magenta text before OCR instead of relying on grayscale',
              'Keep the editable Work Order confirmation popup and the established grayscale OCR as a final fallback for unusually faded scans'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v91 update manifest'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/public_manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='91'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v91/XPS_Tracker_Updater_v91.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('committed public v91 manifest version, URL, and checksum verified')
          PY

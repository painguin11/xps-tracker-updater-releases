name: Publish XPS Tracker Updater v104

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_publish_v104'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr zip unzip >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Prepare v104 source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('working_source/app/reno_scan_updater.py')
          text=app.read_text(encoding='utf-8')
          assert text.count("APP_VERSION = '103'")==1, 'unexpected APP_VERSION baseline'
          app.write_text(text.replace("APP_VERSION = '103'","APP_VERSION = '104'",1),encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          text=updater.read_text(encoding='utf-8')
          assert text.count('CURRENT_VERSION = "103"')==1, 'unexpected CURRENT_VERSION baseline'
          updater.write_text(text.replace('CURRENT_VERSION = "103"','CURRENT_VERSION = "104"',1),encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          text=readme.read_text(encoding='utf-8')
          assert text.startswith('XPS Tracker Updater v103\n')
          text=text.replace('XPS Tracker Updater v103\n','XPS Tracker Updater v104\n',1)
          text=text.replace('Current status (September 14, 2026)','Current status (September 16, 2026)',1)
          text=text.replace('Production release: v103. Development: v95-work / working_source.',
                            'Production release: v104. Development: v95-work / working_source.',1)
          old_summary=('v103 improves Manhole recovery: partial/clipped B&C rows get a guarded ruled-row\n'
                       'reread, and a user-confirmed expected Manhole count now triggers a slower OCR\n'
                       'retry whenever the first pass does not match that count.\n')
          new_summary=('v104 supports reordered B&C Manhole tables whose printed columns place Date\n'
                       'before Manhole Number, and extends long-table row detection so the final\n'
                       'physical Manhole row is not lost near the bottom of the page.\n')
          assert old_summary in text
          text=text.replace(old_summary,new_summary,1)
          section='''\nVersion 104 reordered Manhole table support\n------------------------------------------\n- Reads the printed Manhole table header to locate Manhole Number and Date cells\n  instead of assuming Manhole Number is always first and Date is always last.\n- Supports the B&C layout Date | Manhole Number | Street | Drainage Area while\n  preserving the established v103 Manhole Number-first layout as a safe fallback.\n- Extends Manhole ruled-row detection far enough down the page to retain long\n  tables whose final row appears below the old 72-percent scan limit.\n- Uses the same detected Manhole/Date cells during expected-count retry.\n- Preserves strict asset-ID matching, expected-count safeguards, and all v103 and\n  earlier OCR, review, continuation, MSA, Trouble Ticket, total, and master-write\n  behavior.\n'''
          if 'Version 104 reordered Manhole table support' not in text:
              text += section
          readme.write_text(text,encoding='utf-8')
          PY

          python -m py_compile \
            working_source/app/reno_scan_updater.py \
            working_source/app/xps_review_controls.py \
            working_source/app/xps_update.py
          git diff --check

      - name: Run full active regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          tests=[
            'regression_post_v103_manhole_reordered_columns.py',
            'regression_post_v102_manhole_expected_count_retry.py',
            'regression_post_v102_manhole_partial_tokens.py',
            'regression_post_v100_826_trouble_geometry.py',
            'regression_post_v100_trouble_cells.py',
            'regression_trouble_workbook.py',
            'regression_post_v99_faint_vertical_grid.py',
            'regression_post_v98_short_wide_compact_table.py',
            'regression_post_v97_cleaning_clipped_digits.py',
            'regression_post_v96_msa_editable_fields.py',
            'regression_post_v95_new_packet_ocr.py',
            'regression_post_v95_padded_endpoint_ids.py',
            'regression_post_v95_msa_suffix_review.py',
            'regression_v95_faint_compact_rows.py',
            'regression_v95_exact_endpoint_priority.py',
            'regression_v94_stacked_endpoint_digits.py',
            'regression_v93_workorder_low_confidence_blank.py',
            'regression_v93_new_asset_notes.py',
            'regression_v92_workorder_4_or_5_digits.py',
            'regression_v91_workorder_color_ocr.py',
            'regression_v91_new_asset_preview_and_endpoint_recovery.py',
            'regression_v90_review_ui.py',
            'regression_v89_review_workflow.py',
            'regression_v89_printed_pair_identity.py',
            'regression_v89_manhole_count_and_final_total.py',
            'regression_v88_continuations.py',
            'regression_v87_total_summary_separator.py',
            'regression_v86_assets_and_edit.py',
            'regression_v85_edit_row_previews.py',
            'regression_v85_mandatory_rows_and_length_votes.py',
            'regression_v84_real_packet_length_logic.py',
            'regression_v83_length_recovery.py',
            'regression_v83_exact_pdf_numbers.py',
            'regression_v83_total_preview_group_errors.py',
            'regression_v82_pair_video_lengths.py',
            'regression_v82_master_asset_format.py',
            'regression_v82_suffix_guard.py',
            'regression_v82_cleaning_header_noise.py',
            'regression_v82_layout_threshold.py',
            'regression_v81_header_outline.py',
            'regression_v80_ocr_total_ui.py',
            'regression_v79_layout_speed.py',
            'regression_v78_rollback.py',
            'regression_v75_811_ocr.py',
            'regression_v74_row_filtering.py',
            'regression_v73_total_dates.py',
            'regression_compact_table_fallback.py',
            'regression_length_totals.py',
            'regression_split_pipes.py',
            'regression_new_assets.py',
            'regression_master_insert.py',
            'regression_r2_endpoint_ocr.py',
            'regression_v102_review_wrapper.py',
          ]
          root=Path('working_source/tests')
          for name in tests:
              path=root/name
              if not path.exists(): raise SystemExit(f'Missing active regression: {path}')
              print(f'===== {path} =====',flush=True)
              subprocess.run([sys.executable,str(path)],check=True)
          print(f'FULL ACTIVE REGRESSION SUITE: {len(tests)}/{len(tests)} passed')
          PY
          git diff --check

      - name: Audit release scope
        run: |
          set -euo pipefail
          if git diff --name-only 97254c534e2d6beb92fcce81bf00a9ed66db071d...HEAD | grep -Ei '\.(pdf|xlsx|xls|xlsm)$' ; then
            echo 'Private/customer document type was committed after v103; refusing release.' >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(pdf|xlsx|xls|xlsm)$' ; then
            echo 'Private/customer document type is tracked in Git; refusing release.' >&2
            exit 1
          fi
          grep -q "APP_VERSION = '104'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "104"' working_source/app/xps_update.py
          grep -q 'XPS Tracker Updater v104' working_source/app/README_XPS_Tracker_Updater.txt
          grep -q 'def _year15_manhole_column_boxes' working_source/app/reno_scan_updater.py
          grep -q "_table_row_bands(img,.04,.90)" working_source/app/reno_scan_updater.py
          test -f working_source/tests/regression_post_v103_manhole_reordered_columns.py

      - name: Commit release source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          git commit -m 'Prepare XPS Tracker Updater v104'
          git push origin HEAD:v95-work
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and validate package
        id: package
        run: |
          set -euo pipefail
          rm -rf dist XPS_Tracker_Updater_v104.zip
          mkdir -p dist/XPS_Tracker_Updater
          rsync -a --exclude '__pycache__' --exclude '*.pyc' working_source/app/ dist/XPS_Tracker_Updater/
          if find dist -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then
            echo 'Private/customer document type found in package; refusing release.' >&2
            exit 1
          fi
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_review_controls.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          test -f dist/XPS_Tracker_Updater/setup_and_run.bat
          (cd dist && zip -rq ../XPS_Tracker_Updater_v104.zip XPS_Tracker_Updater)
          unzip -t XPS_Tracker_Updater_v104.zip
          if unzip -Z1 XPS_Tracker_Updater_v104.zip | awk -F/ 'NF && $1!="XPS_Tracker_Updater" {bad=1} END {exit bad}'; then :; else
            echo 'ZIP contains an unexpected top-level entry.' >&2
            exit 1
          fi
          SHA=$(sha256sum XPS_Tracker_Updater_v104.zip | awk '{print $1}')
          SIZE=$(stat -c%s XPS_Tracker_Updater_v104.zip)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Built XPS_Tracker_Updater_v104.zip size=$SIZE sha256=$SHA"

      - name: Create v104 release and verify public asset
        env:
          GH_TOKEN: ${{ github.token }}
          REL_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha }}
          EXPECTED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          if gh release view v104 >/dev/null 2>&1; then
            echo 'v104 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v104 | grep -q .; then
            echo 'v104 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create v104 XPS_Tracker_Updater_v104.zip \
            --target "$REL_SHA" \
            --title 'XPS Tracker Updater v104' \
            --notes 'Adds support for reordered B&C Manhole tables. The parser now reads the printed header to locate Manhole Number and Date instead of assuming fixed first/last columns, supports Date-first tables, and scans far enough down long Manhole tables to retain the final physical row. The expected-count retry uses the same detected columns. Strict asset-ID matching and all v103 and earlier safeguards are preserved.'
          rm -rf verify-public && mkdir verify-public
          gh release download v104 --pattern 'XPS_Tracker_Updater_v104.zip' --dir verify-public
          ACTUAL_SHA=$(sha256sum verify-public/XPS_Tracker_Updater_v104.zip | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s verify-public/XPS_Tracker_Updater_v104.zip)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          echo "Verified public asset size=$ACTUAL_SIZE sha256=$ACTUAL_SHA"

      - name: Update release documentation and remove temporary publish machinery
        env:
          REL_SHA: ${{ steps.source.outputs.sha }}
          VERIFIED_SHA: ${{ steps.package.outputs.sha }}
          VERIFIED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re

          rel_sha=os.environ['REL_SHA']
          sha=os.environ['VERIFIED_SHA']
          size=os.environ['VERIFIED_SIZE']

          agents=Path('AGENTS.md')
          text=agents.read_text(encoding='utf-8')
          text=text.replace('- Production version: **v103**.','- Production version: **v104**.',1)
          text=text.replace('Preserve all documented behavior through v103 unless the user explicitly asks','Preserve all documented behavior through v104 unless the user explicitly asks',1)
          agents.write_text(text,encoding='utf-8')

          context=Path('PROJECT_CONTEXT.md')
          text=context.read_text(encoding='utf-8')
          text=text.replace('Current production version: **v103**.','Current production version: **v104**.',1)
          text=text.replace('preserve the full released v103 baseline','preserve the full released v104 baseline',1)
          text=text.replace('## State audit — September 14, 2026','## State audit — September 16, 2026',1)
          text=text.replace('- Current production release: **v103** at release source commit `97254c534e2d6beb92fcce81bf00a9ed66db071d`.',
                            f'- Current production release: **v104** at release source commit `{rel_sha}`.',1)
          text=text.replace('- `working_source/app/reno_scan_updater.py` and `working_source/app/xps_update.py` are both version 103.',
                            '- `working_source/app/reno_scan_updater.py` and `working_source/app/xps_update.py` are both version 104.',1)
          text=text.replace('- The production updater reads `main/update_manifest.json`, which points to the verified v103 public asset and SHA-256 below.',
                            '- The production updater reads `main/update_manifest.json`, which points to the verified v104 public asset and SHA-256 below.',1)
          text=text.replace('- The v103 Linux release job compiled the app, passed the full 52/52 active regression matrix, audited release scope, tested ZIP integrity, re-downloaded the public asset, verified exact size/SHA-256, and only then advanced the manifest.',
                            '- The v104 Linux release job compiled the app, passed the full 53/53 active regression matrix, audited release scope, tested ZIP integrity, re-downloaded the public asset, verified exact size/SHA-256, and only then advanced the manifest.',1)
          text=text.replace('- Temporary v103 publishing/documentation machinery is removed after this sync.',
                            '- Temporary v104 publishing/documentation machinery is removed after this sync.',1)
          start=text.index('## Pending after v103 - reordered Manhole table columns')
          end=text.index('## Released in v103 — Manhole OCR count recovery',start)
          released=f'''## Released in v104 — reordered Manhole table columns\n\nPublic v104 release:\n\n- Tag: `v104`\n- Release title: `XPS Tracker Updater v104`\n- Release commit: `{rel_sha}`\n- Asset: `XPS_Tracker_Updater_v104.zip`\n- Asset size: `{size}` bytes\n- SHA-256: `{sha}`\n- Public updater manifest on `main` points to `https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v104/XPS_Tracker_Updater_v104.zip` and was advanced only after the public release asset was downloaded back and its size/SHA-256 matched exactly.\n- Full active Linux CI suite: **53/53 regression scripts passed** on the v104-versioned source. Private customer fixture OCR and Windows Excel COM/live Tk GUI paths were not run by this Linux release job.\n\nv104 fixes the supplied B&C Manhole layout while keeping the customer PDF private:\n\n1. **Header-driven Manhole/Date columns**\n   - Manhole parsing reads printed header positions to locate the Manhole Number and Date cells.\n   - Date-first tables such as `Date | Manhole Number | Street | Drainage Area` are supported.\n   - If header OCR is unusable, the established v103 Manhole Number-first / Date-last fallback remains available.\n2. **Long Manhole table coverage**\n   - Ruled-row detection extends from the old 72% page limit to 90%, preserving final physical rows near the bottom of long reports.\n   - Expected-count retry uses the same detected Manhole/Date cells.\n   - Global asset-ID syntax, matching, and new-suffix safeguards are unchanged.\n   - Permanent regression: `working_source/tests/regression_post_v103_manhole_reordered_columns.py`.\n\n'''
          text=text[:start]+released+text[end:]
          context.write_text(text,encoding='utf-8')

          checklist=Path('RELEASE_CHECKLIST.md')
          text=checklist.read_text(encoding='utf-8')
          text=text.replace('current **v103 production baseline**','current **v104 production baseline**',1)
          marker='v103 is the current production release:\n\n'
          pos=text.index(marker)
          body_start=pos+len(marker)
          history=text.index('Previous verified production reference follows for history.',body_start)
          v103_body=text[body_start:history].rstrip()
          v104_block=(f'v104 is the current production release:\n\n'
                      f'- Release commit: `{rel_sha}`\n'
                      f'- Asset: `XPS_Tracker_Updater_v104.zip`\n'
                      f'- Size: `{size}` bytes\n'
                      f'- SHA-256: `{sha}`\n'
                      f'- Public manifest version/URL/SHA were re-read and verified after release asset re-download.\n'
                      f'- 53/53 active Linux regression scripts passed on the versioned release source. Private fixture OCR and Windows Excel COM/live Tk GUI checks remain platform/fixture limitations rather than release-job coverage.\n\n'
                      f'Previous verified production reference follows for history.\n\n'
                      f'v103 was the previous production release:\n\n{v103_body}\n\n')
          after_history=history+len('Previous verified production reference follows for history.\n\n')
          text=text[:pos]+v104_block+text[after_history:]
          checklist.write_text(text,encoding='utf-8')

          docs=Path('working_source/docs')
          (docs/'AGENTS.md').write_text(agents.read_text(encoding='utf-8'),encoding='utf-8')
          (docs/'PROJECT_CONTEXT.md').write_text(context.read_text(encoding='utf-8'),encoding='utf-8')
          (docs/'RELEASE_CHECKLIST.md').write_text(checklist.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/publish-v104.yml .trigger_publish_v104
          git add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md working_source/docs/AGENTS.md working_source/docs/PROJECT_CONTEXT.md working_source/docs/RELEASE_CHECKLIST.md
          git commit -m 'Document v104 release and clean publish machinery'
          git push origin HEAD:v95-work

      - name: Advance public updater manifest and public docs only after asset verification
        env:
          VERIFIED_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf ../xps-main
          git worktree add ../xps-main origin/main
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          path=Path('../xps-main/update_manifest.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert str(data.get('version'))=='103',data
          data['version']='104'
          data['download_url']='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v104/XPS_Tracker_Updater_v104.zip'
          data['sha256']=os.environ['VERIFIED_SHA']
          data['release_notes']=[
              'Support B&C Manhole tables where Date appears before Manhole Number',
              'Detect Manhole Number and Date cells from the printed table header instead of fixed column positions',
              'Extend long Manhole table row detection so final rows near the bottom of the page are retained',
              'Use the same detected columns during expected-count retry while preserving strict asset-ID safeguards',
          ]
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          for name in ('AGENTS.md','PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md'):
              shutil.copy2(name,Path('../xps-main')/name)
          PY
          git -C ../xps-main diff --check
          git -C ../xps-main config user.name 'github-actions[bot]'
          git -C ../xps-main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ../xps-main add update_manifest.json AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git -C ../xps-main commit -m 'Point auto-updater manifest to v104'
          git -C ../xps-main push origin HEAD:main

      - name: Final public verification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha }}
          EXPECTED_SIZE: ${{ steps.package.outputs.size }}
          REL_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view v104 --json tagName,name,targetCommitish,assets
          git fetch origin main v95-work
          git show origin/main:update_manifest.json > /tmp/update_manifest_v104.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/update_manifest_v104.json').read_text(encoding='utf-8'))
          assert data['version']=='104',data
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v104/XPS_Tracker_Updater_v104.zip',data
          assert data['sha256']==os.environ['EXPECTED_SHA'],data
          print('Verified public manifest:',data['version'],data['sha256'])
          PY
          rm -rf verify-final && mkdir verify-final
          gh release download v104 --pattern 'XPS_Tracker_Updater_v104.zip' --dir verify-final
          FINAL_SHA=$(sha256sum verify-final/XPS_Tracker_Updater_v104.zip | awk '{print $1}')
          FINAL_SIZE=$(stat -c%s verify-final/XPS_Tracker_Updater_v104.zip)
          test "$FINAL_SHA" = "$EXPECTED_SHA"
          test "$FINAL_SIZE" = "$EXPECTED_SIZE"
          TAG_SHA=$(git rev-list -n 1 v104)
          test "$TAG_SHA" = "$REL_SHA"
          test -z "$(git ls-tree -r --name-only origin/v95-work | grep -E '(^|/)publish-v104\.yml$|^\.trigger_publish_v104$' || true)"
          grep -q "APP_VERSION = '104'" <(git show origin/v95-work:working_source/app/reno_scan_updater.py)
          grep -q 'CURRENT_VERSION = "104"' <(git show origin/v95-work:working_source/app/xps_update.py)
          echo "FINAL_RELEASE_SHA=$FINAL_SHA"
          echo "FINAL_RELEASE_SIZE=$FINAL_SIZE"
          echo "FINAL_RELEASE_COMMIT=$REL_SHA"

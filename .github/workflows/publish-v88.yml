name: Publish v89 release bridge

on:
  push:
    branches:
      - v89-work

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'PUBLISH_V89'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v89 work branch
        uses: actions/checkout@v4
        with:
          ref: v89-work
          fetch-depth: 0

      - name: Publish v89
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_v89.sh

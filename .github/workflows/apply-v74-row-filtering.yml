name: Apply v74 row filtering

on:
  push:
    branches:
      - v74-work

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v74-work
          fetch-depth: 0
      - name: Apply base v74 fixes when needed
        run: |
          if grep -q 'def _date_outlier_is_well_supported' working_source/app/reno_scan_updater.py; then
            echo 'Base v74 patch already present.'
          else
            python .github/scripts/apply_v74_row_filter_date_consensus.py
          fi
      - name: Refine date outlier handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('working_source/app/reno_scan_updater.py')
          text=p.read_text(encoding='utf-8')
          old='''def _date_outlier_is_well_supported(evidence, dominant_date):
              """Keep a different date only when multiple OCR passes independently support it."""
              if not evidence or dominant_date is None: return False
              date=evidence.get('date')
              if date is None or date==dominant_date: return True
              strong_votes=(evidence.get('strong_votes') or {}).get(date,0)
              total_votes=(evidence.get('votes') or {}).get(date,0)
              # One lucky/misread full-year pass is not enough. Requiring at least two
              # independent strong reads (or three total matching reads) preserves genuine
              # mixed-date tables while correcting isolated 01/01/2026-style OCR failures.
              return strong_votes>=2 or total_votes>=3
          '''
          # Heredoc indentation is removed below before matching the source block.
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''def _date_outlier_is_well_supported(evidence, dominant_date, expected_date=None):
              """Keep a different date only when independent OCR evidence is strong enough."""
              if not evidence or dominant_date is None: return False
              date=evidence.get('date')
              if date is None or date==dominant_date: return True
              strong_votes=(evidence.get('strong_votes') or {}).get(date,0)
              # When the dominant table date agrees with the confirmed work-order date,
              # require three full-date reads before preserving an outlier. This fixes
              # clipped 8/11/2026 cells that can repeatedly look like 1/1 or 3/11 while
              # still preserving a genuinely different, clearly printed date.
              dominant_matches_expected=(isinstance(expected_date,datetime) and
                                         dominant_date.date()==expected_date.date())
              required=3 if dominant_matches_expected else 2
              return strong_votes>=required
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old in text:
              text=text.replace(old,new,1)
          elif 'def _date_outlier_is_well_supported(evidence, dominant_date, expected_date=None):' not in text:
              raise SystemExit('date outlier helper not found')
          old_call='_date_outlier_is_well_supported(date_evidence,dominant_date)'
          new_call='_date_outlier_is_well_supported(date_evidence,dominant_date,expected_date)'
          if old_call in text:
              text=text.replace(old_call,new_call,1)
          elif new_call not in text:
              raise SystemExit('date outlier call not found')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Write v74 regression file
        run: |
          cat > working_source/tests/regression_v74_row_filtering.py <<'PY'
          import ast
          from datetime import datetime
          from pathlib import Path

          SOURCE=Path('working_source/app/reno_scan_updater.py')
          text=SOURCE.read_text(encoding='utf-8')
          tree=ast.parse(text)
          wanted={'_date_outlier_is_well_supported'}
          nodes=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in wanted]
          ns={'datetime':datetime}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(SOURCE),'exec'),ns)
          dom=datetime(2026,8,11)
          expected=datetime(2026,8,11)
          # Two full-year OCR reads are not enough to override a table/date consensus
          # that agrees with the confirmed work-order date.
          bad={'date':datetime(2026,3,11),'votes':{datetime(2026,3,11):4},'strong_votes':{datetime(2026,3,11):2}}
          assert not ns['_date_outlier_is_well_supported'](bad,dom,expected)
          # Three independent strong reads preserve a genuinely different row date.
          real={'date':datetime(2026,8,12),'votes':{datetime(2026,8,12):4},'strong_votes':{datetime(2026,8,12):3}}
          assert ns['_date_outlier_is_well_supported'](real,dom,expected)
          # If the table's dominant date does not agree with the W/O date, keep the
          # less aggressive two-strong-read threshold.
          assert ns['_date_outlier_is_well_supported'](bad,dom,datetime(2026,8,10))
          assert "'band_index':None" in text
          assert "'in-grid footer total',len(bands)-1" in text
          assert "if total_band_index is not None and band_index==total_band_index:" in text
          assert 'Structural filtering happens BEFORE date repair' in text
          assert 'has_asset_digit_signal(up_obs) and has_asset_digit_signal(dn_obs)' in text
          assert "prepared['printed_total_info']=printed_total_info" in text
          print('v74 header/footer exclusion and date-outlier safeguards passed.')
          PY
      - name: Keep total regression aligned with pre-row total detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('working_source/tests/regression_length_totals.py')
          text=p.read_text(encoding='utf-8')
          old='assert "prepared[\'printed_total_info\']=_read_pair_table_printed_total" in source'
          new='assert "printed_total_info=_read_pair_table_printed_total" in source\nassert "prepared[\'printed_total_info\']=printed_total_info" in source'
          if old in text:
              text=text.replace(old,new,1)
          elif 'assert "prepared[\'printed_total_info\']=printed_total_info" in source' not in text:
              raise SystemExit('total regression assertion not found')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Compile source
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
      - name: Run v74 regression
        run: python working_source/tests/regression_v74_row_filtering.py
      - name: Run existing regressions
        run: |
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
      - name: Commit staged v74 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v74_row_filtering.py working_source/tests/regression_length_totals.py
          if ! git diff --cached --quiet; then
            git commit -m "Tighten pair-row and date validation [skip ci]"
            git push origin HEAD:v74-work
          fi

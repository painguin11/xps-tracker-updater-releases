name: Temporary publish v90

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-publish-v90.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v90-work
          fetch-depth: 0
      - name: Publish v90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash working_source/tools/publish_v90.sh

# rerun using current v88-v90 release regression set

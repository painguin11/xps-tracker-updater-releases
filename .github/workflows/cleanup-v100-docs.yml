name: Finalize XPS Tracker Updater v100 docs

on:
  push:
    branches:
      - v95-work
    paths:
      - .trigger_cleanup_v100_docs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: painguin11/xps-tracker-updater-releases
      RELEASE_SHA: ab55fb90ceb833b5663f3561a1a2d86938ac0a93
      PUBLIC_SIZE: '306725'
      PUBLIC_SHA: 8737420f93bc9bda55fb3693c3231c163ff9881013660762685126788afc3fcd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Verify published v100
        run: |
          set -euo pipefail
          grep -q "^APP_VERSION = '100'$" working_source/app/reno_scan_updater.py
          grep -q '^CURRENT_VERSION = "100"$' working_source/app/xps_update.py
          test "$(gh release view v100 --repo "$REPO" --json tagName --jq .tagName)" = "v100"
          test "$(gh release view v100 --repo "$REPO" --json assets --jq '.assets[0].size')" = "$PUBLIC_SIZE"
          test "$(gh release view v100 --repo "$REPO" --json assets --jq '.assets[0].digest')" = "sha256:$PUBLIC_SHA"

      - name: Update living release docs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          release_sha = os.environ["RELEASE_SHA"]
          public_size = os.environ["PUBLIC_SIZE"]
          public_sha = os.environ["PUBLIC_SHA"]

          ag = Path("AGENTS.md")
          s = ag.read_text(encoding="utf-8")
          if "Production version: **v99**." in s:
              s = s.replace("Production version: **v99**.", "Production version: **v100**.", 1)
          if "Production version: **v100**." not in s:
              raise SystemExit("AGENTS production marker missing")
          ag.write_text(s, encoding="utf-8")

          pc = Path("PROJECT_CONTEXT.md")
          s = pc.read_text(encoding="utf-8")
          if "Current production version: **v99**." in s:
              s = s.replace("Current production version: **v99**.", "Current production version: **v100**.", 1)
          if "Public v100 release:" not in s:
              marker = "Public v99 release:\n"
              if marker not in s:
                  raise SystemExit("PROJECT_CONTEXT v99 marker missing")
              lines = [
                  "Public v100 release:",
                  "",
                  "- Tag: `v100`",
                  "- Release title: `XPS Tracker Updater v100`",
                  f"- Release commit: `{release_sha}`",
                  "- Asset: `XPS_Tracker_Updater_v100.zip`",
                  f"- Asset size: `{public_size}` bytes",
                  f"- SHA-256: `{public_sha}`",
                  "- Adds a guarded faint-vertical-grid retry for image-only B&C compact Pipe/Cleaning tables after the normal dark-grid detectors fail.",
                  "- Permanent regression: `working_source/tests/regression_post_v99_faint_vertical_grid.py`.",
                  "- The supplied failing PDF was validated locally and remains private/uncommitted.",
                  "",
                  ""
              ]
              s = s.replace(marker, "\n".join(lines) + marker, 1)
          pc.write_text(s, encoding="utf-8")

          rc = Path("RELEASE_CHECKLIST.md")
          s = rc.read_text(encoding="utf-8")
          s = s.replace("current **v99 production baseline**", "current **v100 production baseline**", 1)
          marker = "## Current verified production reference\n\n"
          if marker not in s:
              raise SystemExit("RELEASE_CHECKLIST reference marker missing")
          start = s.index(marker) + len(marker)
          tail = "\n".join([
              "v100 is the current production release:",
              "",
              f"- Release commit: `{release_sha}`",
              "- Asset: `XPS_Tracker_Updater_v100.zip`",
              f"- Size: `{public_size}` bytes",
              f"- SHA-256: `{public_sha}`",
              "",
              "The public updater manifest points to that verified v100 asset. The v100 safeguard adds a fail-closed lighter vertical-grid retry for compact B&C pair tables while preserving all v99-and-earlier safeguards.",
              ""
          ])
          s = s[:start] + tail
          rc.write_text(s, encoding="utf-8")
          PY

      - name: Remove temporary publication machinery
        run: |
          set -euo pipefail
          git rm -f .github/workflows/publish-v100-final.yml .trigger_publish_v100_final
          git rm -f .github/workflows/cleanup-v100-docs.yml .trigger_cleanup_v100_docs
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md
          git commit -m "Document v100 release and clean publish files [skip ci]"
          git push origin HEAD:v95-work

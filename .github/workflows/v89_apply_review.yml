name: Apply v89 reviewed UI and validation changes

on:
  push:
    branches:
      - v89-work
    paths:
      - .github/workflows/v89_apply_review.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: contains(github.event.head_commit.message, '[v89-review-workflow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v89-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless pymupdf pytesseract packaging
      - name: Apply reviewed changes
        run: python .github/v89_apply_review.py
      - name: Syntax check
        run: python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
      - name: Run source-available regression suite
        shell: bash
        run: |
          set -e
          for test in working_source/tests/regression_*.py; do
            if [ "$test" = "working_source/tests/regression_tall_cleaning_header.py" ]; then
              echo "=== $test ==="
              echo "SKIPPED: requires private upload/8-11-2026.pdf fixture and legacy local package path not stored in the release repo."
              continue
            fi
            echo "=== $test ==="
            python "$test"
          done
      - name: Diff sanity check
        run: git diff --check
      - name: Commit reviewed v89 changes
        shell: bash
        run: |
          rm .github/workflows/v89_apply_review.yml .github/v89_apply_review.py
          git config user.name "XPS Tracker Updater Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v89_review_workflow.py .github/workflows/v89_apply_review.yml .github/v89_apply_review.py
          git commit -m "Apply v89 reviewed UI and validation safeguards"
          git push origin HEAD:v89-work

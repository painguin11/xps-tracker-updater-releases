name: Publish v89

on:
  push:
    branches:
      - v89-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V89' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v89 work branch
        uses: actions/checkout@v4
        with:
          ref: v89-work
          fetch-depth: 0

      - name: Install Tkinter runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install regression dependencies
        run: python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply final v89 parser safeguards and release version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('working_source/app/reno_scan_updater.py')
          src=app.read_text(encoding='utf-8')

          old='''def _authoritative_asset_candidates(observations,known_items):
    """Keep complete observed IDs whose prefix is already valid for this project."""
    prefixes={parts[0] for key in known_items if (parts:=_asset_id_parts(key))}
    out=[]
    for raw in observations:
        parts=_asset_id_parts(raw)
        if parts and parts[0] in prefixes:
            value=canonical_asset_id(''.join(parts))
            if value not in out: out.append(value)
    return out
'''
          new='''def _authoritative_asset_candidates(observations,known_items):
    """Keep complete observed IDs whose prefix is already valid for this project."""
    prefixes={parts[0] for key in known_items if (parts:=_asset_id_parts(key))}
    out=[]
    for raw in observations:
        parts=_asset_id_parts(raw)
        if not parts:
            continue
        prefix,number,suffix=parts
        # A left table rule can attach one narrow OCR glyph to an otherwise
        # complete printed endpoint (for example DN-1912 -> IDN-1912). Repair
        # only I/L plus a prefix that is already established by the master.
        if prefix not in prefixes and len(prefix)>1 and prefix[0] in ('I','L') and prefix[1:] in prefixes:
            prefix=prefix[1:]
        if prefix in prefixes:
            value=canonical_asset_id(f'{prefix}{number}{suffix}')
            if value not in out: out.append(value)
    return out
'''
          assert src.count(old)==1, 'authoritative asset candidate block not found exactly once'
          src=src.replace(old,new,1)

          old="""    if _new_pipe_base_item(up_observations,dn_observations,master_index):
        return None,'NEW PIPE'
    # Pair matching can tolerate more surrounding OCR junk because both endpoints
"""
          new="""    if _new_pipe_base_item(up_observations,dn_observations,master_index):
        return None,'NEW PIPE'
    # Complete project-valid IDs are authoritative evidence from the PDF. If both
    # endpoint cells contain them but they do not form an existing/new-suffix pair,
    # preserve the printed IDs for Add/Ignore review instead of silently fuzzy-
    # mapping them to a nearby master pipe.
    if up_full and dn_full:
        return None,'NOT MATCHED'
    # Pair matching can tolerate more surrounding OCR junk because both endpoints
"""
          assert src.count(old)==1, 'pipe-pair fuzzy guard insertion point not found exactly once'
          src=src.replace(old,new,1)

          old="    if kind=='pipes' and ('survey' in compact or ('length' in compact and 'scheduled' not in compact)): return 'value'"
          new="""    if kind=='pipes' and ('survey' in compact or 'survev' in compact or
                          (('length' in compact or 'leneth' in compact) and 'scheduled' not in compact)): return 'value'"""
          assert src.count(old)==1, 'pipe header role line not found exactly once'
          src=src.replace(old,new,1)

          src,n=re.subn(r"^APP_VERSION\s*=\s*['\"]88['\"]", "APP_VERSION = '89'", src, count=1, flags=re.M)
          assert n==1, 'APP_VERSION 88 marker not found exactly once'
          app.write_text(src,encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          usrc=updater.read_text(encoding='utf-8')
          usrc,n=re.subn(r'^CURRENT_VERSION\s*=\s*[\"\']88[\"\']', 'CURRENT_VERSION = "89"', usrc, count=1, flags=re.M)
          assert n==1, 'CURRENT_VERSION 88 marker not found exactly once'
          updater.write_text(usrc,encoding='utf-8')

          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          if '## v89' not in text:
              text += ('\n\n## v89\n\n'
                       '- Verifies Manhole work orders against the user-confirmed survey count shown in the Description of work performed crop.\n'
                       '- Uses only the final continuation page total for multi-page Pipe/Cleaning total verification.\n'
                       '- Adds Add to Master / Ignore / Back to Summary decisions for unresolved Pipe and Manhole rows at Update Master time.\n'
                       '- Limits automatic MSA combination to exactly two duplicate Pipe rows; three or more remain blocked for ID review.\n'
                       '- Adds PDF field previews to Trouble Ticket editing and preserves all existing continuation, exact-number, and partial-page safeguards.\n'
                       '- Preserves complete printed endpoint pairs that are absent from the master instead of fuzzy-mapping them to nearby assets.\n'
                       '- Recovers a narrow left-grid OCR artifact such as IDN-1912 back to the established DN prefix, and recognizes common OCR variants of Length Surveyed headers.\n')
              readme.write_text(text,encoding='utf-8')
          PY

      - name: Add regression for printed endpoint identity
        run: |
          cat > working_source/tests/regression_v89_printed_pair_identity.py <<'PY'
          from pathlib import Path
          import ast
          import re

          source_path=Path(__file__).resolve().parents[1] / 'app' / 'reno_scan_updater.py'
          source=source_path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          needed={
              'canonical_asset_id','asset_key','asset_number','_ocr_id_text_variants','_edit_distance',
              '_rank_asset_candidates','_asset_id_parts','_authoritative_asset_candidates',
              '_new_suffix_asset_candidates','_endpoint_base_options','_new_pipe_base_item',
              '_resolve_pipe_pair','_header_role'
          }
          nodes=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in needed]
          found={node.name for node in nodes}
          missing=needed-found
          assert not missing, f'missing source functions: {sorted(missing)}'
          module=ast.Module(body=nodes,type_ignores=[])
          ast.fix_missing_locations(module)
          ns={'re':re}
          exec(compile(module,str(source_path),'exec'),ns)

          pipe_a={'row':10,'up':'DN-797','down':'DN-1763','up_key':'DN797','down_key':'DN1763','pipe_id':'P-A','expected':40}
          pipe_b={'row':11,'up':'DN-1911','down':'DN-1912','up_key':'DN1911','down_key':'DN1912','pipe_id':'P-B','expected':296}
          master={
              'pipe_items':[pipe_a,pipe_b],
              'pipes':{('DN797','DN1763'):pipe_a,('DN1911','DN1912'):pipe_b},
              'manholes':{}
          }

          item,status=ns['_resolve_pipe_pair'](['DN-797'],['DN-1763'],master)
          assert item is pipe_a and status=='Matched', (item,status)

          # A complete, project-valid printed pair that is not in the master must
          # remain unresolved. It must never be silently changed to the nearby pair.
          item,status=ns['_resolve_pipe_pair'](['DN-777'],['DN-1762'],master)
          assert item is None and status=='NOT MATCHED', (item,status)

          known={'DN1911':'DN-1911','DN1912':'DN-1912'}
          repaired=ns['_authoritative_asset_candidates'](['IDN-1912'],known)
          assert repaired==['DN-1912'], repaired
          item,status=ns['_resolve_pipe_pair'](['DN-1911'],['IDN-1912'],master)
          assert item is pipe_b and status=='Matched', (item,status)

          assert ns['_header_role']('ilenethsurveved','pipes')=='value'
          assert ns['_header_role']('lengthsurveyed','pipes')=='value'
          print('v89 printed-pair identity, grid-prefix recovery, and header OCR regression passed.')
          PY

      - name: Compile and run release regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          for test in working_source/tests/regression_*.py; do
            name=$(basename "$test")
            case "$name" in
              regression_tall_cleaning_header.py|regression_workorder_preview.py|regression_v76_layout_skip.py|regression_v77_simple_first.py)
                echo "SKIP known stale/private fixture test: $name"
                ;;
              *)
                echo "RUN $name"
                python "$test"
                ;;
            esac
          done
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]89['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']89[\"\']',updater,re.M)
          for required in (
              "if up_full and dn_full:\n        return None,'NOT MATCHED'",
              "prefix[0] in ('I','L') and prefix[1:] in prefixes",
              "'survev' in compact",
              'def resolve_unmatched_for_update(',
              'def resolve_pipe_duplicate_groups(',
              'Expected Manholes:',
              'def _resolve_printed_total_sources(',
              'def _batch_pair_endpoint_candidates(',
              'def apply_manual_asset_edit(',
              'MAX_ROW_LENGTH = 1700.0',
              'MAX_ROW_LENGTH_DECIMALS = 2'):
              assert required in app, required
          print('v89 release parser-preservation and final safeguard checks passed.')
          PY
          git diff --check

      - name: Build and validate release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          cd dist
          zip -qr XPS_Tracker_Updater_v89.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v89.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v89.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names and all(n.startswith('XPS_Tracker_Updater/') for n in names)
              for required in ('XPS_Tracker_Updater/reno_scan_updater.py','XPS_Tracker_Updater/xps_update.py','XPS_Tracker_Updater/run_xps_tracker.bat'):
                  assert required in names, required
              forbidden=('.xlsx','.pdf','ocr_cache','8-24-2026','8-26-2026','8-19-2026','8-17-2026','8-11-2026')
              assert not any(any(token.lower() in n.lower() for token in forbidden) for n in names), 'customer/test data leaked into ZIP'
          print('v89 ZIP structure and privacy check passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v89.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v89.zip)" >> "$GITHUB_ENV"

      - name: Commit final v89 source and remove temporary release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-v89.yml .release-v89-trigger
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/tests/regression_v89_printed_pair_identity.py README.md
          git commit -m 'Release v89 [skip ci]'
          git push origin HEAD:v89-work

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v89 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v89 release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v89 dist/XPS_Tracker_Updater_v89.zip --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title 'XPS Tracker Updater v89' --notes 'v89 adds Manhole work-order count verification from the Description of work performed crop, uses only the final continuation-page total for multi-page Pipe/Cleaning verification, adds Add to Master / Ignore / Back to Summary decisions for unresolved assets, hardens duplicate-pipe MSA review, and adds PDF previews to Trouble Ticket editing. Final real-packet safeguards preserve complete printed endpoint pairs that are absent from the master instead of fuzzy-mapping them to nearby assets, recover a narrow left-grid OCR artifact such as IDN-1912, and recognize common OCR variants of Length Surveyed headers. Existing v88 continuation, partial-page, exact-number, and grid-recovery behavior is preserved.'
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v89'],text=True))
          asset=next((a for a in data.get('assets',[]) if a.get('name')=='XPS_Tracker_Updater_v89.zip'),None)
          assert asset, 'release ZIP missing'
          digest=str(asset.get('digest') or '')
          if digest:
              assert digest==f"sha256:{os.environ['RELEASE_SHA']}"
          assert int(asset.get('size') or 0)==int(os.environ['RELEASE_SIZE'])
          print('public v89 release asset verified')
          PY

      - name: Advance and re-verify public update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          data={
            'version':'89',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v89/XPS_Tracker_Updater_v89.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Verify Manhole work-order row counts against the user-confirmed count from the Description of work performed crop',
              'Use only the final continuation page printed total for multi-page Pipe/Cleaning verification',
              'Offer Add to Master, Ignore, or Back to Summary for unresolved Pipe and Manhole rows before any master write',
              'Limit automatic MSA combination to exactly two duplicate Pipe rows and block larger duplicate groups for ID review',
              'Show PDF field previews while editing Trouble Tickets',
              'Preserve complete printed endpoint pairs that are absent from the master instead of fuzzy-mapping them to nearby assets',
              'Recover narrow left-grid endpoint OCR artifacts and common Length Surveyed header OCR variants',
              'Preserve v88 continuation, partial-page, faint-grid, and exact PDF-number safeguards'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v89 update manifest'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/public_manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='89'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v89/XPS_Tracker_Updater_v89.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('committed public v89 manifest verified')
          PY

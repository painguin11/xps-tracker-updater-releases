name: Publish v93 from work branch

on:
  push:
    branches:
      - v93-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V93' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v93-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply v93 release version and documentation updates
        run: python working_source/tools/apply_v93_release.py

      - name: Compile and run active regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { if [ -f "$1" ]; then echo "===== $1 ====="; python "$1"; fi; }
          run_test working_source/tests/regression_v93_new_asset_notes.py
          run_test working_source/tests/regression_v93_workorder_low_confidence_blank.py
          run_test working_source/tests/regression_v92_workorder_4_or_5_digits.py
          run_test working_source/tests/regression_v91_workorder_color_ocr.py
          run_test working_source/tests/regression_v91_new_asset_preview_and_endpoint_recovery.py
          run_test working_source/tests/regression_v90_review_ui.py
          run_test working_source/tests/regression_v89_review_workflow.py
          run_test working_source/tests/regression_v89_printed_pair_identity.py
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v87_total_summary_separator.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py

      - name: Validate release source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]93['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']93[\"\']',updater,re.M)
          assert 'Version 93 low-confidence W/O and new-asset notes' in readme
          assert 'def _workorder_confident_magenta_candidate' in app
          assert "elif magenta_seen:\n        wo=''" in app
          assert app.count("append_note(ps.Cells(rr,notes_col),'NEW PIPE')")==2
          assert app.count("append_note(ms.Cells(rr,notes_col),'NEW MANHOLE')")==2
          assert "re.findall(r'(?<!\\d)\\d{4,5}(?!\\d)',text)" in app
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket','class NewAssetApprovalDialog','def _endpoint_digit_tokens'):
              assert required in app, required
          print('v93 version, low-confidence W/O, new-asset notes, and parser-preservation checks passed.')
          PY

      - name: Build release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cd dist
          zip -qr XPS_Tracker_Updater_v93.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v93.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v93.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names and all(n.startswith('XPS_Tracker_Updater/') for n in names)
              for required in ('XPS_Tracker_Updater/reno_scan_updater.py','XPS_Tracker_Updater/xps_update.py','XPS_Tracker_Updater/run_xps_tracker.bat','XPS_Tracker_Updater/README_XPS_Tracker_Updater.txt'):
                  assert required in names, required
              assert not any(n.lower().endswith(('.pdf','.xlsx','.xls','.xlsm')) for n in names)
              assert not any('__pycache__' in n or n.lower().endswith(('.pyc','.pyo')) for n in names)
          print('v93 ZIP structure/privacy check passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v93.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v93.zip)" >> "$GITHUB_ENV"

      - name: Commit v93 release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt working_source/tests/regression_v91_workorder_color_ocr.py working_source/tests/regression_v92_workorder_4_or_5_digits.py working_source/tests/regression_v93_workorder_low_confidence_blank.py working_source/tests/regression_v93_new_asset_notes.py
          git rm working_source/tools/apply_v93_release.py .github/workflows/publish-v93-from-work.yml .trigger_publish_v93
          git commit -m 'Release v93 [skip ci]'
          git push origin HEAD:v93-work

      - name: Publish and verify v93
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v93 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v93 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v93 dist/XPS_Tracker_Updater_v93.zip --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title 'XPS Tracker Updater v93' --notes 'v93 makes Work Order prefilling fail closed: if the machine-typed pink/magenta number is visibly too faded or OCR passes do not agree strongly enough, the confirmation field opens blank instead of showing a low-confidence guess. Clean 4- and 5-digit Work Orders still auto-fill. Approved new master rows are also labeled NEW PIPE or NEW MANHOLE in the Notes column, including Add to Master rows. All v92 and earlier parsing/matching safeguards are preserved.'
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']; expected=f"sha256:{os.environ['RELEASE_SHA']}"; asset=None
          for _ in range(8):
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v93'],text=True))
              asset=next((a for a in data.get('assets',[]) if a.get('name')=='XPS_Tracker_Updater_v93.zip'),None)
              assert asset, 'v93 release ZIP missing'
              if str(asset.get('digest') or '')==expected: break
              time.sleep(2)
          assert str(asset.get('digest') or '')==expected
          assert int(asset.get('size') or 0)==int(os.environ['RELEASE_SIZE'])
          print('public v93 release asset verified')
          PY

      - name: Advance public updater manifest to v93
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          old=json.loads(path.read_text(encoding='utf-8'))
          assert str(old.get('version'))=='92', f"Expected live v92 manifest, found {old.get('version')}"
          data={
            'version':'93',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v93/XPS_Tracker_Updater_v93.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Leave the Work Order confirmation field blank when pink/magenta W/O digits are too faded, incomplete, or inconsistent to trust',
              'Require strong isolated-color OCR agreement and visible digit structure before auto-filling a 4- or 5-digit Work Order',
              'Write NEW PIPE or NEW MANHOLE in the master Notes column for every approved new asset row, including Add to Master rows',
              'Preserve all v92 and earlier new-asset, endpoint-recovery, continuation, total-validation, and matching safeguards'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v93 update manifest'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/public_manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='93'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v93/XPS_Tracker_Updater_v93.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('public v93 updater manifest verified')
          PY

name: Validate v86 release package

on:
  push:
    branches: [v86-work]

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'VALIDATE_V86_RELEASE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v86-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract
      - name: Stage v86 version bump without committing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py')
          s=app.read_text(); s,n=re.subn(r"^APP_VERSION\s*=\s*['\"]85['\"]","APP_VERSION = '86'",s,count=1,flags=re.M); assert n==1; app.write_text(s)
          upd=Path('working_source/app/xps_update.py')
          s=upd.read_text(); s,n=re.subn(r'^CURRENT_VERSION\s*=\s*[\"\']85[\"\']','CURRENT_VERSION = "86"',s,count=1,flags=re.M); assert n==1; upd.write_text(s)
          PY
      - name: Run release regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          for t in \
            regression_v86_assets_and_edit.py \
            regression_v85_edit_row_previews.py \
            regression_v85_mandatory_rows_and_length_votes.py \
            regression_v84_real_packet_length_logic.py \
            regression_v83_length_recovery.py \
            regression_v83_exact_pdf_numbers.py \
            regression_v83_total_preview_group_errors.py \
            regression_v82_pair_video_lengths.py \
            regression_v82_master_asset_format.py \
            regression_v82_suffix_guard.py \
            regression_v82_cleaning_header_noise.py \
            regression_v82_layout_threshold.py \
            regression_v81_header_outline.py \
            regression_v80_ocr_total_ui.py \
            regression_v79_layout_speed.py \
            regression_v78_rollback.py \
            regression_compact_table_fallback.py \
            regression_length_totals.py \
            regression_split_pipes.py \
            regression_new_assets.py \
            regression_master_insert.py \
            regression_r2_endpoint_ocr.py \
            regression_trouble_tickets.py \
            regression_trouble_workbook.py; do
              [ ! -f "working_source/tests/$t" ] || python "working_source/tests/$t"
          done
      - name: Build and inspect v86 package
        run: |
          rm -rf dist && mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cd dist
          zip -qr XPS_Tracker_Updater_v86.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v86.zip
          python - <<'PY'
          import zipfile,re
          from pathlib import Path
          z=zipfile.ZipFile('XPS_Tracker_Updater_v86.zip'); names=z.namelist()
          assert all(n.startswith('XPS_Tracker_Updater/') for n in names)
          for required in ('XPS_Tracker_Updater/reno_scan_updater.py','XPS_Tracker_Updater/xps_update.py','XPS_Tracker_Updater/run_xps_tracker.bat'): assert required in names
          forbidden=('8-26-2026','MASTER_BACKUP','.xlsx','.pdf','ocr_cache')
          assert not any(any(x.lower() in n.lower() for x in forbidden) for n in names)
          app=z.read('XPS_Tracker_Updater/reno_scan_updater.py').decode(); upd=z.read('XPS_Tracker_Updater/xps_update.py').decode()
          assert re.search(r"^APP_VERSION\s*=\s*['\"]86['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']86[\"\']',upd,re.M)
          print('v86 dry-run package passed')
          PY
          sha256sum XPS_Tracker_Updater_v86.zip

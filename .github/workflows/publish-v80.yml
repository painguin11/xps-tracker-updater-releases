name: Publish XPS Tracker Updater v80

on:
  push:
    branches:
      - v80-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V80' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated v80 source
        uses: actions/checkout@v4
        with:
          ref: v80-work
          fetch-depth: 0

      - name: Finalize v80 versions and README
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          updater=Path('working_source/app/xps_update.py')
          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          a=app.read_text(encoding='utf-8')
          u=updater.read_text(encoding='utf-8')
          a,n=re.subn(r"APP_VERSION = ['\"]\d+['\"]", "APP_VERSION = '80'", a, count=1)
          if n!=1: raise SystemExit('APP_VERSION replacement failed')
          u,n=re.subn(r"CURRENT_VERSION = ['\"]\d+['\"]", 'CURRENT_VERSION = "80"', u, count=1)
          if n!=1: raise SystemExit('CURRENT_VERSION replacement failed')
          app.write_text(a,encoding='utf-8')
          updater.write_text(u,encoding='utf-8')
          r=readme.read_text(encoding='utf-8')
          title='Version 80 conservative B&C cleaning OCR and review'
          if title not in r:
              r += "\n\nVersion 80 conservative B&C cleaning OCR and review\n----------------------------------------------------\n- Reads the aligned Wheel Walk column with the least-destructive OCR path first.\n- Runs targeted conservative rereads only after the work-order printed total fails.\n- Uses the master only to identify suspicious rows; the master never supplies replacement OCR values.\n- Preserves right-edge digits that touch table rules and uses a fresh v6 OCR cache.\n- Reads printed totals from the clean full cell first, then uses gridless fallback only when needed.\n- Rejects implausible OCR years and uses the confirmed work-order date as a safe packet anchor.\n- Shows a total mismatch once at the work-order group level while individual large length differences remain highlighted.\n- Writes MSA to the master Notes cell when a split pipe is detected and combined.\n"
              readme.write_text(r,encoding='utf-8')
          PY

      - name: Compile and run release regressions
        run: |
          python -m pip install --disable-pip-version-check -q numpy opencv-python-headless
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py
          python working_source/tests/regression_v78_rollback.py
          python working_source/tests/regression_v75_811_ocr.py
          python working_source/tests/regression_v74_row_filtering.py
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '80'" in app
          assert 'CURRENT_VERSION = "80"' in updater
          assert "OCR_CACHE_VERSION = 'v6'" in app
          assert "append_note(ps.Cells(rr,notes_col),'MSA')" in app
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          print('v80 release validation passed.')
          PY

      - name: Commit finalized v80 source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize v80 versions and README [skip ci]'
            git push origin HEAD:v80-work
          fi

      - name: Package app and source bundle
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -name '*.pyc' -delete
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip" XPS_Tracker_Updater)
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          rm -rf "$RUNNER_TEMP/source_v80"
          mkdir -p "$RUNNER_TEMP/source_v80/XPS_Tracker_Updater_Source_v80"
          cp -a working_source/. "$RUNNER_TEMP/source_v80/XPS_Tracker_Updater_Source_v80/"
          find "$RUNNER_TEMP/source_v80" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/source_v80" -name '*.pyc' -delete
          (cd "$RUNNER_TEMP/source_v80" && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v80.zip" XPS_Tracker_Updater_Source_v80)
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip" | tee "$RUNNER_TEMP/v80.sha256"

      - name: Create draft release and upload ZIP
        run: |
          existing="$(gh api -H 'Accept: application/vnd.github+json' repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="v80") | .id' | head -1)"
          if [ -n "$existing" ]; then
            release_id="$existing"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=true -f name='XPS Tracker Updater v80' >/dev/null
          else
            release_id="$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name='v80' -f target_commitish='v80-work' -f name='XPS Tracker Updater v80' -f body='v80 refactors B&C cleaning OCR to use a conservative first pass, validate against the printed work-order total, and reread only suspicious rows when needed. It also improves total/date handling, group-level total review, and writes MSA to master Notes for split pipes.' -F draft=true --jq .id)"
          fi
          existing_asset="$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq '.assets[]? | select(.name=="XPS_Tracker_Updater_v80.zip") | .id' | head -1)"
          if [ -n "$existing_asset" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$existing_asset" >/dev/null; fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/XPS_Tracker_Updater_v80.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=XPS_Tracker_Updater_v80.zip" >/dev/null
          echo "$release_id" > "$RUNNER_TEMP/release_id"

      - name: Verify checksum and publish release
        run: |
          release_id="$(cat "$RUNNER_TEMP/release_id")"
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v80.sha256")"
          ok=0
          for i in 1 2 3 4 5 6; do
            release_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
            asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v80.zip") | .size')"
            asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v80.zip") | .digest')"
            if [ "${asset_size:-0}" -gt 0 ] && [ "$asset_digest" = "sha256:$local_sha" ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=false >/dev/null
          final_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
          final_url="$(printf '%s' "$final_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v80.zip") | .browser_download_url')"
          test "$final_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v80/XPS_Tracker_Updater_v80.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$final_url" > "$RUNNER_TEMP/verified_url"

      - name: Check out main for manifest/source update
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Commit source bundle, context, and verified manifest
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v80.zip" ./XPS_Tracker_Updater_Source_v80.zip
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'80',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Use conservative aligned-column OCR first for B&C cleaning lengths and stop immediately when the printed total reconciles',
              'Reread only suspicious cleaning rows after a total mismatch, requiring repeated OCR support rather than arithmetic guessing',
              'Preserve right-edge digits and use safer printed-total/date handling with a fresh v6 OCR cache',
              'Show total mismatch at the work-order group level while keeping individual large length differences highlighted',
              'Write MSA to the master Notes cell for detected split-pipe surveys'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          context=Path('PROJECT_CONTEXT.md')
          if context.exists():
              text=context.read_text(encoding='utf-8')
              text=re.sub(r'Current production version: \*\*v\d+\*\*\.', 'Current production version: **v80**.', text, count=1)
              if '## Current v80 fixes' not in text:
                  marker='## Current v69 fixes'
                  section="## Current v80 fixes\n\n- B&C cleaning uses conservative aligned-column OCR first and escalates only after printed-total validation fails.\n- Targeted rereads inspect suspicious rows only and require repeated OCR evidence; the master never supplies a replacement value.\n- Printed totals and dates use safer fallback/consensus rules; OCR cache namespace is v6.\n- Total mismatches are shown once at the work-order group level while row-specific length differences remain highlighted.\n- Split-pipe/MSA updates append `MSA` to the master Notes cell.\n\n"
                  if marker in text: text=text.replace(marker,section+marker,1)
                  else: text += '\n\n'+section
              context.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v80.zip update_manifest.json PROJECT_CONTEXT.md
          git commit -m 'Publish v80 source bundle and update manifest'
          git push origin HEAD:main
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="80"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          test -s XPS_Tracker_Updater_Source_v80.zip
          echo 'v80 release, source bundle, context, and manifest verified.'

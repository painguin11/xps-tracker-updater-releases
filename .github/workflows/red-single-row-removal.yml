name: RED single-row removal

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_red_single_row_removal'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
      - name: Confirm regression fails before implementation
        run: |
          set +e
          python working_source/tests/regression_post_v105_single_row_removal.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected RED failure observed"

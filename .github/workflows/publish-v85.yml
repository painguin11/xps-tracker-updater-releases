name: Publish v85

on:
  push:
    branches:
      - v85-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V85' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v85 work branch
        uses: actions/checkout@v4
        with:
          ref: v85-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Bump release versions and README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('working_source/app/reno_scan_updater.py')
          src=app.read_text(encoding='utf-8')
          src,n=re.subn(r"^APP_VERSION\s*=\s*['\"]84['\"]", "APP_VERSION = '85'", src, count=1, flags=re.M)
          assert n==1, 'APP_VERSION 84 marker not found exactly once'
          app.write_text(src,encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          src=updater.read_text(encoding='utf-8')
          src,n=re.subn(r'^CURRENT_VERSION\s*=\s*[\"\']84[\"\']', 'CURRENT_VERSION = "85"', src, count=1, flags=re.M)
          assert n==1, 'CURRENT_VERSION 84 marker not found exactly once'
          updater.write_text(src,encoding='utf-8')

          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          if '## v85' not in text:
              text += ('\n\n## v85\n\n'
                       '- Keeps every confirmed physical table row between the detected header and total, even when endpoint/date OCR needs review.\n'
                       '- Improves failed-total OCR recovery, including subtle decimal/grid-line misreads, without rounding or manufacturing PDF values.\n'
                       '- Keeps duplicate-looking Cleaning rows visible for total validation while preventing duplicate master writes.\n'
                       '- Adds PDF image previews beside every editable extracted-row field, with a PDF page fallback when a crop is unavailable.\n')
              readme.write_text(text,encoding='utf-8')
          PY

      - name: Compile and run release regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          run_test() { if [ -f "$1" ]; then python "$1"; fi; }
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py
          run_test working_source/tests/regression_trouble_tickets.py
          run_test working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]85['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']85[\"\']',updater,re.M)
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          for required in (
              "mandatory_data_bands=set(range(int(header_band_index)+1,int(total_band_index)))",
              "rec.setdefault('validation_warnings',[]).append('DUPLICATE IN PDF')",
              'def _select_independent_length_candidate(',
              "'activity_value':value_cell.copy()",
              "dlg.result['_field_previews']",
              "Preview unavailable — check PDF page ",
              'MAX_ROW_LENGTH = 1700.0',
              'MAX_ROW_LENGTH_DECIMALS = 2'):
              assert required in app, required
          print('v85 version, parser-preservation, row-retention, and edit-preview checks passed.')
          PY

      - name: Build and validate release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          cd dist
          zip -qr XPS_Tracker_Updater_v85.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v85.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v85.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names, 'empty ZIP'
              assert all(n.startswith('XPS_Tracker_Updater/') for n in names), 'unexpected top-level ZIP entry'
              for required in ('XPS_Tracker_Updater/reno_scan_updater.py','XPS_Tracker_Updater/xps_update.py','XPS_Tracker_Updater/run_xps_tracker.bat'):
                  assert required in names, required
              forbidden=('8-26-2026','MASTER_BACKUP','.xlsx','.pdf','ocr_cache')
              assert not any(any(token.lower() in n.lower() for token in forbidden) for n in names), 'customer/test data leaked into ZIP'
          print('v85 ZIP structure and privacy check passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v85.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v85.zip)" >> "$GITHUB_ENV"

      - name: Commit v85 version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py README.md
          git commit -m 'Release v85 [skip ci]'
          git push origin HEAD:v85-work

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v85 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v85 release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v85 dist/XPS_Tracker_Updater_v85.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title 'XPS Tracker Updater v85' \
            --notes 'v85 fixes the missing-row failure behind total-length mismatches: once the table header and printed total are structurally confirmed, every physical row between them remains in the summary/total arithmetic even when endpoint or date OCR needs review. Duplicate-looking Cleaning rows are retained for validation but protected from duplicate master writes. Failed totals use the master only to prioritize/filter OCR-observed alternatives, including decimal/grid-line errors such as 77.4 being read as 774. The Edit Selected dialog now shows the exact available PDF crop beside Activity Value, Date, W/O, Truck, and Operator; if a crop is unavailable it directs the user to the correct PDF page. Existing 1700-ft and two-decimal safeguards remain in force without rounding PDF measurements.'
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v85'],text=True))
          asset=next((a for a in data.get('assets',[]) if a.get('name')=='XPS_Tracker_Updater_v85.zip'),None)
          assert asset, 'release ZIP missing'
          digest=str(asset.get('digest') or '')
          assert digest==f"sha256:{os.environ['RELEASE_SHA']}", (digest,os.environ['RELEASE_SHA'])
          assert int(asset.get('size') or 0)==int(os.environ['RELEASE_SIZE']), (asset.get('size'),os.environ['RELEASE_SIZE'])
          print('public release asset name, size, and SHA-256 verified')
          PY

      - name: Advance and re-verify public update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          data={
            'version':'85',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v85/XPS_Tracker_Updater_v85.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Keep every confirmed physical table row in Live Summary and total-length arithmetic even when endpoint/date OCR needs review',
              'Retain duplicate-looking Cleaning rows for validation while preventing duplicate master writes',
              'Improve independent failed-total OCR selection for decimal and grid-line misreads without manufacturing PDF values',
              'Show PDF image previews beside Activity Value, Date, W/O, Truck, and Operator in Edit Selected',
              'When an edit-field crop is unavailable, direct the user to the exact PDF page for manual verification'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v85 update manifest'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/public_manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='85'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v85/XPS_Tracker_Updater_v85.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('committed public manifest version, URL, and checksum verified')
          PY

name: Publish v83

on:
  push:
    branches:
      - v83-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V83' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v83 work branch
        uses: actions/checkout@v4
        with:
          ref: v83-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: python -m pip install --quiet numpy opencv-python-headless

      - name: Bump release versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('working_source/app/reno_scan_updater.py')
          src=app.read_text(encoding='utf-8')
          src,n=re.subn(r"^APP_VERSION\s*=\s*['\"]82['\"]", "APP_VERSION = '83'", src, count=1, flags=re.M)
          assert n==1, 'APP_VERSION 82 marker not found exactly once'
          app.write_text(src,encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          src=updater.read_text(encoding='utf-8')
          src,n=re.subn(r'^CURRENT_VERSION\s*=\s*[\"\']82[\"\']', 'CURRENT_VERSION = "83"', src, count=1, flags=re.M)
          assert n==1, 'CURRENT_VERSION 82 marker not found exactly once'
          updater.write_text(src,encoding='utf-8')
          PY

      - name: Compile and run applicable regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          python working_source/tests/regression_v83_length_recovery.py
          python working_source/tests/regression_v83_exact_pdf_numbers.py
          python working_source/tests/regression_v83_total_preview_group_errors.py
          python working_source/tests/regression_v82_pair_video_lengths.py
          python working_source/tests/regression_v82_master_asset_format.py
          python working_source/tests/regression_v82_suffix_guard.py
          python working_source/tests/regression_v82_cleaning_header_noise.py
          python working_source/tests/regression_v82_layout_threshold.py
          python working_source/tests/regression_v81_header_outline.py
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]83['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']83[\"\']',updater,re.M)
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          print('v83 version and parser-preservation checks passed.')
          PY

      - name: Build and validate release ZIP
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          cd dist
          zip -qr XPS_Tracker_Updater_v83.zip XPS_Tracker_Updater
          unzip -t XPS_Tracker_Updater_v83.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path('XPS_Tracker_Updater_v83.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert names, 'empty ZIP'
              assert all(n.startswith('XPS_Tracker_Updater/') for n in names), 'unexpected top-level ZIP entry'
              for required in ('XPS_Tracker_Updater/reno_scan_updater.py','XPS_Tracker_Updater/xps_update.py','XPS_Tracker_Updater/run_xps_tracker.bat'):
                  assert required in names, required
          print('v83 ZIP structure passed.')
          PY
          echo "RELEASE_SHA=$(sha256sum XPS_Tracker_Updater_v83.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RELEASE_SIZE=$(stat -c%s XPS_Tracker_Updater_v83.zip)" >> "$GITHUB_ENV"

      - name: Commit v83 version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          git commit -m 'Release v83 [skip ci]'
          git push origin HEAD:v83-work

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v83 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v83 release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create v83 dist/XPS_Tracker_Updater_v83.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title 'XPS Tracker Updater v83' \
            --notes 'v83 strengthens Pipe and Cleaning length validation and recovery: impossible row lengths over 1700 ft and OCR values with more than two decimal places are rejected, failed work-order totals trigger targeted rereads followed by an independent all-row cross-check, and valid batch Cleaning reads are protected from weaker isolated OCR conflicts. It also includes the previously staged v82 OCR, suffix-corroboration, layout-confidence, asset-format, and cleaning-header improvements.'
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v83'],text=True))
          assets=data.get('assets',[])
          asset=next((a for a in assets if a.get('name')=='XPS_Tracker_Updater_v83.zip'),None)
          assert asset, 'release ZIP missing'
          digest=str(asset.get('digest') or '')
          assert digest==f"sha256:{os.environ['RELEASE_SHA']}", (digest,os.environ['RELEASE_SHA'])
          assert int(asset.get('size') or 0)==int(os.environ['RELEASE_SIZE']), (asset.get('size'),os.environ['RELEASE_SIZE'])
          print('public release asset name, size, and SHA-256 verified')
          PY

      - name: Advance and re-verify public update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          rm -rf /tmp/xps-main
          git worktree add --detach /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path('/tmp/xps-main/update_manifest.json')
          data={
            'version':'83',
            'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v83/XPS_Tracker_Updater_v83.zip',
            'sha256':os.environ['RELEASE_SHA'],
            'release_notes':[
              'Reject individual Pipe and Cleaning OCR lengths above 1700 ft or with more than two decimal places',
              'When a work-order total fails, reread suspicious rows first and then independently cross-check all activity lengths before requesting manual review',
              'Preserve valid aligned-column Cleaning values when weaker isolated-cell OCR disagrees during the all-row audit',
              'Include the staged v82 pipe-length OCR, one-letter suffix corroboration, cleaning-header filtering, master-derived asset syntax, and above-80% layout auto-confirmation improvements'
            ]
          }
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          cd /tmp/xps-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git commit -m 'Publish v83 update manifest'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/public_manifest.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/public_manifest.json',encoding='utf-8'))
          assert data['version']=='83'
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v83/XPS_Tracker_Updater_v83.zip'
          assert data['sha256']==os.environ['RELEASE_SHA']
          print('committed public manifest version, URL, and checksum verified')
          PY

name: Apply v89 work

on:
  push:
    branches:
      - v89-work

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.event.head_commit.message == 'APPLY_V89_WORK' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v89 work branch
        uses: actions/checkout@v4
        with:
          ref: v89-work
          fetch-depth: 0

      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply v89 source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, subprocess
          payload=Path('.github/tmp/v89_patch.zlib.b64').read_text(encoding='utf-8').strip()
          patch=zlib.decompress(base64.b64decode(payload))
          Path('/tmp/v89.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v89.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v89.patch'],check=True)
          PY
          python - <<'PY'
          from pathlib import Path
          path=Path('working_source/tests/regression_v83_exact_pdf_numbers.py')
          src=path.read_text(encoding='utf-8')
          old="assert 'def cut(box,right_bleed=False,vertical_bleed=0):' in src"
          new="assert ('def cut(box,right_bleed=False,vertical_bleed=0):' in src or\n        'def cut(box,right_bleed=False,vertical_bleed=0,horizontal_bleed=0):' in src)"
          assert src.count(old)==1, src.count(old)
          path.write_text(src.replace(old,new,1),encoding='utf-8')
          PY
          cat > working_source/tests/regression_v89_manhole_count_and_final_total.py <<'PY'
          from pathlib import Path

          src=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')

          for required in (
              'def ocr_workorder_guesses(page, master_index=None, expect_manhole_count=False):',
              "description_preview=crop(.035,.425,.72,.700)",
              "'expect_manhole_count':bool(expect_manhole_count)",
              "ttk.Label(self,text='Expected Manholes:')",
              "'expected_manhole_count':expected_manhole_count",
              "item['expects_manhole_count']=any(",
              "item['guesses']=ocr_workorder_guesses(item['page'],idx,item.get('expects_manhole_count',False))",
              'manhole_rows_by_wo={}',
              "manhole_rows_by_wo[wo_key]=manhole_rows_by_wo.get(wo_key,0)+int(report.get('rows') or 0)",
              'def show_manhole_count_summary(self,check):',
              'MANHOLE COUNT MISMATCH — EXPECTED',
              "manhole_count_failures=[check for check in self.manhole_count_validations if not check.get('passed')]",
              'Continue with only the readable rows?',
              'source=sources[-1]',
              "mode='final page printed work-order total'",
              "'sources':([selected_source] if selected_source else [])",
              'def cut(box,right_bleed=False,vertical_bleed=0,horizontal_bleed=0):',
              'cell=cut(box,horizontal_bleed=2); obs=_ocr_asset_candidates(cell,fast_plain=fast,asset_format=asset_format)',
          ):
              assert required in src, required

          assert "mode='sum of printed page totals'" not in src
          assert "mode='partial printed page totals'" not in src
          print('v89 Manhole count, final-page total, and tight endpoint-crop safeguards passed.')
          PY

      - name: Compile and run regressions
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert re.search(r"^APP_VERSION\s*=\s*['\"]88['\"]",app,re.M)
          assert re.search(r'^CURRENT_VERSION\s*=\s*[\"\']88[\"\']',updater,re.M)
          print('v89 work branch correctly remains version 88 until publication.')
          PY
          run_test() { if [ -f "$1" ]; then python "$1"; fi; }
          run_test working_source/tests/regression_v89_manhole_count_and_final_total.py
          run_test working_source/tests/regression_v88_continuations.py
          run_test working_source/tests/regression_v86_assets_and_edit.py
          run_test working_source/tests/regression_v85_edit_row_previews.py
          run_test working_source/tests/regression_v85_mandatory_rows_and_length_votes.py
          run_test working_source/tests/regression_v84_real_packet_length_logic.py
          run_test working_source/tests/regression_v83_length_recovery.py
          run_test working_source/tests/regression_v83_exact_pdf_numbers.py
          run_test working_source/tests/regression_v83_total_preview_group_errors.py
          run_test working_source/tests/regression_v82_pair_video_lengths.py
          run_test working_source/tests/regression_v82_master_asset_format.py
          run_test working_source/tests/regression_v82_suffix_guard.py
          run_test working_source/tests/regression_v82_cleaning_header_noise.py
          run_test working_source/tests/regression_v82_layout_threshold.py
          run_test working_source/tests/regression_v81_header_outline.py
          run_test working_source/tests/regression_v80_ocr_total_ui.py
          run_test working_source/tests/regression_v79_layout_speed.py
          run_test working_source/tests/regression_v78_rollback.py
          run_test working_source/tests/regression_v75_811_ocr.py
          run_test working_source/tests/regression_v74_row_filtering.py
          run_test working_source/tests/regression_v73_total_dates.py
          run_test working_source/tests/regression_compact_table_fallback.py
          run_test working_source/tests/regression_length_totals.py
          run_test working_source/tests/regression_split_pipes.py
          run_test working_source/tests/regression_new_assets.py
          run_test working_source/tests/regression_master_insert.py
          run_test working_source/tests/regression_r2_endpoint_ocr.py
          run_test working_source/tests/regression_trouble_tickets.py
          run_test working_source/tests/regression_trouble_workbook.py

      - name: Commit tested v89 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py \
                  working_source/tests/regression_length_totals.py \
                  working_source/tests/regression_v83_total_preview_group_errors.py \
                  working_source/tests/regression_v83_exact_pdf_numbers.py \
                  working_source/tests/regression_v89_manhole_count_and_final_total.py
          git diff --cached --quiet && { echo 'No v89 changes produced'; exit 1; }
          git commit -m 'Add manhole count validation, final-page totals, and tight endpoint OCR [skip ci]'
          git push origin HEAD:v89-work

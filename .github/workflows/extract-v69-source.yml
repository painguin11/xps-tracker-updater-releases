name: Extract v69 source

on:
  push:
    branches:
      - v70-work

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v70-work
      - name: Extract current production source
        run: |
          rm -rf working_source
          mkdir -p working_source
          unzip -q XPS_Tracker_Updater_Source_v69.zip -d working_source
      - name: Commit extracted working source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract v69 working source [skip ci]"
          git push origin HEAD:v70-work

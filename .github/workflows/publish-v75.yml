name: Publish XPS Tracker Updater v75

on:
  push:
    branches:
      - v75-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V75' }}
    runs-on: ubuntu-latest
    steps:
      - name: Original v75 publisher superseded by recovery workflow
        run: echo 'The initial v75 publisher already built, tested, packaged, and staged the release. Recovery completes publication separately.'

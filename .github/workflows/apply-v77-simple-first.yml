name: Apply v83 length recovery

on:
  push:
    branches:
      - v83-work

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'Run v83 NumPy fix validation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83-work
          fetch-depth: 0
      - name: Install regression dependencies
        run: python -m pip install --quiet numpy opencv-python-headless
      - name: Fix cleaning cell selection
        run: python .github/scripts/fix_v83_numpy_length_cell.py
      - name: Compile and run current regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          python working_source/tests/regression_v83_length_recovery.py
          python working_source/tests/regression_v83_exact_pdf_numbers.py
          python working_source/tests/regression_v83_total_preview_group_errors.py
          python working_source/tests/regression_v82_pair_video_lengths.py
          python working_source/tests/regression_v82_master_asset_format.py
          python working_source/tests/regression_v82_suffix_guard.py
          python working_source/tests/regression_v82_cleaning_header_noise.py
          python working_source/tests/regression_v82_layout_threshold.py
          python working_source/tests/regression_v81_header_outline.py
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v83_length_recovery.py
          git commit -m 'Fix cleaning mismatch image selection [skip ci]'
          git push origin HEAD:v83-work

name: Red post-v105 physical row retention
on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_red_post_v105_physical_row_retention'
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
      - name: Install regression dependency
        run: python -m pip install --quiet numpy
      - name: Confirm current source fails physical-row invariant
        run: python working_source/tests/regression_post_v105_physical_rows_never_discarded.py

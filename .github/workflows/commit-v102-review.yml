name: Commit validated v102 review controls

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v102_commit'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract
      - name: Apply and validate
        run: |
          python .github/scripts/patch_v102_review.py
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          python .github/scripts/run_active_v102_tests.py
          git diff --check
      - name: Commit source
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add work-order discard review controls
          file_pattern: working_source/app/reno_scan_updater.py working_source/tests/regression_v102_discard_work_orders.py

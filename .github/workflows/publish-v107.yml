name: Cleanup XPS Tracker Updater v107 publish

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_publish_v107'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0
      - name: Clean temporary v107 release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 35879411999 --repo painguin11/xps-tracker-updater-releases || true
          git push origin --delete release-v107-source || true

name: Sync v103 release documentation

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_v103_docs_sync'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Verify published v103 metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          expected={
              'tag':'v103',
              'name':'XPS Tracker Updater v103',
              'commit':'97254c534e2d6beb92fcce81bf00a9ed66db071d',
              'asset':'XPS_Tracker_Updater_v103.zip',
              'size':318805,
              'sha':'sha256:0235204171d6ff172eb6f8cb56ace5480e2056efaa6798817222fcb3d59e02a7',
          }
          raw=subprocess.check_output(['gh','api','repos/painguin11/xps-tracker-updater-releases/releases/tags/v103'],text=True)
          data=json.loads(raw)
          assert data['tag_name']==expected['tag'],data
          assert data['name']==expected['name'],data
          assert data['target_commitish']==expected['commit'],data
          assets=[a for a in data['assets'] if a['name']==expected['asset']]
          assert len(assets)==1,assets
          asset=assets[0]
          assert asset['size']==expected['size'],asset
          assert asset['digest']==expected['sha'],asset
          print('Verified v103 release metadata.')
          PY
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['git','show','origin/main:update_manifest.json'],text=True))
          assert data['version']=='103',data
          assert data['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v103/XPS_Tracker_Updater_v103.zip',data
          assert data['sha256']=='0235204171d6ff172eb6f8cb56ace5480e2056efaa6798817222fcb3d59e02a7',data
          print('Verified v103 production manifest before documentation sync.')
          PY

      - name: Update authoritative development docs and clean temporary release files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          release_sha='97254c534e2d6beb92fcce81bf00a9ed66db071d'
          asset='XPS_Tracker_Updater_v103.zip'
          size='318805'
          sha='0235204171d6ff172eb6f8cb56ace5480e2056efaa6798817222fcb3d59e02a7'
          url='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v103/XPS_Tracker_Updater_v103.zip'

          # AGENTS.md
          p=Path('AGENTS.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('- Production version: **v102**.', '- Production version: **v103**.', 1)
          s=s.replace('Preserve all documented behavior through v102 unless the user explicitly asks',
                      'Preserve all documented behavior through v103 unless the user explicitly asks', 1)
          p.write_text(s,encoding='utf-8')

          # PROJECT_CONTEXT.md
          p=Path('PROJECT_CONTEXT.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('Current production version: **v102**.', 'Current production version: **v103**.', 1)
          s=s.replace('preserve the full released v102 baseline and its documented safeguards.',
                      'preserve the full released v103 baseline and its documented safeguards.', 1)
          s=s.replace('## State audit — September 11, 2026', '## State audit — September 14, 2026', 1)
          audit_start=s.find('## State audit — September 14, 2026')
          released_v102=s.find('## Released in v102 — selective work-order review controls')
          if audit_start < 0 or released_v102 < 0 or released_v102 <= audit_start:
              raise SystemExit('PROJECT_CONTEXT audit/release markers not found')
          new_audit=f'''## State audit — September 14, 2026\n\n- Current production release: **v103** at release source commit `{release_sha}`.\n- `working_source/app/reno_scan_updater.py` and `working_source/app/xps_update.py` are both version 103.\n- The production updater reads `main/update_manifest.json`, which points to the verified v103 public asset and SHA-256 below.\n- The v103 Linux release job compiled the app, passed the full 52/52 active regression matrix, audited release scope, tested ZIP integrity, re-downloaded the public asset, verified exact size/SHA-256, and only then advanced the manifest.\n- Private customer fixture OCR and Windows Excel COM/live Tkinter paths were not rerun by the Linux release job; prior recorded private-fixture results remain historical validation.\n- Temporary v103 publishing/documentation machinery is removed after this sync.\n\n## Released in v103 — Manhole OCR count recovery\n\nPublic v103 release:\n\n- Tag: `v103`\n- Release title: `XPS Tracker Updater v103`\n- Release commit: `{release_sha}`\n- Asset: `{asset}`\n- Asset size: `{size}` bytes\n- SHA-256: `{sha}`\n- Public updater manifest on `main` points to `{url}` and was advanced only after the public release asset was downloaded back and its size/SHA-256 matched exactly.\n- Full active Linux CI suite: **52/52 regression scripts passed** on the v103-versioned source. Private customer fixture OCR and Windows Excel COM/live Tk GUI paths were not run by this Linux release job.\n\nv103 adds two conservative Manhole recovery paths while preserving the v102 review controls and all earlier safeguards:\n\n1. **Physical ruled-row recovery for partial B&C Manhole OCR**\n   - The B&C Manhole parser compares positioned whole-page token results with the physical ruled-row parser instead of trusting a short token result.\n   - A narrow padded/trimmed retry can recover a clipped first asset ID without loosening global asset-ID rules.\n   - Permanent regression: `working_source/tests/regression_post_v102_manhole_partial_tokens.py`.\n2. **Expected-count-driven OCR retry**\n   - After the normal Manhole pass, a parsed count that differs from the user-confirmed expected count automatically rereads every Manhole page in that work order with slower alternate row, crop, padding, and OCR segmentation passes.\n   - Recovered IDs must be observed in the PDF and still pass the existing strict matching/new-suffix safeguards.\n   - The expected count never fabricates IDs, deletes a first-pass row, or chooses an arbitrary subset merely to force a match. If a safe recovery would overrun the confirmed count, automatic addition is skipped and review remains required.\n   - Permanent regression: `working_source/tests/regression_post_v102_manhole_expected_count_retry.py`.\n\n'''
          s=s[:audit_start]+new_audit+s[released_v102:]
          s=s.replace('preserve all behavior through v101,', 'preserve all behavior through v103,')
          p.write_text(s,encoding='utf-8')

          # RELEASE_CHECKLIST.md
          p=Path('RELEASE_CHECKLIST.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('current **v102 production baseline**', 'current **v103 production baseline**', 1)
          marker='## Current verified production reference\n\nv102 is the current production release:'
          block=f'''## Current verified production reference\n\nv103 is the current production release:\n\n- Release commit: `{release_sha}`\n- Asset: `{asset}`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n- Public manifest version/URL/SHA were re-read and verified after release asset re-download.\n- 52/52 active Linux regression scripts passed on the versioned release source. Private fixture OCR and Windows Excel COM/live Tk GUI checks remain platform/fixture limitations rather than release-job coverage.\n\nPrevious verified production reference follows for history.\n\nv102 was the previous production release:'''
          if marker not in s:
              raise SystemExit('RELEASE_CHECKLIST v102 current production marker not found')
          s=s.replace(marker,block,1)
          p.write_text(s,encoding='utf-8')

          # README.md
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          start=s.find('## Current production release: v102')
          end=s.find('\n## v85',start)
          if start < 0 or end < 0:
              raise SystemExit('README current production block markers not found')
          current=f'''## Current production release: v103\n\n- Release: [XPS Tracker Updater v103](https://github.com/painguin11/xps-tracker-updater-releases/releases/tag/v103)\n- Release commit: `{release_sha}`\n- Asset: `{asset}`\n- Size: `{size}` bytes\n- SHA-256: `{sha}`\n\nThe production updater reads `update_manifest.json` on `main`, which points to\nthis verified v103 asset. Development remains on `v95-work`, under `working_source/`.\nOld source bundles and release notes are historical; fetch the latest development\nhead and read its project instructions before editing.\n\nv103 improves Manhole OCR recovery for partially read ruled B&C tables and\nautomatically performs a slower Manhole-only reread when the parsed row count does\nnot match the user-confirmed expected count. Count-driven recovery remains grounded\nin PDF-observed IDs and never fabricates or trims rows just to force the count.\n'''
          s=s[:start]+current+s[end:]
          section=f'''\n## v103\n\n- Compares positioned-token B&C Manhole OCR with physical ruled-row parsing so clipped or partially read reports can recover missing rows.\n- Automatically performs slower Manhole OCR rereads when the first-pass count differs from the user-confirmed expected Manhole count.\n- Keeps recovery conservative: only PDF-observed IDs that pass existing matching/new-suffix safeguards may be added; rows are never fabricated, deleted, or arbitrarily selected to force the count.\n- Preserves all v102 review controls plus earlier Pipe, Cleaning, Manhole, Trouble Ticket, MSA, continuation, total, and master-write safeguards.\n- Passed all **52 active Linux regression scripts** before publishing; the public ZIP size/SHA-256 were verified after re-download before the auto-update manifest advanced.\n'''
          if '\n## v103\n' not in s:
              pos=s.find('\n## Development baseline\n')
              if pos < 0: raise SystemExit('README development baseline marker not found')
              s=s[:pos]+section+s[pos:]
          p.write_text(s,encoding='utf-8')

          docs=Path('working_source/docs')
          for name in ('AGENTS.md','PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md'):
              (docs/name).write_text(Path(name).read_text(encoding='utf-8'),encoding='utf-8')
          PY

          git diff --check
          grep -q "APP_VERSION = '103'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "103"' working_source/app/xps_update.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/publish-v103.yml .trigger_publish_v103
          git rm -f .github/workflows/sync-v103-docs.yml .trigger_v103_docs_sync
          git add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md working_source/docs/AGENTS.md working_source/docs/PROJECT_CONTEXT.md working_source/docs/RELEASE_CHECKLIST.md
          git commit -m 'Document v103 release and clean publish machinery'
          git push origin HEAD:v95-work

      - name: Mirror authoritative root docs to main
        run: |
          set -euo pipefail
          git fetch origin main v95-work
          rm -rf ../xps-main-docs
          git worktree add ../xps-main-docs origin/main
          for name in AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md; do
            cp "$name" "../xps-main-docs/$name"
          done
          git -C ../xps-main-docs config user.name 'github-actions[bot]'
          git -C ../xps-main-docs config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ../xps-main-docs add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md
          if git -C ../xps-main-docs diff --cached --quiet; then
            echo 'Main documentation already synchronized.'
          else
            git -C ../xps-main-docs commit -m 'Document XPS Tracker Updater v103'
            git -C ../xps-main-docs push origin HEAD:main
          fi

      - name: Final public-state checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main v95-work
          test "$(git show origin/v95-work:working_source/app/reno_scan_updater.py | grep -c "APP_VERSION = '103'")" -eq 1
          test "$(git show origin/v95-work:working_source/app/xps_update.py | grep -c 'CURRENT_VERSION = "103"')" -eq 1
          for path in .github/workflows/publish-v103.yml .trigger_publish_v103 .github/workflows/sync-v103-docs.yml .trigger_v103_docs_sync; do
            if git cat-file -e "origin/v95-work:$path" 2>/dev/null; then
              echo "Temporary release file still exists: $path" >&2
              exit 1
            fi
          done
          git show origin/main:update_manifest.json > /tmp/v103-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/v103-manifest.json').read_text(encoding='utf-8'))
          assert data['version']=='103',data
          assert data['sha256']=='0235204171d6ff172eb6f8cb56ace5480e2056efaa6798817222fcb3d59e02a7',data
          PY
          grep -q 'Current production release: v103' <(git show origin/main:README.md)
          grep -q 'Production version: \*\*v103\*\*' <(git show origin/main:AGENTS.md)
          echo 'v103 documentation, manifest, and cleanup verified.'

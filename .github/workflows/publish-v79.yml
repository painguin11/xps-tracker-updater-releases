name: Publish XPS Tracker Updater v79

on:
  push:
    branches:
      - v79-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'PUBLISH_V79' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated v79 source
        uses: actions/checkout@v4
        with:
          ref: v79-work
          fetch-depth: 0

      - name: Install geometry-test dependencies
        run: python -m pip install --disable-pip-version-check -q numpy opencv-python-headless

      - name: Compile and run release regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_v79_layout_speed.py
          python working_source/tests/regression_v78_rollback.py
          python working_source/tests/regression_v75_811_ocr.py
          python working_source/tests/regression_v74_row_filtering.py
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '79'" in app
          assert 'CURRENT_VERSION = "79"' in updater
          assert 'strong=collect_vertical_rules(cinv,.18,.80)' in app
          assert 'if len(column_boxes)>20: return None,0,0' in app
          assert 'def _batch_cleaning_length_candidates' in app
          assert 'def retry_total_length_ocr' not in app
          print('v79 release source guard passed.')
          PY

      - name: Package app and source bundle
        run: |
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -name '*.pyc' -delete
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip" XPS_Tracker_Updater)
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          rm -rf "$RUNNER_TEMP/source_v79"
          mkdir -p "$RUNNER_TEMP/source_v79/XPS_Tracker_Updater_Source_v79"
          cp -a working_source/. "$RUNNER_TEMP/source_v79/XPS_Tracker_Updater_Source_v79/"
          find "$RUNNER_TEMP/source_v79" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/source_v79" -name '*.pyc' -delete
          (cd "$RUNNER_TEMP/source_v79" && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v79.zip" XPS_Tracker_Updater_Source_v79)
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip" | tee "$RUNNER_TEMP/v79.sha256"

      - name: Create draft release and upload ZIP
        run: |
          existing="$(gh api -H 'Accept: application/vnd.github+json' repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="v79") | .id' | head -1)"
          if [ -n "$existing" ]; then
            release_id="$existing"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=true -f name='XPS Tracker Updater v79' >/dev/null
          else
            release_id="$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name='v79' -f target_commitish='v79-work' -f name='XPS Tracker Updater v79' -f body='v79 fixes compact B&C layout preparation stalls by detecting clean table grid rules before gap-repair and refusing implausible fake-column layouts. v78 cleaning-length OCR and fail-closed total validation remain unchanged.' -F draft=true --jq .id)"
          fi
          existing_asset="$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq '.assets[]? | select(.name=="XPS_Tracker_Updater_v79.zip") | .id' | head -1)"
          if [ -n "$existing_asset" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$existing_asset" >/dev/null
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/XPS_Tracker_Updater_v79.zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=XPS_Tracker_Updater_v79.zip" >/dev/null
          echo "$release_id" > "$RUNNER_TEMP/release_id"

      - name: Verify checksum and publish release
        run: |
          release_id="$(cat "$RUNNER_TEMP/release_id")"
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v79.sha256")"
          ok=0
          for i in 1 2 3 4 5 6; do
            release_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
            asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v79.zip") | .size')"
            asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v79.zip") | .digest')"
            if [ "${asset_size:-0}" -gt 0 ] && [ "$asset_digest" = "sha256:$local_sha" ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=false >/dev/null
          final_json="$(gh api "repos/${{ github.repository }}/releases/$release_id")"
          final_url="$(printf '%s' "$final_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v79.zip") | .browser_download_url')"
          test "$final_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v79/XPS_Tracker_Updater_v79.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$final_url" > "$RUNNER_TEMP/verified_url"

      - name: Check out main for manifest and source bundle
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Update manifest and source bundle
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v79.zip" ./XPS_Tracker_Updater_Source_v79.zip
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'79',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Detect clean compact B&C table grid rules before gap-repair',
              'Prevent repeated text strokes from becoming dozens of fake columns',
              'Reject implausible layouts above 20 columns before expensive master-assisted OCR',
              'Preserve v78 aligned Wheel Walk column OCR and fail-closed total validation unchanged'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          context=Path('PROJECT_CONTEXT.md')
          if context.exists():
              text=context.read_text(encoding='utf-8')
              marker='## Current Production Release\n'
              block=(marker+'- **v79**\n- Compact B&C tables detect uninterrupted grid rules before gap-repair.\n'
                     '- Implausible layouts above 20 columns are rejected before master-assisted OCR.\n'
                     '- v78 aligned cleaning-length OCR and fail-closed total validation remain unchanged.\n\n')
              if marker in text:
                  start=text.index(marker)
                  next_section=text.find('\n## ',start+len(marker))
                  text=block+(text[next_section+1:] if next_section!=-1 else '')
              else:
                  text=block+text
              context.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v79.zip update_manifest.json PROJECT_CONTEXT.md
          git commit -m 'Publish v79 source bundle and update manifest'
          git push origin HEAD:main
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="79"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          test -s XPS_Tracker_Updater_Source_v79.zip
          echo 'v79 release, source bundle, and manifest verified.'

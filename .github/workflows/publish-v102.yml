name: Publish XPS Tracker Updater v102

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_publish_v102'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr zip unzip >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Prepare v102 source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('working_source/app/reno_scan_updater.py')
          text = app.read_text(encoding='utf-8')
          old = "APP_VERSION = '101'"
          new = "APP_VERSION = '102'"
          assert text.count(old) == 1, 'unexpected APP_VERSION baseline'
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          updater = Path('working_source/app/xps_update.py')
          text = updater.read_text(encoding='utf-8')
          old = 'CURRENT_VERSION = "101"'
          new = 'CURRENT_VERSION = "102"'
          assert text.count(old) == 1, 'unexpected CURRENT_VERSION baseline'
          updater.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('working_source/app/README_XPS_Tracker_Updater.txt')
          text = readme.read_text(encoding='utf-8')
          assert text.startswith('XPS Tracker Updater v101\n')
          text = text.replace('XPS Tracker Updater v101\n', 'XPS Tracker Updater v102\n', 1)
          text = text.replace('Production release: v101. Development: v95-work / working_source.',
                              'Production release: v102. Development: v95-work / working_source.', 1)
          text = text.replace(
              'Selective whole-work-order discard and a larger MH count preview are pending\nrequests and are not included in v101.\n',
              'v102 adds selective whole-work-order discard, an Update Master option to ignore\nproblem work orders and continue with clean work orders, and a larger Manhole\ncount confirmation preview.\n', 1)
          section = '''\nVersion 102 selective work-order review controls\n-----------------------------------------------\n- Adds Discard Work Order(s) during review, including multi-selection.\n- Update Master can ignore complete problem work orders and continue with only\n  the clean work orders, while preserving the existing review flow as an option.\n- Discarded/ignored work orders are removed from pending extracted rows, Trouble\n  Tickets, total/count validation blockers, and unprocessed-page blockers.\n- Enlarges the Manhole expected-count Description of Work preview for easier\n  reading of small handwriting.\n- Core OCR/table parsing behavior remains unchanged from v101.\n'''
          if 'Version 102 selective work-order review controls' not in text:
              text += section
          readme.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            working_source/app/reno_scan_updater.py \
            working_source/app/xps_review_controls.py \
            working_source/app/xps_update.py

      - name: Run active regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          tests = [
            'regression_post_v100_826_trouble_geometry.py',
            'regression_post_v100_trouble_cells.py',
            'regression_trouble_workbook.py',
            'regression_post_v99_faint_vertical_grid.py',
            'regression_post_v98_short_wide_compact_table.py',
            'regression_post_v97_cleaning_clipped_digits.py',
            'regression_post_v96_msa_editable_fields.py',
            'regression_post_v95_new_packet_ocr.py',
            'regression_post_v95_padded_endpoint_ids.py',
            'regression_post_v95_msa_suffix_review.py',
            'regression_v95_faint_compact_rows.py',
            'regression_v95_exact_endpoint_priority.py',
            'regression_v94_stacked_endpoint_digits.py',
            'regression_v93_workorder_low_confidence_blank.py',
            'regression_v93_new_asset_notes.py',
            'regression_v92_workorder_4_or_5_digits.py',
            'regression_v91_workorder_color_ocr.py',
            'regression_v91_new_asset_preview_and_endpoint_recovery.py',
            'regression_v90_review_ui.py',
            'regression_v89_review_workflow.py',
            'regression_v89_printed_pair_identity.py',
            'regression_v89_manhole_count_and_final_total.py',
            'regression_v88_continuations.py',
            'regression_v87_total_summary_separator.py',
            'regression_v86_assets_and_edit.py',
            'regression_v85_edit_row_previews.py',
            'regression_v85_mandatory_rows_and_length_votes.py',
            'regression_v84_real_packet_length_logic.py',
            'regression_v83_length_recovery.py',
            'regression_v83_exact_pdf_numbers.py',
            'regression_v83_total_preview_group_errors.py',
            'regression_v82_pair_video_lengths.py',
            'regression_v82_master_asset_format.py',
            'regression_v82_suffix_guard.py',
            'regression_v82_cleaning_header_noise.py',
            'regression_v82_layout_threshold.py',
            'regression_v81_header_outline.py',
            'regression_v80_ocr_total_ui.py',
            'regression_v79_layout_speed.py',
            'regression_v78_rollback.py',
            'regression_v75_811_ocr.py',
            'regression_v74_row_filtering.py',
            'regression_v73_total_dates.py',
            'regression_compact_table_fallback.py',
            'regression_length_totals.py',
            'regression_split_pipes.py',
            'regression_new_assets.py',
            'regression_master_insert.py',
            'regression_r2_endpoint_ocr.py',
            'regression_v102_review_wrapper.py',
          ]
          root = Path('working_source/tests')
          for name in tests:
              path = root / name
              if not path.exists():
                  raise SystemExit(f'Missing active regression: {path}')
              print(f'===== {path} =====', flush=True)
              subprocess.run([sys.executable, str(path)], check=True)
          print(f'PASS: {len(tests)} active regression scripts')
          PY
          git diff --check

      - name: Commit release source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            working_source/app/reno_scan_updater.py \
            working_source/app/xps_update.py \
            working_source/app/README_XPS_Tracker_Updater.txt
          git commit -m 'Prepare XPS Tracker Updater v102'
          git push origin HEAD:v95-work
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and validate package
        id: package
        run: |
          set -euo pipefail
          rm -rf dist XPS_Tracker_Updater_v102.zip
          mkdir -p dist/XPS_Tracker_Updater
          rsync -a \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            working_source/app/ dist/XPS_Tracker_Updater/

          if find dist -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then
            echo 'Private/customer document type found in package; refusing release.' >&2
            find dist -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print >&2
            exit 1
          fi

          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_review_controls.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          test -f dist/XPS_Tracker_Updater/setup_and_run.bat

          (cd dist && zip -rq ../XPS_Tracker_Updater_v102.zip XPS_Tracker_Updater)
          unzip -t XPS_Tracker_Updater_v102.zip
          SHA=$(sha256sum XPS_Tracker_Updater_v102.zip | awk '{print $1}')
          SIZE=$(stat -c%s XPS_Tracker_Updater_v102.zip)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Built XPS_Tracker_Updater_v102.zip size=$SIZE sha256=$SHA"

      - name: Create v102 release and verify public asset
        env:
          GH_TOKEN: ${{ github.token }}
          REL_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha }}
          EXPECTED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          if gh release view v102 >/dev/null 2>&1; then
            echo 'v102 already exists; refusing to overwrite.' >&2
            exit 1
          fi

          gh release create v102 XPS_Tracker_Updater_v102.zip \
            --target "$REL_SHA" \
            --title 'XPS Tracker Updater v102' \
            --notes 'Adds selective whole-work-order discard during review, allows Update Master to ignore complete problem work orders and continue with clean work orders, and enlarges the Manhole expected-count preview for small handwriting. Existing v101 OCR, matching, Trouble Ticket, MSA, continuation, and master-write safeguards are preserved.'

          rm -rf verify-public
          mkdir verify-public
          gh release download v102 --pattern 'XPS_Tracker_Updater_v102.zip' --dir verify-public
          test -f verify-public/XPS_Tracker_Updater_v102.zip
          ACTUAL_SHA=$(sha256sum verify-public/XPS_Tracker_Updater_v102.zip | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s verify-public/XPS_Tracker_Updater_v102.zip)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          echo "Verified public asset size=$ACTUAL_SIZE sha256=$ACTUAL_SHA"

      - name: Advance public updater manifest only after verification
        env:
          VERIFIED_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf ../xps-main
          git worktree add ../xps-main origin/main
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('../xps-main/update_manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert str(data.get('version')) == '101', data
          data['version'] = '102'
          data['download_url'] = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v102/XPS_Tracker_Updater_v102.zip'
          data['sha256'] = os.environ['VERIFIED_SHA']
          data['release_notes'] = [
              'Discard one or multiple complete work orders from the pending review before updating the master',
              'When Update Master finds problem work orders, ignore those whole work orders and continue with only clean work orders',
              'Remove ignored work orders from pending rows, Trouble Tickets, validation blockers, and unprocessed-page blockers',
              'Show a substantially larger Manhole expected-count preview so small handwriting is easier to confirm',
          ]
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git -C ../xps-main config user.name 'github-actions[bot]'
          git -C ../xps-main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ../xps-main add update_manifest.json
          git -C ../xps-main commit -m 'Point auto-updater manifest to v102'
          git -C ../xps-main push origin HEAD:main

      - name: Verify public release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha }}
          EXPECTED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          gh release view v102 --json tagName,name,assets
          git fetch origin main
          git show origin/main:update_manifest.json > /tmp/update_manifest_v102.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/update_manifest_v102.json').read_text(encoding='utf-8'))
          assert data['version'] == '102', data
          assert data['download_url'] == 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v102/XPS_Tracker_Updater_v102.zip', data
          assert data['sha256'] == os.environ['EXPECTED_SHA'], data
          print('Verified public manifest:', data['version'], data['sha256'])
          PY
          rm -rf verify-final
          mkdir verify-final
          gh release download v102 --pattern 'XPS_Tracker_Updater_v102.zip' --dir verify-final
          FINAL_SHA=$(sha256sum verify-final/XPS_Tracker_Updater_v102.zip | awk '{print $1}')
          FINAL_SIZE=$(stat -c%s verify-final/XPS_Tracker_Updater_v102.zip)
          test "$FINAL_SHA" = "$EXPECTED_SHA"
          test "$FINAL_SIZE" = "$EXPECTED_SIZE"
          echo "FINAL_RELEASE_SHA=$FINAL_SHA"
          echo "FINAL_RELEASE_SIZE=$FINAL_SIZE"

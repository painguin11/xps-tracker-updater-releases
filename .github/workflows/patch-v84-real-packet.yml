name: Patch v84 real packet

on:
  push:
    branches: [v84-work]
    paths:
      - .github/workflows/patch-v84-real-packet.yml
      - .trigger_v84_real_packet

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v84 work branch
        uses: actions/checkout@v4
        with:
          ref: v84-work
          fetch-depth: 0

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q numpy opencv-python-headless

      - name: Apply v84 real-packet fixes
        run: python .github/scripts/apply_v84_total_length_recovery.py

      - name: Compile and run regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          python working_source/tests/regression_v84_real_packet_length_logic.py
          python working_source/tests/regression_v83_length_recovery.py
          python working_source/tests/regression_v83_exact_pdf_numbers.py
          python working_source/tests/regression_v83_total_preview_group_errors.py
          python working_source/tests/regression_v82_pair_video_lengths.py
          python working_source/tests/regression_v82_master_asset_format.py
          python working_source/tests/regression_v82_suffix_guard.py
          python working_source/tests/regression_v82_cleaning_header_noise.py
          python working_source/tests/regression_v82_layout_threshold.py
          python working_source/tests/regression_v81_header_outline.py
          python working_source/tests/regression_v80_ocr_total_ui.py
          python working_source/tests/regression_v79_layout_speed.py

      - name: Commit validated v84 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v84_real_packet_length_logic.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Fix real packet length reconciliation [skip ci]"
            git push origin HEAD:v84-work
          fi

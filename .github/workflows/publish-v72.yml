name: Publish XPS Tracker Updater v72

on:
  push:
    branches:
      - v72-work

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out v72 working source
        uses: actions/checkout@v4
        with:
          ref: v72-work
          fetch-depth: 0

      - name: Set v72 versions and bundled release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py')
          text=app.read_text(encoding='utf-8')
          if "APP_VERSION = '71'" in text:
              text=text.replace("APP_VERSION = '71'","APP_VERSION = '72'",1)
          elif "APP_VERSION = '72'" not in text:
              raise SystemExit('Unexpected APP_VERSION')
          app.write_text(text,encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          text=updater.read_text(encoding='utf-8')
          if 'CURRENT_VERSION = "71"' in text:
              text=text.replace('CURRENT_VERSION = "71"','CURRENT_VERSION = "72"',1)
          elif 'CURRENT_VERSION = "72"' not in text:
              raise SystemExit('Unexpected CURRENT_VERSION')
          updater.write_text(text,encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          text=readme.read_text(encoding='utf-8')
          if 'Version 72 compact-table detection' not in text:
              text += '''\n\nVersion 72 compact-table detection\n----------------------------------\n- Keeps the existing strict Year 15 / Phase 2 grid detector unchanged for normal\n  pages.\n- If the strict detector fails, isolates the largest connected table region and\n  validates row/column rules relative to the table itself instead of the full\n  scanned page.\n- Handles smaller B&C pair tables such as the 8/26/2026 packet while still using\n  detected grid boundaries and header roles rather than fixed column numbers.\n'''
          readme.write_text(text,encoding='utf-8')
          PY

      - name: Compile app and updater
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py

      - name: Verify v72 versions and scoped fix
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          updater=Path('working_source/app/xps_update.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '72'" in app
          assert 'CURRENT_VERSION = "72"' in updater
          assert 'def _year15_compact_grid_bands' in app
          assert "geometry_source='compact table grid'" in app
          assert 'rule[2]-rule[1]>=max_span*.85' in app
          assert 'def _read_pair_table_printed_total' in app
          assert 'TOTAL LENGTH VALIDATION FAILURE(S) — UPDATE MASTER BLOCKED' in app
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in app, required
          print('Version and scoped-fix checks passed.')
          PY

      - name: Run non-fixture regressions
        run: |
          rm -rf output/package_v69
          mkdir -p output/package_v69/XPS_Tracker_Updater
          cp -a working_source/app/. output/package_v69/XPS_Tracker_Updater/
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          echo 'Customer PDF fixtures are intentionally not stored in this public repository.'

      - name: Package release and source bundle
        run: |
          find working_source -type d -name __pycache__ -prune -exec rm -rf {} +
          find working_source -name '*.pyc' -delete
          rm -rf dist
          mkdir -p dist/XPS_Tracker_Updater
          cp -a working_source/app/. dist/XPS_Tracker_Updater/
          (cd dist && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip" XPS_Tracker_Updater)
          (cd working_source && zip -qr "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v72.zip" app tests -x '*/__pycache__/*' '*.pyc')
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip"
          unzip -t "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v72.zip"
          test "$(zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip" | head -1)" = 'XPS_Tracker_Updater/'
          for required in reno_scan_updater.py xps_update.py README_XPS_Tracker_Updater.txt setup_and_run.bat run_xps_tracker.bat update_config.json; do
            zipinfo -1 "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip" | grep -qx "XPS_Tracker_Updater/$required"
          done
          sha256sum "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip" | tee "$RUNNER_TEMP/v72.sha256"

      - name: Save final v72 working source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          if ! git diff --cached --quiet; then
            git commit -m "Finalize v72 app source [skip ci]"
            git push origin HEAD:v72-work
          fi

      - name: Check out main for production source bundle
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 0

      - name: Commit v72 source bundle and project context to main
        working-directory: mainrepo
        run: |
          cp "$RUNNER_TEMP/XPS_Tracker_Updater_Source_v72.zip" ./XPS_Tracker_Updater_Source_v72.zip
          python - <<'PY'
          from pathlib import Path
          path=Path('PROJECT_CONTEXT.md')
          text=path.read_text(encoding='utf-8')
          text=text.replace('Current production version: **v71**. The repository\'s v71 source bundle contains',
                            'Current production version: **v72**. The repository\'s v72 source bundle contains',1)
          marker='## Current v71 fixes\n'
          section='''## Current v72 fixes\n\n- Normal Year 15 / Phase 2 pair tables still use the existing strict full-page\n  grid detector.\n- If that detector fails, a compact-table fallback isolates the largest connected\n  table region and measures grid continuity relative to the table itself.\n- This handles small/light B&C tables without hard-coding column positions. The\n  8/26/2026 packet was locally checked at 7 columns on page 4 and 9 columns on\n  pages 10 and 12; the customer PDF itself is not stored in this repository.\n\n'''
          if '## Current v72 fixes' not in text:
              if marker not in text:
                  raise SystemExit('Current v71 context marker not found')
              text=text.replace(marker,section+marker,1)
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XPS_Tracker_Updater_Source_v72.zip PROJECT_CONTEXT.md
          git commit -m "Add XPS Tracker Updater v72 source bundle"
          git push origin HEAD:main

      - name: Create public v72 release
        working-directory: mainrepo
        run: |
          if gh release view v72 >/dev/null 2>&1; then
            echo 'v72 release already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v72 "$RUNNER_TEMP/XPS_Tracker_Updater_v72.zip" \
            --target main \
            --title 'XPS Tracker Updater v72' \
            --notes $'v72 fixes compact B&C pair-table detection.\n\n- Normal layouts keep the existing strict detector unchanged.\n- When that fails, the app isolates the table and evaluates its grid relative to the table size rather than the full scanned page.\n- This addresses the 8/26/2026 page 4 failure and the similarly compact cleaning tables later in that packet.\n- Column roles are still derived from detected grid/header evidence; no fixed 8/26 column positions were added.\n\nv71 fail-closed length-total validation remains included.'

      - name: Verify public release asset checksum
        working-directory: mainrepo
        run: |
          local_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/v72.sha256")"
          release_json="$(gh api repos/${{ github.repository }}/releases/tags/v72)"
          asset_name="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v72.zip") | .name')"
          asset_size="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v72.zip") | .size')"
          asset_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v72.zip") | .digest')"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="XPS_Tracker_Updater_v72.zip") | .browser_download_url')"
          test "$asset_name" = 'XPS_Tracker_Updater_v72.zip'
          test "$asset_size" -gt 0
          test "$asset_digest" = "sha256:$local_sha"
          test "$asset_url" = 'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v72/XPS_Tracker_Updater_v72.zip'
          printf '%s\n' "$local_sha" > "$RUNNER_TEMP/verified_sha"
          printf '%s\n' "$asset_url" > "$RUNNER_TEMP/verified_url"

      - name: Update auto-update manifest only after asset verification
        working-directory: mainrepo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=Path(os.environ['RUNNER_TEMP']+'/verified_sha').read_text().strip()
          url=Path(os.environ['RUNNER_TEMP']+'/verified_url').read_text().strip()
          data={
            'version':'72',
            'download_url':url,
            'sha256':sha,
            'release_notes':[
              'Detect compact B&C pipe and cleaning tables relative to the table size when strict full-page grid detection fails',
              'Preserve the existing strict detector for normal layouts',
              'Keep column mapping evidence-based rather than hard-coding positions',
              'Retain v71 fail-closed PDF total-length validation'
            ]
          }
          Path('update_manifest.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git commit -m 'Point auto-updater manifest to v72'
          git push origin HEAD:main

      - name: Verify committed manifest
        working-directory: mainrepo
        run: |
          git pull --ff-only origin main
          remote_manifest="$(gh api 'repos/${{ github.repository }}/contents/update_manifest.json?ref=main' --jq .content | base64 -d)"
          printf '%s\n' "$remote_manifest" | jq -e '.version=="72"'
          printf '%s\n' "$remote_manifest" | jq -e '.download_url=="https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v72/XPS_Tracker_Updater_v72.zip"'
          verified_sha="$(cat "$RUNNER_TEMP/verified_sha")"
          test "$(printf '%s\n' "$remote_manifest" | jq -r .sha256)" = "$verified_sha"
          echo 'v72 manifest verified.'

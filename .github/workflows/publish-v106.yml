name: Publish XPS Tracker Updater v106

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_publish_v106'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tesseract-ocr zip unzip >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Prepare v106 source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('working_source/app/reno_scan_updater.py')
          text=app.read_text(encoding='utf-8')
          assert text.count("APP_VERSION = '105'")==1, 'unexpected APP_VERSION baseline'
          app.write_text(text.replace("APP_VERSION = '105'","APP_VERSION = '106'",1),encoding='utf-8')

          updater=Path('working_source/app/xps_update.py')
          text=updater.read_text(encoding='utf-8')
          assert text.count('CURRENT_VERSION = "105"')==1, 'unexpected CURRENT_VERSION baseline'
          updater.write_text(text.replace('CURRENT_VERSION = "105"','CURRENT_VERSION = "106"',1),encoding='utf-8')

          readme=Path('working_source/app/README_XPS_Tracker_Updater.txt')
          text=readme.read_text(encoding='utf-8')
          assert text.startswith('XPS Tracker Updater v105\n')
          text=text.replace('XPS Tracker Updater v105\n','XPS Tracker Updater v106\n',1)
          text=text.replace('Current status (September 16, 2026)','Current status (September 17, 2026)',1)
          text=text.replace('Production release: v105. Development: v95-work / working_source.',
                            'Production release: v106. Development: v95-work / working_source.',1)
          old=('v105 preserves independently confirmed one-letter NEW MANHOLE suffixes even\n'
               'when another OCR pass reads the same physical cell as an existing base ID.\n'
               'The stricter confirmation safeguard remains in place to avoid false suffixes.\n')
          new=('v106 keeps every structurally detected Pipe, Cleaning, and Manhole row visible\n'
               'when OCR or master matching fails, improves rotated Pipe-table classification,\n'
               'and adds explicit single-row removal for reviewer-confirmed false extra rows.\n')
          assert old in text
          text=text.replace(old,new,1)
          section='''\nVersion 106 physical-row review and single-row removal
------------------------------------------------------
- Once table geometry establishes a Pipe, Cleaning, or Manhole data row, failed
  ID OCR or failed master matching cannot silently delete it from Live Summary.
- Unmatched rows remain review-only with PDF previews and can be corrected with
  Edit Selected, which immediately rechecks matching.
- Rotated Pipe tables get a structured-header retry when the fast OCR pass misses
  Length Surveyed / Upstream MH / Downstream MH, preventing false Cleaning
  classification from an orientation-sensitive first pass.
- Remove Selected Row lets the reviewer explicitly remove one false extra
  extracted Pipe, Cleaning, or Manhole row after analysis without discarding the
  rest of the work order.
- Single-row removal requires confirmation, preserves all other rows and Trouble
  Tickets, and recalculates Manhole expected counts, Pipe/Cleaning total checks,
  and duplicate/MSA review state. It does not auto-merge or delete another row.
- Preserves the v105 NEW MANHOLE suffix safeguards and all earlier OCR, review,
  continuation, MSA, Trouble Ticket, total, and master-write behavior.
'''
          if 'Version 106 physical-row review and single-row removal' not in text:
              text += section
          readme.write_text(text,encoding='utf-8')
          PY

          python -m py_compile \
            working_source/app/reno_scan_updater.py \
            working_source/app/xps_review_controls.py \
            working_source/app/xps_update.py
          git diff --check

      - name: Run full active regression suite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          tests=[
            'regression_post_v105_single_row_removal.py',
            'regression_post_v105_physical_rows_never_discarded.py',
            'regression_post_v105_rotated_pipe_and_manhole_row.py',
            'regression_post_v103_manhole_reordered_columns.py',
            'regression_post_v102_manhole_expected_count_retry.py',
            'regression_post_v102_manhole_partial_tokens.py',
            'regression_post_v100_826_trouble_geometry.py',
            'regression_post_v100_trouble_cells.py',
            'regression_trouble_workbook.py',
            'regression_post_v99_faint_vertical_grid.py',
            'regression_post_v98_short_wide_compact_table.py',
            'regression_post_v97_cleaning_clipped_digits.py',
            'regression_post_v96_msa_editable_fields.py',
            'regression_post_v95_new_packet_ocr.py',
            'regression_post_v95_padded_endpoint_ids.py',
            'regression_post_v95_msa_suffix_review.py',
            'regression_v95_faint_compact_rows.py',
            'regression_v95_exact_endpoint_priority.py',
            'regression_v94_stacked_endpoint_digits.py',
            'regression_v93_workorder_low_confidence_blank.py',
            'regression_v93_new_asset_notes.py',
            'regression_v92_workorder_4_or_5_digits.py',
            'regression_v91_workorder_color_ocr.py',
            'regression_v91_new_asset_preview_and_endpoint_recovery.py',
            'regression_v90_review_ui.py',
            'regression_v89_review_workflow.py',
            'regression_v89_printed_pair_identity.py',
            'regression_v89_manhole_count_and_final_total.py',
            'regression_v88_continuations.py',
            'regression_v87_total_summary_separator.py',
            'regression_v86_assets_and_edit.py',
            'regression_v85_edit_row_previews.py',
            'regression_v85_mandatory_rows_and_length_votes.py',
            'regression_v84_real_packet_length_logic.py',
            'regression_v83_length_recovery.py',
            'regression_v83_exact_pdf_numbers.py',
            'regression_v83_total_preview_group_errors.py',
            'regression_v82_pair_video_lengths.py',
            'regression_v82_master_asset_format.py',
            'regression_v82_suffix_guard.py',
            'regression_v82_cleaning_header_noise.py',
            'regression_v82_layout_threshold.py',
            'regression_v81_header_outline.py',
            'regression_v80_ocr_total_ui.py',
            'regression_v79_layout_speed.py',
            'regression_v78_rollback.py',
            'regression_v75_811_ocr.py',
            'regression_v74_row_filtering.py',
            'regression_v73_total_dates.py',
            'regression_compact_table_fallback.py',
            'regression_length_totals.py',
            'regression_split_pipes.py',
            'regression_new_assets.py',
            'regression_master_insert.py',
            'regression_r2_endpoint_ocr.py',
            'regression_v102_review_wrapper.py',
          ]
          root=Path('working_source/tests')
          for name in tests:
              path=root/name
              if not path.exists(): raise SystemExit(f'Missing active regression: {path}')
              print(f'===== {path} =====',flush=True)
              subprocess.run([sys.executable,str(path)],check=True)
          print(f'FULL ACTIVE REGRESSION SUITE: {len(tests)}/{len(tests)} passed')
          PY
          git diff --check

      - name: Audit release scope
        run: |
          set -euo pipefail
          if git diff --name-only 4cc9eea175701d4920713603aa8ad644fe642426...HEAD | grep -Ei '\.(pdf|xlsx|xls|xlsm)$' ; then
            echo 'Private/customer document type was committed after v105; refusing release.' >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(pdf|xlsx|xls|xlsm)$' ; then
            echo 'Private/customer document type is tracked in Git; refusing release.' >&2
            exit 1
          fi
          grep -q "APP_VERSION = '106'" working_source/app/reno_scan_updater.py
          grep -q 'CURRENT_VERSION = "106"' working_source/app/xps_update.py
          grep -q 'XPS Tracker Updater v106' working_source/app/README_XPS_Tracker_Updater.txt
          grep -q "text='Remove Selected Row'" working_source/app/xps_review_controls.py
          grep -q 'def _remove_pending_record' working_source/app/xps_review_controls.py
          grep -q 'regression_post_v105_single_row_removal' RELEASE_CHECKLIST.md
          grep -q 'regression_post_v105_physical_rows_never_discarded' RELEASE_CHECKLIST.md
          grep -q 'regression_post_v105_rotated_pipe_and_manhole_row' RELEASE_CHECKLIST.md

      - name: Commit release source
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py working_source/app/xps_update.py working_source/app/README_XPS_Tracker_Updater.txt
          git commit -m 'Prepare XPS Tracker Updater v106'
          git push origin HEAD:v95-work
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and validate package
        id: package
        run: |
          set -euo pipefail
          rm -rf dist XPS_Tracker_Updater_v106.zip
          mkdir -p dist/XPS_Tracker_Updater
          rsync -a --exclude '__pycache__' --exclude '*.pyc' working_source/app/ dist/XPS_Tracker_Updater/
          if find dist -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.xlsm' \) -print -quit | grep -q .; then
            echo 'Private/customer document type found in package; refusing release.' >&2
            exit 1
          fi
          test -f dist/XPS_Tracker_Updater/reno_scan_updater.py
          test -f dist/XPS_Tracker_Updater/xps_review_controls.py
          test -f dist/XPS_Tracker_Updater/xps_update.py
          test -f dist/XPS_Tracker_Updater/run_xps_tracker.bat
          test -f dist/XPS_Tracker_Updater/setup_and_run.bat
          (cd dist && zip -rq ../XPS_Tracker_Updater_v106.zip XPS_Tracker_Updater)
          unzip -t XPS_Tracker_Updater_v106.zip
          if unzip -Z1 XPS_Tracker_Updater_v106.zip | awk -F/ 'NF && $1!="XPS_Tracker_Updater" {bad=1} END {exit bad}'; then :; else
            echo 'ZIP contains an unexpected top-level entry.' >&2
            exit 1
          fi
          SHA=$(sha256sum XPS_Tracker_Updater_v106.zip | awk '{print $1}')
          SIZE=$(stat -c%s XPS_Tracker_Updater_v106.zip)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Built XPS_Tracker_Updater_v106.zip size=$SIZE sha256=$SHA"

      - name: Create v106 release and verify public asset
        env:
          GH_TOKEN: ${{ github.token }}
          REL_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha }}
          EXPECTED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          if gh release view v106 >/dev/null 2>&1; then
            echo 'v106 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v106 | grep -q .; then
            echo 'v106 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create v106 XPS_Tracker_Updater_v106.zip \
            --target "$REL_SHA" \
            --title 'XPS Tracker Updater v106' \
            --notes 'Keeps every structurally detected Pipe, Cleaning, and Manhole row visible when OCR or master matching fails; improves rotated Pipe-table classification with a structured-header retry; and adds Remove Selected Row so a reviewer can explicitly remove one false extra extracted row without discarding the rest of the work order. Row removal recalculates Manhole counts, Pipe/Cleaning totals, and duplicate/MSA review state without auto-removing another row. All v105 and earlier safeguards are preserved.'
          rm -rf verify-public && mkdir verify-public
          gh release download v106 --pattern 'XPS_Tracker_Updater_v106.zip' --dir verify-public
          ACTUAL_SHA=$(sha256sum verify-public/XPS_Tracker_Updater_v106.zip | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s verify-public/XPS_Tracker_Updater_v106.zip)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          echo "Verified public asset size=$ACTUAL_SIZE sha256=$ACTUAL_SHA"

      - name: Advance manifest, sync release docs, and clean temporary machinery
        env:
          REL_SHA: ${{ steps.source.outputs.sha }}
          VERIFIED_SHA: ${{ steps.package.outputs.sha }}
          VERIFIED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          git worktree add /tmp/xps-main origin/main
          python - <<'PY'
          from pathlib import Path
          import json,os,re,shutil

          rel_sha=os.environ['REL_SHA']
          sha=os.environ['VERIFIED_SHA']
          size=os.environ['VERIFIED_SIZE']

          p=Path('AGENTS.md'); text=p.read_text(encoding='utf-8')
          assert '- Production version: **v105**.' in text
          text=text.replace('- Production version: **v105**.','- Production version: **v106**.',1)
          text=text.replace('Preserve all documented behavior through v105 unless the user explicitly asks',
                            'Preserve all documented behavior through v106 unless the user explicitly asks',1)
          p.write_text(text,encoding='utf-8')

          p=Path('PROJECT_CONTEXT.md'); text=p.read_text(encoding='utf-8')
          assert 'Current production version: **v105**.' in text
          text=text.replace('Current production version: **v105**.','Current production version: **v106**.',1)
          text=text.replace('preserve the full released v105 baseline','preserve the full released v106 baseline',1)
          text=text.replace('## State audit — September 16, 2026','## State audit — September 17, 2026',1)
          text=re.sub(r'- Current production release: \*\*v105\*\* at release source commit `[^`]+`\.',
                      f'- Current production release: **v106** at release source commit `{rel_sha}`.',text,count=1)
          text=text.replace('- `working_source/app/reno_scan_updater.py` and `working_source/app/xps_update.py` are both version 105.',
                            '- `working_source/app/reno_scan_updater.py` and `working_source/app/xps_update.py` are both version 106.',1)
          text=text.replace('which points to the verified v105 public asset and SHA-256 below.',
                            'which points to the verified v106 public asset and SHA-256 below.',1)
          text=text.replace('The v105 Linux release job compiled the app, passed the full 53/53 active regression matrix',
                            'The v106 Linux release job compiled the app, passed the full 56/56 active regression matrix',1)
          text=text.replace('Temporary v105 publishing/documentation machinery is removed after this sync.',
                            'Temporary v106 publishing/documentation machinery is removed after this sync.',1)
          header='## Pending after v105 — rotated Pipe classification and never-discard physical rows\n'
          assert header in text
          released=(f'## Released in v106 — rotated Pipe classification, never-discard rows, and single-row review removal\n\n'
                    f'Public v106 release:\n\n'
                    f'- Tag: `v106`\n'
                    f'- Release title: `XPS Tracker Updater v106`\n'
                    f'- Release commit: `{rel_sha}`\n'
                    f'- Asset: `XPS_Tracker_Updater_v106.zip`\n'
                    f'- Asset size: `{size}` bytes\n'
                    f'- SHA-256: `{sha}`\n'
                    f'- Public updater manifest on `main` points to `https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v106/XPS_Tracker_Updater_v106.zip` and was advanced only after the public release asset was downloaded back and its size/SHA-256 matched exactly.\n'
                    f'- Full active Linux CI suite: **56/56 regression scripts passed** on the v106-versioned source. Private customer fixture OCR and Windows Excel COM/live Tk GUI paths were not run by this Linux release job.\n\n')
          text=text.replace(header,released,1)
          text=text.replace('while production remains v105.','and is included in v106.',1)
          p.write_text(text,encoding='utf-8')

          p=Path('RELEASE_CHECKLIST.md'); text=p.read_text(encoding='utf-8')
          assert 'current **v105 production baseline**' in text
          text=text.replace('current **v105 production baseline**','current **v106 production baseline**',1)
          marker='v105 is the current production release:\n'
          assert marker in text
          block=(f'v106 is the current production release:\n\n'
                 f'- Release commit: `{rel_sha}`\n'
                 f'- Asset: `XPS_Tracker_Updater_v106.zip`\n'
                 f'- Size: `{size}` bytes\n'
                 f'- SHA-256: `{sha}`\n'
                 f'- Public manifest version/URL/SHA were re-read and verified after release asset re-download.\n'
                 f'- 56/56 active Linux regression scripts passed on the versioned release source. Private fixture OCR and Windows Excel COM/live Tk GUI checks remain platform/fixture limitations rather than release-job coverage.\n\n'
                 f'Previous verified production reference follows for history.\n\n'
                 f'v105 was the previous production release:\n')
          text=text.replace(marker,block,1)
          p.write_text(text,encoding='utf-8')

          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          start=text.index('## Current production release:')
          end=text.index('## v85',start)
          current=(f'## Current production release: v106\n\n'
                   f'- Release: [XPS Tracker Updater v106](https://github.com/painguin11/xps-tracker-updater-releases/releases/tag/v106)\n'
                   f'- Release commit: `{rel_sha}`\n'
                   f'- Asset: `XPS_Tracker_Updater_v106.zip`\n'
                   f'- Size: `{size}` bytes\n'
                   f'- SHA-256: `{sha}`\n\n'
                   f'The production updater reads `update_manifest.json` on `main`, which points to\n'
                   f'this verified v106 asset. Development remains on `v95-work`, under `working_source/`.\n'
                   f'Old source bundles and release notes are historical; fetch the latest development\n'
                   f'head and read its project instructions before editing.\n\n'
                   f'v106 keeps physical Pipe/Cleaning/Manhole rows visible for review when OCR or\n'
                   f'master matching fails, improves rotated Pipe classification, and adds explicit\n'
                   f'single-row removal for reviewer-confirmed false extra rows.\n\n')
          text=text[:start]+current+text[end:]
          if '## v106\n' not in text:
              insert='''## v106

- Keeps structurally detected Pipe, Cleaning, and Manhole rows visible when OCR/master matching fails.
- Adds a structured-header retry for rotated Pipe tables whose fast orientation OCR misses the Pipe headers.
- Adds **Remove Selected Row** so a reviewer can remove one false extra extracted row without discarding the rest of the work order.
- Recalculates Manhole counts, Pipe/Cleaning totals, and duplicate/MSA review state after explicit row removal without auto-removing another row.
- Passed all **56 active Linux regression scripts** before publishing; the public ZIP size/SHA-256 were verified after re-download before the auto-update manifest advanced.

'''
              text=text.replace('## Development baseline\n',insert+'## Development baseline\n',1)
          p.write_text(text,encoding='utf-8')

          for name in ('PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md'):
              shutil.copyfile(name,Path('working_source/docs')/name)

          manifest={
              'version':'106',
              'download_url':'https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v106/XPS_Tracker_Updater_v106.zip',
              'sha256':sha,
              'release_notes':[
                  'Keep structurally detected Pipe, Cleaning, and Manhole rows visible when OCR or master matching fails',
                  'Add Remove Selected Row for reviewer-confirmed false extra extracted rows without discarding the work order',
                  'Recalculate Manhole counts, Pipe/Cleaning totals, and duplicate/MSA review state after explicit row removal',
                  'Retry rotated Pipe headers at higher resolution when the fast orientation pass misses the table identity'
              ]
          }
          Path('/tmp/xps-main/update_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          for name in ('AGENTS.md','PROJECT_CONTEXT.md','RELEASE_CHECKLIST.md','README.md'):
              shutil.copyfile(name,Path('/tmp/xps-main')/name)
          PY

          git diff --check

          cd /tmp/xps-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_manifest.json AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md
          git diff --cached --check
          git commit -m 'Publish XPS Tracker Updater v106 manifest and docs'
          git push origin HEAD:main
          cd "$GITHUB_WORKSPACE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/publish-v106.yml .trigger_publish_v106
          git add AGENTS.md PROJECT_CONTEXT.md RELEASE_CHECKLIST.md README.md
          git add working_source/docs/PROJECT_CONTEXT.md working_source/docs/RELEASE_CHECKLIST.md
          git diff --cached --check
          git commit -m 'Document v106 release and clean publish machinery'
          git push origin HEAD:v95-work

      - name: Verify public release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REL_SHA: ${{ steps.source.outputs.sha }}
          VERIFIED_SHA: ${{ steps.package.outputs.sha }}
          VERIFIED_SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          gh release view v106 --json tagName,name,targetCommitish,assets > /tmp/v106-release.json
          python - <<'PY'
          import json,os,subprocess
          release=json.load(open('/tmp/v106-release.json'))
          assert release['tagName']=='v106'
          assert release['name']=='XPS Tracker Updater v106'
          asset=next(a for a in release['assets'] if a['name']=='XPS_Tracker_Updater_v106.zip')
          assert int(asset['size'])==int(os.environ['VERIFIED_SIZE'])
          raw=subprocess.check_output(['git','show','origin/main:update_manifest.json'],text=True)
          manifest=json.loads(raw)
          assert manifest['version']=='106'
          assert manifest['download_url']=='https://github.com/painguin11/xps-tracker-updater-releases/releases/download/v106/XPS_Tracker_Updater_v106.zip'
          assert manifest['sha256']==os.environ['VERIFIED_SHA']
          PY
          test ! -e .github/workflows/publish-v106.yml
          test ! -e .trigger_publish_v106
          test ! -e .github/workflows/red-single-row-removal.yml
          test ! -e .github/workflows/verify-single-row-removal.yml
          echo "v106 verified: source=$REL_SHA size=$VERIFIED_SIZE sha256=$VERIFIED_SHA"

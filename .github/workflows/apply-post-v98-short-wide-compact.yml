name: Apply post-v98 short-wide compact-table fix

on:
  push:
    branches: [v95-work]
    paths:
      - '.trigger_post_v98_short_wide_compact'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v95-work
          fetch-depth: 0

      - name: Install regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk >/dev/null
          python -m pip install --quiet numpy opencv-python-headless openpyxl pymupdf pillow pytesseract

      - name: Apply short-wide compact-table safeguard
        run: python working_source/tools/apply_post_v98_short_wide_compact.py

      - name: Compile and run full active regression suite
        run: |
          set -e
          python -m py_compile working_source/app/reno_scan_updater.py working_source/app/xps_update.py
          for test in working_source/tests/regression_*.py; do
            echo "===== $test ====="
            python "$test"
          done

      - name: Commit tested source, regression, and context
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working_source/app/reno_scan_updater.py \
                  working_source/tests/regression_post_v98_short_wide_compact_table.py \
                  PROJECT_CONTEXT.md
          if git diff --cached --quiet; then
            echo 'No source change to commit.'
          else
            git commit -m 'Recognize very short wide compact tables'
            git push origin HEAD:v95-work
          fi

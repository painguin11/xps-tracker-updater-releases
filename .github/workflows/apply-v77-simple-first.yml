name: Apply v77 simple-first cleaning lengths

on:
  push:
    branches:
      - v77-work

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'APPLY_V77_SIMPLE_FIRST' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v77 work branch
        uses: actions/checkout@v4
        with:
          ref: v77-work
          fetch-depth: 0

      - name: Apply narrow v77 patch
        run: |
          python .github/scripts/apply_v77_simple_first_lengths.py
          python - <<'PY'
          from pathlib import Path

          p=Path('working_source/tests/regression_v75_811_ocr.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert \"OCR_CACHE_VERSION = 'v3'\" in text",
                      "assert \"OCR_CACHE_VERSION = 'v4'\" in text")
          s=s.replace("assert 'consensus.extend(_ocr_gridless_number_candidates(value_cell,True))' in text",
                      "assert 'def _fallback_cleaning_length_candidates' in text")
          p.write_text(s,encoding='utf-8')

          p=Path('working_source/tests/regression_length_totals.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert 'needs_consensus=(not value_candidates or value is None or len(distinct)>1' in source",
                      "assert 'value_candidates=_simple_cleaning_length_candidates(value_cell)' in source\nassert 'def _fallback_cleaning_length_candidates' in source")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compile and run regressions
        run: |
          python -m py_compile working_source/app/reno_scan_updater.py
          python -m py_compile working_source/app/xps_update.py
          python working_source/tests/regression_v77_simple_first.py
          python working_source/tests/regression_v76_layout_skip.py
          python working_source/tests/regression_v75_811_ocr.py
          python working_source/tests/regression_v74_row_filtering.py
          python working_source/tests/regression_v73_total_dates.py
          python working_source/tests/regression_compact_table_fallback.py
          python working_source/tests/regression_length_totals.py
          python working_source/tests/regression_split_pipes.py
          python working_source/tests/regression_new_assets.py
          python working_source/tests/regression_master_insert.py
          python working_source/tests/regression_trouble_workbook.py
          python - <<'PY'
          from pathlib import Path
          src=Path('working_source/app/reno_scan_updater.py').read_text(encoding='utf-8')
          assert "APP_VERSION = '76'" in src  # version bump occurs only when publishing
          assert "OCR_CACHE_VERSION = 'v4'" in src
          for required in ('def parse_pipe_list','def parse_manhole_list','def parse_year15_pair_list','def parse_year15_manholes','def parse_trouble_ticket'):
              assert required in src, required
          print('v77 staged validation passed.')
          PY

      - name: Commit validated v77 source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_source/app/reno_scan_updater.py working_source/tests/regression_v77_simple_first.py working_source/tests/regression_v75_811_ocr.py working_source/tests/regression_length_totals.py
          git commit -m 'Stage v77 simple-first cleaning length OCR [skip ci]'
          git push origin HEAD:v77-work
